function salaryAction(act, el, e, t) {
  const st = salState();
  switch (act) {
    case 'saltab': st.tab = el.dataset.tab; if (st.tab !== 'employee') st.back = null; render(); break;
    case 'salback': goBackFromEmployee(st); break;
    case 'salprev': case 'salnext': { const nm = monthAdd(st.month, act === 'salprev' ? -1 : 1); if (nm >= CAL_MIN_YEAR + '-01') { st.month = nm; render(); } break; }
    case 'salpickmonth': openCalendar(el, { value: st.month + '-01', pickMonth: true, onPick: iso => { st.month = iso.slice(0, 7); render(); } }); break;
    case 'salgoemp': e.preventDefault(); goToEmployee(st, el.dataset.emp); break;
    case 'saladdemp': addEmployeeModal(emp => { st.emp = emp.id; }); break;
    case 'saleditemp': e.preventDefault(); editEmployeeModal(el.dataset.emp); break;
    case 'saladdrow': salAddRowModal(st.tab === 'employee' ? st.emp : '', st.tab === 'month' ? st.month : curMonth()); break;
    case 'saladdfor': e.preventDefault(); salAddRowModal(el.dataset.emp, st.tab === 'month' ? st.month : curMonth()); break;
    case 'salslip': { const row = t.rows.find(r => r.id === el.dataset.row); if (row) openDoc(t, row, 'payslip'); break; }
    case 'salpick': {
      if (e.target.closest('input,button,a')) return;
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.pdf,application/pdf';
      inp.onchange = () => inp.files[0] && handlePayslipFile(inp.files[0]); inp.click(); break;
    }
    case 'salxlsx': {
      if (st.tab === 'year') {
        const data = salYearData(st.year);
        exportExcel('סיכום שכר שנתי ' + st.year, ['עובד', ...SAL_YEAR_COLS.map(x => x[1])], data.map(d => [d.emp.name, ...SAL_YEAR_COLS.map(([k]) => d[k])]));
      } else {
        const rows = st.tab === 'month' ? t.rows.filter(r => rowMonth(r) === st.month) : salRowsOf(st.emp);
        const cols = t.cols.filter(c => !['serial', 'year', 'month'].includes(c.key));
        exportExcel('משכורות ' + (st.tab === 'month' ? monthLabel(st.month) : employeeName(st.emp)), ['חודש', ...cols.map(c => c.label)], rows.map(row => { const c = calcRow('salaries', row); return [monthLabel(rowMonth(row)), ...cols.map(col => ['num', 'numAuto', 'computed'].includes(col.type) ? (col.type === 'num' ? (num(row[col.key]) === null ? '' : num(row[col.key])) : c[col.key]) : cellText(t, col, row, c))]; }));
      }
      break;
    }
  }
}

  toast('קורא תלושים מתוך ' + file.name + '…', 'info', 2500);
  let pages;
  try { pages = await readPayslipPdf(file); } catch (e) { toast('קריאת ה-PDF נכשלה: ' + e.message, 'err', 7000); return; }
  if (!pages.length) { toast('לא זוהו תלושי שכר בקובץ. ניתן להוסיף משכורות ידנית.', 'err', 6000); return; }

}

async function commitPayslips(file, plan, bg) {
  const inc = plan.filter(x => x.include);
  if (!inc.length) { toast('לא נבחרו תלושים', 'warn'); return; }
  const btn = $('#psCommit', bg); if (btn) { btn.disabled = true; btn.textContent = 'קולט…'; }
  const saveErrors = [];
  const t = salT();
  // שמירת הקובץ לתיקייה (חייב לקרות מיד בתגובה ללחיצה)
  let canSave = false, why = '';
  const path = (t.holder.docPath || '').trim();
  if (!DocFS.supported) why = 'הדפדפן אינו תומך בשמירה לתיקייה';
  else if (!path) why = 'לא הוגדר נתיב שמירת תלושים';
  else { try { if (!DocFS.root) await DocFS.connect(); canSave = await DocFS.permission(true); if (canSave && !DocFS.resolve(path).ok) { canSave = false; why = DocFS.resolve(path).error; } else if (!canSave) why = 'לא ניתנה הרשאה לתיקייה'; } catch (e) { why = fsErrText(e); } }
  // פיצול: עמוד לכל עובד → קובץ נפרד בתיקייה בשם העובד
  let src = null, splitWhy = '';
  if (window.PDFLib) { try { src = await window.PDFLib.PDFDocument.load(await file.arrayBuffer(), { ignoreEncryption: true }); } catch (e) { splitWhy = e.message; } }
  else splitWhy = 'ספריית פיצול PDF לא נטענה (נדרש חיבור לאינטרנט)';
  let fullSaved = false, fullName = file.name, fullTo = '', fullSub = '';
  const fullBlob = URL.createObjectURL(file);
  // הקובץ השלם נשמר בתיקיית ריכוז לפי שנה וחודש: <נתיב תלושים>\ריכוז\YYYY\MM
  const incMonths = [...new Set(inc.map(x => x.p.month))].sort();
  const fullSaves = [];
  if (canSave) for (const ym of incMonths) {
    const sub = 'ריכוז/' + ym.slice(0, 4) + '/' + ym.slice(5, 7);
    const one = new File([file], 'ריכוז תלושים ' + ym.slice(5, 7) + '-' + ym.slice(0, 4) + '.pdf', { type: 'application/pdf' });
    try {
      const r = await DocFS.save(path + '/' + sub, one, { overwrite: true, fallbackName: 'payslips_' + ym.slice(5, 7) + '-' + ym.slice(0, 4) + '.pdf' });
      fullSaves.push([DocFS.rootName, ...r.segs, r.name].join('\\'));
      if (!fullSaved) { fullSaved = true; fullName = r.name; fullSub = sub; fullTo = fullSaves[0]; }
    } catch (e) { saveErrors.push('ריכוז ' + monthLabel(ym) + ': ' + fsErrText(e)); }
  }
  let created = 0, updated = 0, newEmps = 0, savedCount = 0;
  for (const x of inc) {
    const p = x.p;
    let emp = x.empId === '__new' ? null : empById(x.empId);
    if (!emp) { emp = { id: uid('emp'), name: p.name || ('עובד ' + (p.empNo || '')), empNo: p.empNo || '', startDate: p.startDate || '' }; S.employees.push(emp); newEmps++; }
    else { if (!emp.empNo && p.empNo) emp.empNo = p.empNo; if (!emp.startDate && p.startDate) emp.startDate = p.startDate; }
    let row = salRowFor(emp.id, p.month);
    const fields = {
      hours: p.hours ?? null, hourlyRate: p.hourlyRate ?? null, baseSalary: p.baseSalary, recuperation: p.recuperation, holidayGift: p.holidayGift, travelOther: p.travelOther,
      grossTotal: p.gross, deductions: p.totalDeductions, net: p.net, pensionEmployee: p.pensionEmployee, pensionEmployer: p.pensionEmployer, severance: p.severance,
      kerenEmployee: p.kerenEmployee, kerenEmployer: p.kerenEmployer, reportDate: p.reportDate || '', source: 'תלוש', importFile: file.name
    };
    if (row) { Object.assign(row, fields); if (row.ov) { delete row.ov.pensionTransfer; delete row.ov.kerenTransfer; } updated++; }
    else {
      row = newRow('salaries');
      Object.assign(row, fields, { serial: nextSerial(t.rows), employeeId: emp.id, year: p.month.slice(0, 4), month: p.month.slice(5, 7), status: false, payDate: '', notes: 'יובא מתלוש ' + monthLabel(p.month) });
      t.rows.push(row); created++;
    }
    const old = findDoc(t.tabId, row.id, 'payslip'); if (old) delete S.docs[old.id];
    const id = uid('doc');
    const doc = S.docs[id] = { id, tabId: t.tabId, rowId: row.id, field: 'payslip', number: monthLabel(p.month), linkedAt: new Date().toISOString(), pathAtLink: path, saved: false };
    if (src) {
      // קובץ אישי לעובד: <נתיב תלושים>\<שם העובד>\תלוש MM-YYYY - שם.pdf
      const out = await window.PDFLib.PDFDocument.create();
      const [pg] = await out.copyPages(src, [p.page - 1]); out.addPage(pg);
      const bytes = await out.save();
      const folder = emp.name.replace(/[\\/<>:"|?*]/g, '_').trim() || ('עובד ' + (emp.empNo || ''));
      const fname = ('תלוש ' + p.month.slice(5, 7) + '-' + p.month.slice(0, 4) + ' - ' + folder + '.pdf');
      const one = new File([bytes], fname, { type: 'application/pdf' });
      Object.assign(doc, { fileName: fname, subdir: folder, size: one.size });
      sessionBlobs[id] = URL.createObjectURL(one); sessionFiles[id] = one;
      if (canSave) {
        try { const r = await DocFS.save(path + '/' + folder, one, { overwrite: true, fallbackName: 'payslip_' + p.month.slice(5, 7) + '-' + p.month.slice(0, 4) + '_' + (emp.empNo || 'emp') + '.pdf' }); Object.assign(doc, { fileName: r.name, saved: true, savedTo: [DocFS.rootName, ...r.segs, r.name].join('\\'), savedAt: new Date().toISOString() }); savedCount++; }
        catch (e) { doc.saveError = fsErrText(e); saveErrors.push(emp.name + ': ' + doc.saveError); }

/* =====================================================================
   חוצץ „פנסיות” – הפקדות לקופות (פנסיה / קרן השתלמות / ביטוח מנהלים)
   שורה = עובד × חודש × קופה · יבוא "רשימת תשלומים לתקופת גביה" (שיקלולית)
   ===================================================================== */

/* ---------------- פענוח דוח הפקדות ---------------- */
// בדוח זה הספרות והפיסוק מוזזים בתו אחד אחורה (/ = 0, + = פסיק, - = נקודה) והאות נ מופיעה כ-U+F8FF
const penText = s => String(s).replace(/\uF8FF/g, 'נ');
function penNum(s) {
  s = String(s).trim();
  if (!/^[\/0-8+\-.$]+$/.test(s)) return null;
  const d = [...s].map(ch => String.fromCharCode(ch.charCodeAt(0) + 1)).join('');
  const n = parseFloat(d.replace(/,/g, '').replace(/%$/, ''));
  return isFinite(n) ? n : null;
}
function parsePensionPage(items) {
  const its = items.filter(i => i.str && i.str.trim()).map(i => ({ raw: i.str.trim(), s: penText(i.str.trim()).replace(/!/g, '"'), x: i.transform[4], y: i.transform[5] }));
  its.sort((a, b) => b.y - a.y || b.x - a.x);
  const lines = []; let cur = null;
  for (const it of its) { if (!cur || Math.abs(it.y - cur.y) > 4) { cur = { y: it.y, it: [] }; lines.push(cur); } cur.it.push(it); }
  const title = its.find(i => /רשימת תשלומים לתקופת גביה/.test(i.s));
  if (!title) return null;
  const r = { rows: [] };
  const m = title.s.match(/(\d{1,2})\/(\d{4})/); if (m) r.month = m[2] + '-' + pad2(m[1]);
  if (its.some(i => /סה"כ לכל הקופות/.test(i.s))) { r.summary = true; return r; }
  const fl = lines.find(l => l.it.some(i => /^קופה\s*\d+/.test(i.s)));
  if (fl) {
    const code = fl.it.find(i => /^קופה\s*\d+/.test(i.s));
    r.fundCode = (code.s.match(/\d+/) || [''])[0];
    r.fundName = fl.it.filter(i => i !== code).sort((a, b) => b.x - a.x).map(i => i.s).join(' ').replace(/^-\s*/, '').trim();
  }
  const hName = its.find(i => i.s === 'שם העובד');
  if (!hName) return r;
  const hdr = lines.find(l => l.y > hName.y + 3 && l.y < hName.y + 16);
  const labels = hdr ? hdr.it.filter(i => i.x < 440) : [];
  const keren = labels.some(i => /קה"ל/.test(i.s));
  const fn = r.fundName || '';
  r.fundKind = keren || /השתלמות/.test(fn) ? 'קרן השתלמות' : /מנהלים/.test(fn) ? 'ביטוח מנהלים' : (/גמל/.test(fn) && !/פנסי/.test(fn)) ? 'קופת גמל' : 'פנסיה';
  const cols = [{ k: 'salaryBase', x: 486 }, { k: 'days', x: 446 }, { k: 'total', x: 45 }];
  for (const lb of labels) {
    const side = lb.x > 290 ? 'emp' : 'er';
    const k = /גמל/.test(lb.s) ? 'Gemel' : /כושר/.test(lb.s) ? 'Dis' : /פיצויים/.test(lb.s) ? 'Sev' : /קה"ל/.test(lb.s) ? 'Keren' : 'Other';
    cols.push({ k: side + k, x: lb.x });
  }
  const totL = lines.find(l => l.it.some(i => /סה"כ עובדים/.test(i.s)));
  for (const l of lines) {
    if (l.y >= hName.y - 4 || (totL && l.y <= totL.y + 2)) continue;
    const nameIt = l.it.find(i => /[\u0590-\u05FF]/.test(i.s) && i.x > 650 && i.x < 760);
    if (!nameIt) continue;
    const noIt = l.it.find(i => i.x > 760 && penNum(i.raw) !== null);
    const nm = nameIt.s.replace(/,/g, '-');
    const w = nm.split(/\s+/);
    const row = { empNo: noIt ? String(penNum(noIt.raw)) : '', nameRaw: nm, name: w.length > 1 ? w.slice(1).join(' ') + ' ' + w[0] : nm };
    cols.forEach(c => row[c.k] = 0);
    for (const it of l.it) {
      if (it.x >= 500) continue;
      const v = penNum(it.raw); if (v === null) continue;
      const c = cols.reduce((best, cc) => Math.abs(cc.x - it.x) < Math.abs(best.x - it.x) ? cc : best, cols[0]);
      row[c.k] = r2((row[c.k] || 0) + v);
    }
    row.empDeposit = r2(nz(row.empGemel) + nz(row.empKeren) + nz(row.empDis) + nz(row.empOther));
    row.erDeposit = r2(nz(row.erGemel) + nz(row.erKeren) + nz(row.erDis) + nz(row.erOther));
    row.severance = r2(nz(row.erSev));
    r.rows.push(row);
  }
  return r;
}

  if (window.pdfjsLib.GlobalWorkerOptions && !window.pdfjsLib.GlobalWorkerOptions.workerSrc) window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const doc = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;

}

const PEN_YEAR_COLS = [['months', 'חודשי הפקדה'], ['pension', 'פנסיה / גמל'], ['keren', 'קרן השתלמות'], ['empDep', 'הפקדות עובד'], ['er', 'הפקדות מעסיק'], ['sev', 'פיצויים'], ['total', 'סה״כ להעברה'], ['paid', 'שולם'], ['unpaid', 'טרם שולם']];

async function handlePensionFile(file) {
  if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') { toast('יש לבחור קובץ PDF', 'warn'); return; }
  toast('קורא דוח הפקדות מתוך ' + file.name + '…', 'info', 2500);

  try { pages = await readPensionPdf(file); } catch (e) { toast('קריאת ה-PDF נכשלה: ' + e.message, 'err', 7000); return; }
  const plan = [];
  pages.filter(p => !p.summary).forEach(p => p.rows.forEach(row => { const emp = matchEmployee(row); plan.push({ p, row, empId: emp ? emp.id : '__new', include: true }); }));

async function commitPensions(file, pages, plan, bg) {
  const inc = plan.filter(x => x.include);

  const btn = $('#penCommit', bg); if (btn) { btn.disabled = true; btn.textContent = 'קולט…'; }

  else { try { if (!DocFS.root) await DocFS.connect(); canSave = await DocFS.permission(true); if (canSave && !DocFS.resolve(path).ok) { canSave = false; why = DocFS.resolve(path).error; } else if (!canSave) why = 'לא ניתנה הרשאה לתיקייה'; } catch (e) { why = fsErrText(e); } }

  const fullSaves = []; let fullName = file.name, fullSub = '';
  if (canSave) for (const ym of [...new Set(inc.map(x => x.p.month))].sort()) {

    const one = new File([file], 'ריכוז פנסיה ' + ym.slice(5, 7) + '-' + ym.slice(0, 4) + '.pdf', { type: 'application/pdf' });
    try { const r = await DocFS.save(path + '/' + sub, one, { overwrite: true, fallbackName: 'pension_' + ym.slice(5, 7) + '-' + ym.slice(0, 4) + '.pdf' }); fullSaves.push([DocFS.rootName, ...r.segs, r.name].join('\\')); if (!fullSub) { fullSub = sub; fullName = r.name; } }

    const p = x.p;

    const fields = {
      fundCode: p.fundCode || '', fundName: p.fundName || '', fundKind: p.fundKind, salaryBase: x.row.salaryBase, days: x.row.days,
      empDeposit: x.row.empDeposit, erDeposit: x.row.erDeposit, severance: x.row.severance, reportTotal: x.row.total,

      one = new File([await out.save()], fname, { type: 'application/pdf' });
      if (canSave) {
        try { const r = await DocFS.save(path + '/' + folder, one, { overwrite: true, fallbackName: 'pension_' + g.month.slice(5, 7) + '-' + g.month.slice(0, 4) + '_' + (g.emp.empNo || 'emp') + '.pdf' }); finalName = r.name; saved = true; savedTo = [DocFS.rootName, ...r.segs, r.name].join('\\'); savedCount++; }
        catch (e) { err = fsErrText(e); saveErrors.push(g.emp.name + ': ' + err); }
      }
    }
    const blobUrl = one ? URL.createObjectURL(one) : fullBlob;
    for (const { row, page } of g.rows) {
      const old = findDoc(t.tabId, row.id, 'report'); if (old) delete S.docs[old.id];
      const id = uid('doc');
      S.docs[id] = one
        ? { id, tabId: t.tabId, rowId: row.id, field: 'report', number: monthLabel(g.month), fileName: finalName, subdir: folder, page: g.pages.indexOf(page) + 1, size: one.size, linkedAt: new Date().toISOString(), pathAtLink: path, saved, savedTo, saveError: saved ? undefined : err }
        : { id, tabId: t.tabId, rowId: row.id, field: 'report', number: monthLabel(g.month), fileName: fullName, subdir: fullSub || undefined, page, size: file.size, linkedAt: new Date().toISOString(), pathAtLink: path, saved: !!fullSaves.length, savedTo: fullSaves[0] || '', saveError: fullSaves.length ? undefined : (splitWhy || why) };
      sessionBlobs[id] = blobUrl; sessionFiles[id] = one || file;
    }
  }
  const st = penState(); st.month = inc[0].p.month; st.tab = 'month';
  closeModal(); markDirty(); render();
  toast('נקלטו ' + (created + updated) + ' הפקדות (' + created + ' חדשות, ' + updated + ' עודכנו' + (newEmps ? ', ' + newEmps + ' עובדים חדשים' : '') + ')', 'ok', 6000);
  if (savedCount) toast('נשמר דוח אישי לכל עובד (' + savedCount + ' קבצים) תחת ' + DocFS.displayTarget(path), 'info', 7000);
  if (fullSaves.length) toast('הקובץ השלם נשמר בתיקיית הריכוז: ' + fullSaves.join(' · '), 'info', 8000);
  if (!savedCount && !fullSaves.length) toast('הדוחות לא נשמרו בתיקייה: ' + (why || saveErrors[0] || splitWhy || '') + ' (ניתן לצפות בהם עד רענון הדף)', 'warn', 8000);
  saveErrors.slice(0, 3).forEach(m => toast('שמירה נכשלה – ' + m, 'err', 7000));
}
/* =====================================================================
   חוצץ אשראי · כרטיסים · תקופה · סינון · תשלומים · חיובים קבועים · התאמה לבנק
   ===================================================================== */

function ccState() {
  const st = UI.cc || (UI.cc = { tab: 'month', month: '', year: '', card: '', cat: '', q: '' });
  if (!st.month) {
    const ds = S.ops.credit.rows.map(r => r.chargeDate || r.txDate).filter(Boolean).sort();
    st.month = ds.length ? ds[ds.length - 1].slice(0, 7) : curMonth();
  }
  if (!st.year) st.year = st.month.slice(0, 4);
  return st;
}
function ccSel() { return UI.ccSel || (UI.ccSel = new Set()); }
function ccRowMonth(row) { const d = row.chargeDate || row.txDate || ''; return d ? d.slice(0, 7) : ''; }
function ccGroupKey(row) { return (row.chargeDate || row.txDate || '') + '|' + (row.cardId || ''); }

/* ---------- סינון ---------- */
function ccFilter(t) {
  const st = ccState();
  const q = (st.q || '').trim().toLowerCase();
  return t.rows.map(row => ({ row, c: calcRow('credit', row) })).filter(({ row, c }) => {
    const m = ccRowMonth(row);
    if (st.tab === 'month' && m !== st.month) return false;
    if (st.tab === 'year' && m.slice(0, 4) !== st.year) return false;
    if (st.card && row.cardId !== st.card) return false;
    if (st.cat && (row.category || '') !== st.cat) return false;
    if (q) {
      const hay = [row.merchant, row.description, row.notes, row.docNo, fmtMoney(c.amount), String(row.amount || ''), ccCardName(row.cardId), row.category].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => String(b.row.chargeDate || b.row.txDate || '').localeCompare(String(a.row.chargeDate || a.row.txDate || '')) ||
    String(b.row.txDate || '').localeCompare(String(a.row.txDate || '')) || nz(b.row.serial) - nz(a.row.serial));
}

/* ---------- תצוגה ---------- */
function renderCredit(v, t) {

    '<button class="btn sm" data-act="cccards">💳 ניהול כרטיסים (' + cards.filter(c => c.active !== false).length + ')</button>' +
    '<button class="btn sm" data-act="ccrecur">🔁 חיובים קבועים (' + (S.ops.credit.recurring || []).length + ')</button></div>';

  const noCard = t.rows.filter(r => !r.cardId).length;
  const noCharge = t.rows.filter(r => !r.chargeDate && r.txDate).length;

  if (noCharge) msgs.push(['warn', noCharge + ' עסקאות ללא תאריך חיוב – בתזרים הן משויכות לפי תאריך העסקה.']);

  if (msgs.length) h += '<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px">' + msgs.map(x => '<div class="msg ' + x[0] + '">' + x[1] + '</div>').join('') + '</div>';

    (ccAuthMatchCount() ? '<button class="btn" data-act="ccauthmatch" title="תשלומי רשויות שהוזנו מראש וממתינים לשיוך לעסקה בכרטיס">🔗 שיוך רשויות צפויות (' + ccAuthMatchCount() + ')</button>' : '') +
    '<button class="btn gold" data-act="save">💾 שמירה</button><button class="btn" data-act="ccxlsx">📗 Excel</button></div>';

  // בורר תקופה + סינונים
  h += '<div class="cc-bar">';
  if (st.tab === 'month') {
    h += '<div class="cc-per"><button class="btn sm" data-act="ccprev">‹ חודש קודם</button>' +
      '<button class="period-pill" data-act="ccpickmonth">' + st.month.slice(5) + '.' + st.month.slice(0, 4) + '</button>' +
      '<button class="btn sm" data-act="ccnext">חודש הבא ›</button></div>';
  } else if (st.tab === 'year') {
    const years = [...new Set([...t.rows.map(r => ccRowMonth(r).slice(0, 4)).filter(Boolean), curMonth().slice(0, 4), st.year])].sort().reverse();
    h += '<label class="pl">שנה <select id="ccYearSel">' + years.map(y => '<option' + (y === st.year ? ' selected' : '') + '>' + y + '</option>').join('') + '</select></label>';

  h += '<label class="pl">כרטיס <select id="ccCardSel"><option value="">כל הכרטיסים</option>' +

  h += '<input id="ccSearch" class="cc-search" type="search" placeholder="חיפוש: בית עסק, תיאור, סכום, חשבונית, הערה…" value="' + esc(st.q || '') + '">';

  h += '</div>';

  // סיכומים
  const ch = r2(items.reduce((a, x) => a + (x.c.isCredit ? 0 : x.c.amount), 0));

  h += '<div class="scards">' + statCard('עסקאות', items.length) + statCard('סה״כ חיובים', money(ch), 'bad') +

  // סיכום לפי כרטיס (כשאין סינון כרטיס)
  if (!st.card && cards.length > 1) {
    const by = {};
    items.forEach(x => { const k = x.row.cardId || ''; const o = by[k] = by[k] || { ch: 0, cr: 0, n: 0 }; if (x.c.isCredit) o.cr += x.c.amount; else o.ch += x.c.amount; o.n++; });
    const keys = Object.keys(by);
    if (keys.length) {
      h += '<div class="sal-subhead"><b>סיכום לפי כרטיס</b></div><div class="grid-wrap sal-grid"><table class="grid"><thead><tr><th>כרטיס</th><th>חברה</th><th class="num">עסקאות</th><th class="num">חיובים</th><th class="num">זיכויים</th><th class="num">נטו</th></tr></thead><tbody>';
      for (const k of keys) {
        const o = by[k], c = ccCardById(k);
        h += '<tr><td><b>' + esc(c ? c.name : 'ללא כרטיס') + '</b>' + (c && c.last4 ? ' <span class="muted">· ' + esc(c.last4) + '</span>' : '') + '</td><td>' + esc(c ? (c.company || '—') : '—') + '</td>' +
          '<td class="num">' + o.n + '</td><td class="num neg">' + fmtMoney(r2(o.ch)) + '</td><td class="num pos">' + fmtMoney(r2(o.cr)) + '</td><td class="num b">' + fmtMoney(r2(o.ch - o.cr)) + '</td></tr>';
      }
      h += '</tbody></table></div>';
    }
  }

  // חיובים חודשיים + התאמה לבנק
  h += ccChargesHTML(items);

  const selSet = ccSel();
  const selItems = items.filter(x => selSet.has(x.row.id));
  h += '<div class="sal-subhead"><b>פירוט עסקאות</b><span class="grow"></span><span class="muted" style="font-size:12px">סמן שורות בתיבות הסימון לפעולה על כמה עסקאות יחד</span></div>';
  if (selItems.length) {
    const sum = r2(selItems.reduce((a, x) => a + (x.c.isCredit ? -x.c.amount : x.c.amount), 0));
    h += '<div class="bulk-bar"><b>נבחרו ' + selItems.length + ' עסקאות</b><span class="muted">· סה״כ ' + fmtMoney(sum) + ' ₪</span>' +
      '<span class="grow"></span>' +
      '<label class="pl">שינוי קטגוריה <select id="ccBulkCat"><option value="">—</option>' + CREDIT_CATEGORIES.map(c => '<option>' + esc(c) + '</option>').join('') + '</select></label>' +
      '<label class="pl">שינוי כרטיס <select id="ccBulkCard"><option value="">—</option>' + ccCardOptions('') + '</select></label>' +
      '<button class="btn sm danger" data-act="ccdelsel">🗑 מחיקת ' + selItems.length + ' העסקאות</button>' +
      '<button class="btn sm" data-act="ccselclear">✖ ניקוי בחירה</button></div>';
  }
  h += gridHTML(t, items, {
    rowClass: (row, c) => c.isAuth ? 'authrow' : '',
    select: { has: id => selSet.has(id), act: 'ccsel', allAct: 'ccselall' }
  });
  v.innerHTML = yearsDatalist() + authCodesDatalist() + '<div id="msgs"></div>' + h;

function ccChargesHTML(items) {
  const by = {};
  for (const { row, c } of items) {
    if (!c.chargeDate) continue;
    const g = ccGroupKey(row);
    const o = by[g] = by[g] || { date: c.chargeDate, cardId: row.cardId || '', amount: 0, n: 0 };
    o.amount += c.signed; o.n++;
  }
  const keys = Object.keys(by).sort((a, b) => by[b].date.localeCompare(by[a].date));
  if (!keys.length) return '';
  let h = '<div class="sal-subhead"><b>חיובים חודשיים בבנק</b><span class="grow"></span><span class="muted" style="font-size:12px">כל חיוב הוא שורה אחת בתזרים לפי מועד החיוב בפועל</span></div>' +
    '<div class="grid-wrap sal-grid" style="max-height:260px"><table class="grid"><thead><tr><th>תאריך חיוב</th><th>כרטיס</th><th class="num">עסקאות</th><th class="num">סכום החיוב</th><th>התאמה לבנק</th><th></th></tr></thead><tbody>';
  for (const g of keys) {
    const x = by[g], rec = (S.ops.credit.recon || {})[g];
    const amt = r2(x.amount);
    const diff = rec ? r2(nz(rec.bankAmount) - amt) : null;
    h += '<tr><td class="num">' + fmtDate(x.date) + '</td><td><b>' + esc(ccCardName(x.cardId)) + '</b></td><td class="num">' + x.n + '</td><td class="num b">' + fmtMoney(amt) + '</td>' +
      '<td>' + (rec ? (Math.abs(diff) < 0.005 ? '<span class="status yes">✓ הותאם לבנק</span>' : '<span class="status no">פער ' + fmtMoney(diff) + ' ₪ (בבנק ' + fmtMoney(nz(rec.bankAmount)) + ')</span>') : '<span class="status fc">טרם הותאם</span>') + '</td>' +
      '<td><button class="btn sm" data-act="ccrecon" data-g="' + esc(g) + '">התאמה</button></td></tr>';
  }
  return h + '</tbody></table></div>';
}

      label: 'שמירה', cls: 'primary', onClick: bg => {

function addMonths(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1 + n, 1);
  const last = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
  return dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(Math.min(d, last));
}

function ccRecurring() { return S.ops.credit.recurring || (S.ops.credit.recurring = []); }
function ensureCreditRecurring() {
  let created = 0;
  const end = curMonth();
  for (const rc of ccRecurring()) {
    if (!rc.startMonth) continue;
    rc.generated = rc.generated || {};
    let m = rc.startMonth, guard = 0;
    while (m <= end && (!rc.endMonth || m <= rc.endMonth) && guard++ < 600) {
      if (!rc.generated[m]) {
        const rows = S.ops.credit.rows;
        const day = Math.min(Math.max(1, nz(rc.day) || 1), 28);
        const r = newRow('credit');
        Object.assign(r, {
          serial: nextSerial(rows), txDate: m + '-' + pad2(day), chargeDate: m + '-' + pad2(day), cardId: rc.cardId,
          merchant: rc.merchant, description: rc.notes || 'חיוב קבוע', amount: nz(rc.amount), kind: 'charge',
          category: rc.category || 'תוכנה ומנויים', recurringId: rc.id, auto: true, source: 'חיוב קבוע'
        });
        rows.push(r); rc.generated[m] = r.id; created++;
      }
      m = monthAdd(m, 1);
    }
  }
  return created;
}

/* =====================================================================
   ייבוא דוח אשראי מרוכז מהבנק (MAX / דיינרס / ישראכרט) – מספר כרטיסים
   וכמה מקטעים בקובץ אחד: עסקאות בשקלים, שלא במועד החיוב, ומט״ח.
   ===================================================================== */
function xlSerialToISO(v) {
  const n = Number(v);
  if (!isFinite(n) || n < 20000 || n > 80000) return '';
  const d = new Date(Math.round((n - 25569) * 86400000));
  return isNaN(d) ? '' : d.toISOString().slice(0, 10);
}
function ccAnyDate(v) {
  if (v == null || v === '') return '';
  const s = String(v).trim();
  if (/^\d{4,6}(\.\d+)?$/.test(s)) return xlSerialToISO(s);
  return parseDateInput(s) || '';
}
function ccIsStatement(rows) {
  return rows.some(r => (r || []).some(c => /^\s*כרטיס:\s*\d{3,4}\s*-/.test(String(c || ''))));
}
function ccParseStatement(rows) {
  const out = [];
  let card = null, hdr = null, sectionCharge = '', sectionName = '';
  const clean = x => String(x == null ? '' : x).replace(/\s+/g, ' ').trim();
  for (const raw of rows) {
    const r = (raw || []).map(clean);
    const joined = r.join(' ').trim();
    if (!joined) { hdr = null; continue; }

    const mCard = joined.match(/כרטיס:\s*(\d{3,4})\s*-\s*([^\s].*?)\s*חודש החיוב:\s*(\d{1,2}\/\d{1,2}\/\d{2,4})/);
    if (mCard) {
      card = { last4: mCard[1], company: mCard[2].trim(), charge: parseDateInput(mCard[3]) || '' };
      hdr = null; sectionCharge = card.charge; continue;
    }
    const mSec = joined.match(/^(עסקאות[^]*?)(?:חיוב בתאריך\s*(\d{1,2}\/\d{1,2}\/\d{2,4}))?$/);
    if (/^עסקאות/.test(joined) && !r.includes('תאריך עסקה')) {
      sectionName = joined;
      sectionCharge = mSec && mSec[2] ? (parseDateInput(mSec[2]) || '') : (card ? card.charge : '');
      hdr = null; continue;
    }
    if (r.includes('תאריך עסקה')) {
      hdr = {};
      r.forEach((c, i) => {
        if (c === 'תאריך עסקה') hdr.tx = i;
        else if (c === 'תאריך חיוב') hdr.charge = i;
        else if (/^שם\s*העסק$/.test(c) || c === 'שם בית העסק') hdr.merchant = i;
        else if (c === 'סכום חיוב') hdr.amount = i;
        else if (c === 'סכום עסקה' || c === 'סכום מקורי') hdr.orig = i;
        else if (c === 'מטבע עסקה' || c === 'מטבע מקורי') hdr.cur = i;
        else if (c === 'פירוט') hdr.detail = i;
      });
      continue;
    }
    if (!hdr || !card) continue;
    if (/^סה"?כ/.test(r[hdr.tx] || '') || r.some(c => /^סה"?כ$/.test(c))) { hdr = null; continue; }

    const tx = ccAnyDate(raw[hdr.tx]);
    if (!tx) continue;
    let amt = num(raw[hdr.amount != null ? hdr.amount : hdr.orig]);
    if (amt === null) amt = num(raw[hdr.orig]);
    if (amt === null) continue;
    const charge = (hdr.charge != null ? ccAnyDate(raw[hdr.charge]) : '') || sectionCharge || tx;
    const detail = hdr.detail != null ? clean(raw[hdr.detail]) : '';
    const mPay = detail.match(/(\d+)\s*מתוך\s*(\d+)/);
    const origAmt = hdr.orig != null ? num(raw[hdr.orig]) : null;
    const cur = hdr.cur != null ? clean(raw[hdr.cur]) : '';
    out.push({
      txDate: tx, chargeDate: charge, merchant: clean(raw[hdr.merchant]),
      amount: Math.abs(amt), kind: amt < 0 ? 'credit' : 'charge',
      payments: mPay ? +mPay[2] : 0, paymentNo: mPay ? +mPay[1] : 0,
      last4: card.last4, company: card.company,
      description: [detail, cur && cur !== 'ש"ח' ? 'מקור: ' + fmtNum(origAmt) + ' ' + cur : ''].filter(Boolean).join(' · '),
      section: sectionName
    });
  }
  return out;
}
function ccCardForLast4(last4, company) {
  let c = ccCards().find(x => x.last4 === last4);
  if (!c) { c = { id: uid('cc'), name: company || ('כרטיס ' + last4), last4, company: company || '', bankAccount: '', active: true }; ccCards().push(c); }
  else if (!c.company && company) c.company = company;
  return c;
}

    }, { label: 'ביטול' }]
  });
}


/* ---------- שיוך עסקת אשראי לחוצץ רשויות (בלי כפילות בתזרים) ---------- */
function ccAuthSync(row) {
  const rows = S.ops.authorities.rows;
  let a = rows.find(x => x.creditRowId === row.id);
  if (!row.authType) {
    if (a) { rows.splice(rows.indexOf(a), 1); markDirty(); }
    return;
  }
  const def = AUTHORITIES.find(x => x.name === row.authType);
  const d = row.chargeDate || row.txDate || '';
  if (!a) { a = newRow('authorities'); a.serial = nextSerial(rows); a.creditRowId = row.id; rows.push(a); }
  Object.assign(a, {
    authType: row.authType, code: def ? def.code : (a.code || ''),
    action: row.kind === 'credit' ? 'credit' : 'pay', amount: Math.abs(nz(row.amount)),
    method: 'כרטיס אשראי', year: d.slice(0, 4), month: d.slice(5, 7),
    dueDate: d, payDate: d, status: true, payVia: 'credit',
    notes: [row.merchant || '', 'שולם ב' + ccCardName(row.cardId)].filter(Boolean).join(' · ')
  });
  markDirty();
}
function ccAuthSyncAll() { S.ops.credit.rows.forEach(r => { if (r.authType) ccAuthSync(r); }); }


/* ---------- התאמה בין תשלום רשויות שהוזן מראש לעסקת האשראי שנקלטה ---------- */
function ccLinkedAuthIds() { return new Set(S.ops.authorities.rows.map(r => r.creditRowId).filter(Boolean)); }
function authAwaitingCredit() { return S.ops.authorities.rows.filter(r => !r.creditRowId && r.method === 'כרטיס אשראי'); }
function ccUnlinkedRows() {
  const linked = ccLinkedAuthIds();
  return S.ops.credit.rows.filter(r => !linked.has(r.id) && !r.authType);
}
/* כל העסקאות הפתוחות מוצעות – ממוינות לפי קרבת הסכום ואז קרבת התאריך. אין סינון שמסתיר אפשרויות. */
function ccAuthCandidates(a) {
  const amt = Math.abs(nz(a.amount));
  const base = a.dueDate || a.payDate || '';
  return ccUnlinkedRows().map(r => {
    const d = r.chargeDate || r.txDate || '';
    const dd = base && d ? Math.abs((new Date(d) - new Date(base)) / 86400000) : 999;
    const diff = r2(Math.abs(nz(r.amount)) - amt);
    const rel = amt ? Math.abs(diff) / amt : 1;
    return { r, dd, diff, rel, close: Math.abs(diff) < 1 || (rel <= 0.25 && dd <= 90) };
  }).filter(x => x.dd <= 180)
    .sort((x, y) => (Math.abs(x.diff) - Math.abs(y.diff)) || (x.dd - y.dd));
}
function ccAuthMatchCount() { return authAwaitingCredit().length; }
function ccAuthMatchModal(afterImport) {
  const waiting = authAwaitingCredit();
  if (!waiting.length) { if (!afterImport) toast('אין תשלומי רשויות שממתינים לשיוך לחיוב בכרטיס', 'info', 4000); return; }
  const rows = waiting.map(a => ({ a, cands: ccAuthCandidates(a) }));
  if (afterImport && !rows.some(x => x.cands.length)) return;
  const pick = {}, del = {};
  const taken = new Set();
  // ברירת מחדל: רק התאמה קרובה, וכל עסקה מוצעת פעם אחת בלבד
  rows.slice().sort((x, y) => {
    const bx = x.cands[0] ? Math.abs(x.cands[0].diff) : 9e9, by = y.cands[0] ? Math.abs(y.cands[0].diff) : 9e9;
    return bx - by;
  }).forEach(({ a, cands }) => {
    const best = cands.find(c => c.close && !taken.has(c.r.id));
    if (best) { pick[a.id] = best.r.id; taken.add(best.r.id); }
    else pick[a.id] = '';
  });
  const draw = bg => {
    const used = {};
    Object.values(pick).forEach(v => { if (v) used[v] = (used[v] || 0) + 1; });
    const dupPick = Object.keys(used).filter(k => used[k] > 1);
    const unmatched = rows.filter(x => !pick[x.a.id] && !del[x.a.id]).length;
    $('.mb', bg).innerHTML =
      '<p class="muted">כל תשלום שהוזן מראש ומיועד לכרטיס מופיע כאן – גם אם לא נמצאה לו התאמה אוטומטית. השורה הקיימת היא זו שמתעדכנת (לא נוצרת שורה נוספת), והסכום נלקח מהחיוב בפועל.<br>שורה שנשארת ללא שיוך תמשיך להופיע בתזרים כתנועה צפויה בנוסף לחיוב הכרטיס – כלומר כפילות. אפשר לבחור לה עסקה ידנית מהרשימה, או לסמן ״מחיקה״.</p>' +
      (dupPick.length ? '<div class="msg err" style="margin-bottom:8px">אותה עסקת אשראי נבחרה ליותר משורה אחת – יש לתקן לפני השיוך.</div>' : '') +
      (unmatched ? '<div class="msg warn" style="margin-bottom:8px">' + unmatched + ' שורות עדיין ללא שיוך – בחר עסקה או סמן מחיקה כדי למנוע כפילות בתזרים.</div>' : '') +
      '<div class="grid-wrap" style="max-height:360px"><table class="grid"><thead><tr><th>רשות</th><th>תקופה</th><th class="num">סכום שהוזן</th><th>צפי תשלום</th><th>עסקת אשראי</th><th>מחיקה</th></tr></thead><tbody>' +
      rows.map(({ a, cands }) => {
        const ca = calcRow('authorities', a);
        const cur = pick[a.id] || '';
        const dup = cur && used[cur] > 1;
        return '<tr' + (del[a.id] ? ' style="opacity:.5"' : dup ? ' class="dup-pick"' : '') + '><td><b>' + esc(ca.authName) + '</b></td><td>' + esc((a.month || '') + '/' + (a.year || '')) + '</td>' +
          '<td class="num">' + fmtMoney(Math.abs(nz(a.amount))) + '</td><td class="num">' + fmtDate(a.dueDate || a.payDate) + '</td>' +
          '<td><select data-auth="' + a.id + '"' + (del[a.id] ? ' disabled' : '') + '><option value="">— ללא שיוך —</option>' +
          cands.map(c2 => '<option value="' + c2.r.id + '"' + (cur === c2.r.id ? ' selected' : '') + '>' +
            fmtDate(c2.r.chargeDate || c2.r.txDate) + ' · ' + fmtMoney(Math.abs(nz(c2.r.amount))) + ' ₪' +
            (Math.abs(c2.diff) >= 0.005 ? ' · פער ' + (c2.diff > 0 ? '+' : '') + fmtMoney(c2.diff) : ' · סכום זהה') +
            ' · ' + esc(ccCardName(c2.r.cardId)) + ' · ' + esc((c2.r.merchant || '').slice(0, 26)) + '</option>').join('') +
          '</select>' + (cands.length ? '' : ' <span class="muted">אין עסקאות פתוחות</span>') + '</td>' +
          '<td style="text-align:center"><input type="checkbox" data-del="' + a.id + '"' + (del[a.id] ? ' checked' : '') + ' title="מחיקת השורה הצפויה מחוצץ הרשויות"></td></tr>';
      }).join('') + '</tbody></table></div>';
    $$('[data-auth]', bg).forEach(sel => sel.onchange = () => { pick[sel.dataset.auth] = sel.value; draw(bg); });
    $$('[data-del]', bg).forEach(cb => cb.onchange = () => { del[cb.dataset.del] = cb.checked; if (cb.checked) pick[cb.dataset.del] = ''; draw(bg); });
  };
  openModal({
    title: 'שיוך תשלומי רשויות שהוזנו מראש לחיובי האשראי', wide: true, body: '', onOpen: draw,
    buttons: [{
      label: 'ביצוע', cls: 'primary', onClick: bg => {
        const used = {};
        Object.values(pick).forEach(v => { if (v) used[v] = (used[v] || 0) + 1; });
        if (Object.keys(used).some(k => used[k] > 1)) { toast('אותה עסקת אשראי נבחרה ליותר משורה אחת', 'err', 5000); return false; }
        let n = 0, gaps = 0, removed = 0;
        for (const id of Object.keys(del)) {
          if (!del[id]) continue;
          const i = S.ops.authorities.rows.findIndex(x => x.id === id);
          if (i >= 0) { S.ops.authorities.rows.splice(i, 1); removed++; }
        }
        for (const id of Object.keys(pick)) {
          const ccId = pick[id]; if (!ccId) continue;
          const a = S.ops.authorities.rows.find(x => x.id === id);
          const cc = S.ops.credit.rows.find(x => x.id === ccId);
          if (!a || !cc) continue;
          const expAmt = Math.abs(nz(a.amount)), actAmt = Math.abs(nz(cc.amount));
          if (Math.abs(expAmt - actAmt) >= 0.005) { a.expectedAmount = expAmt; gaps++; } else delete a.expectedAmount;
          a.creditRowId = cc.id; a.method = 'כרטיס אשראי'; a.status = true;
          cc.authType = a.authType; if (!cc.category || cc.category === 'כללי') cc.category = 'רשויות';
          ccAuthSync(cc); n++;
        }
        markDirty(); render();
        const left = authAwaitingCredit().length;
        toast([n ? n + ' שויכו' : '', removed ? removed + ' נמחקו' : '', gaps ? gaps + ' בסכום שונה מהצפי' : '', left ? left + ' עדיין ללא שיוך (עלול להיווצר כפל)' : 'אין כפילות בתזרים'].filter(Boolean).join(' · '),
          left ? 'warn' : 'ok', 7000);
      }
    }, { label: 'סגירה' }]
  });
}
/* =====================================================================
   חוצץ רשויות · תשלום / זיכוי · תקופה · סינון לפי רשות · סיכומים
   ===================================================================== */

function authState() {
  const st = UI.auth || (UI.auth = { tab: 'month', month: '', year: '', who: '', sort: { key: 'dueDate', dir: 'asc' } });
  if (!st.month) {
    const ds = S.ops.authorities.rows.map(authRowMonth).filter(Boolean).sort();
    st.month = ds.length ? ds[ds.length - 1] : curMonth();
  }
  if (!st.year) st.year = st.month.slice(0, 4);
  if (!st.sort) st.sort = { key: 'dueDate', dir: 'asc' };
  return st;
}
function authSel() { return UI.authSel || (UI.authSel = new Set()); }
function authRowDate(row) { const c = calcRow('authorities', row); return c.cfDate || ''; }
function authRowMonth(row) { const d = authRowDate(row); return d ? d.slice(0, 7) : ''; }
function authWho(row) { return calcRow('authorities', row).authName; }

function authFilter(t) {
  const st = authState();
  let items = t.rows.map(row => ({ row, c: calcRow('authorities', row) })).filter(({ row }) => {
    const m = authRowMonth(row);
    if (st.tab === 'month' && m !== st.month) return false;
    if (st.tab === 'year' && m.slice(0, 4) !== st.year) return false;
    if (st.who && authWho(row) !== st.who) return false;
    return true;
  });
  const k = st.sort.key, dir = st.sort.dir === 'desc' ? -1 : 1;
  const col = t.cols.find(x => x.key === k);
  items.sort((a, b) => {
    let va, vb;
    if (k === 'dueDate' || k === 'payDate') { va = a.row[k] || authRowDate(a.row); vb = b.row[k] || authRowDate(b.row); }
    else if (k === 'amount') { va = a.c.amount; vb = b.c.amount; }
    else if (k === 'serial') { va = nz(a.row.serial); vb = nz(b.row.serial); }
    else { va = cellText(t, col || { key: k, type: 'text' }, a.row, a.c); vb = cellText(t, col || { key: k, type: 'text' }, b.row, b.c); }
    if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
    return String(va || '').localeCompare(String(vb || ''), 'he', { numeric: true }) * dir;
  });
  return items;
}

function renderAuthorities(v, t) {
  const st = authState();
  const items = authFilter(t);
  let h = '<div class="crumb"><h2>רשויות</h2><span class="meta">חוצץ המקור לתשלומים ולזיכויים מול רשויות · כל תנועת רשויות בתזרים מגיעה מכאן בלבד</span></div>';

  const noDate = t.rows.filter(r => !authRowDate(r) && nz(r.amount)).length;
  const noAuth = t.rows.filter(r => !r.authType).length;
  const msgs = [];
  if (noAuth) msgs.push(['warn', noAuth + ' שורות ללא בחירת רשות.']);
  if (noDate) msgs.push(['warn', noDate + ' שורות ללא תאריך – לא ייכנסו לתזרים עד להזנת תאריך צפי או תאריך בפועל.']);
  const viaCc = t.rows.filter(r => r.creditRowId).length;
  if (viaCc) msgs.push(['info', viaCc + ' תשלומים בוצעו בכרטיס אשראי (רקע תכלת) – הם נספרים כאן מול הרשות, ובתזרים הם כלולים בחיוב החודשי של הכרטיס ולכן אינם מופיעים פעמיים.']);
  const wait = authAwaitingCredit().length;
  if (wait) msgs.push(['info', wait + ' תשלומים שהוזנו מראש ומיועדים לחיוב בכרטיס אשראי – מוצגים בתזרים כתנועה צפויה. אחרי ייבוא קובץ האשראי אפשר לשייך אותם לעסקה שנקלטה, וכך לא תיווצר כפילות.']);
  const dblRisk = t.rows.filter(r => !r.creditRowId && r.method === 'כרטיס אשראי' && r.status).length;
  if (dblRisk) msgs.push(['warn', dblRisk + ' תשלומים בכרטיס אשראי מסומנים כבוצעו בלי שיוך לעסקה בחוצץ האשראי – אם העסקה תיקלט גם מהקובץ, הסכום ייספר פעמיים. מומלץ לשייך.']);
  const gapRows = t.rows.filter(r => r.creditRowId && num(r.expectedAmount) !== null);
  if (gapRows.length) msgs.push(['warn', gapRows.length + ' תשלומים שחויבו בסכום שונה מהצפי שהוזן מראש: ' +
    gapRows.slice(0, 4).map(r => { const c = calcRow('authorities', r); const d = r2(c.amount - nz(r.expectedAmount)); return esc(c.authName) + ' (צפי ' + fmtMoney(nz(r.expectedAmount)) + ' · בפועל ' + fmtMoney(c.amount) + ' · פער ' + (d > 0 ? '+' : '') + fmtMoney(d) + ')'; }).join(' · ') +
    (gapRows.length > 4 ? ' ועוד' : '') + '. הסכום בשורה עודכן לפי החיוב בפועל.']);
  const viaBank = t.rows.filter(r => r.bankRowId && S.ops.bank.rows.some(b => b.id === r.bankRowId)).length;
  if (viaBank) msgs.push(['info', viaBank + ' תשלומים באמצעי בנקאי נרשמו אוטומטית גם בחוצץ הבנק (רקע ירקרק) – בתזרים הם מופיעים דרך שורת הבנק בלבד, כך שאין כפילות.']);
  const orphan = t.rows.filter(r => r.creditRowId && !S.ops.credit.rows.some(x => x.id === r.creditRowId)).length;
  if (orphan) msgs.push(['warn', orphan + ' שורות מקושרות לעסקת אשראי שנמחקה.']);
  if (msgs.length) h += '<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px">' + msgs.map(x => '<div class="msg ' + x[0] + '">' + x[1] + '</div>').join('') + '</div>';

  h += '<div class="toolbar sal-toolbar"><div class="seg sal-seg">' +
    [['month', 'חודש'], ['year', 'שנה'], ['all', 'כל התקופה']].map(([k, l]) => '<button class="' + (st.tab === k ? 'on' : '') + '" data-act="authtab" data-tab="' + k + '">' + l + '</button>').join('') +

    '<button class="btn gold" data-act="save">💾 שמירה</button><button class="btn" data-act="authxlsx">📗 Excel</button>' +
    (ccAuthMatchCount() ? '<button class="btn" data-act="ccauthmatch">🔗 שיוך לחיובי אשראי (' + ccAuthMatchCount() + ')</button>' : '') +
    '<button class="btn" data-act="clearf"' + (Object.values(tabFilters(t.tabId)).some(Boolean) ? '' : ' disabled') + '>✖ ניקוי מסננים</button></div>';

  h += '<div class="cc-bar">';
  if (st.tab === 'month') {
    h += '<div class="cc-per"><button class="btn sm" data-act="authprev">‹ חודש קודם</button>' +

    h += '<label class="pl">שנה <select id="authYearSel">' + years.map(y => '<option' + (y === st.year ? ' selected' : '') + '>' + y + '</option>').join('') + '</select></label>';
  } else h += '<span class="muted">כל התנועות מול הרשויות מאז תחילת הפעילות</span>';
  const whos = [...new Set([...AUTHORITIES.map(a => a.name).filter(n => n !== 'רשות אחרת'), ...t.rows.map(authWho).filter(Boolean)])];
  h += '<label class="pl">רשות <select id="authWhoSel"><option value="">כל הרשויות</option>' +
    whos.map(w => '<option' + (st.who === w ? ' selected' : '') + '>' + esc(w) + '</option>').join('') + '</select></label>';
  if (st.who) h += '<button class="btn sm" data-act="authclearf">✖ כל הרשויות</button>';
  h += '</div>';

  const pay = r2(items.reduce((a, x) => a + (x.c.isCredit ? 0 : x.c.amount), 0));
  const cred = r2(items.reduce((a, x) => a + (x.c.isCredit ? x.c.amount : 0), 0));
  const openPay = r2(items.reduce((a, x) => a + (!x.row.status && !x.c.isCredit && !x.c.viaCredit ? x.c.amount : 0), 0));
  const viaCcSum = r2(items.reduce((a, x) => a + (x.c.viaCredit && !x.c.isCredit ? x.c.amount : 0), 0));
  h += '<div class="scards">' + statCard(st.who ? 'תנועות · ' + esc(st.who) : 'תנועות', items.length) +
    statCard('סה״כ תשלומים', money(pay), 'bad') + statCard('סה״כ זיכויים', money(cred)) +
    statCard('מאזן נטו רשויות', money(r2(cred - pay))) + statCard('טרם שולם', money(openPay), openPay ? 'bad' : '') +
    (viaCcSum ? statCard('מתוכם בכרטיס אשראי', money(viaCcSum)) : '') + '</div>';

  if (!st.who) {
    const by = {};
    items.forEach(x => { const k = x.c.authName; const o = by[k] = by[k] || { pay: 0, cred: 0, n: 0 }; if (x.c.isCredit) o.cred += x.c.amount; else o.pay += x.c.amount; o.n++; });
    const keys = Object.keys(by).sort((a, b) => a.localeCompare(b, 'he'));
    if (keys.length) {
      h += '<div class="sal-subhead"><b>סיכום לפי רשות</b><span class="grow"></span><span class="muted" style="font-size:12px">לחיצה על רשות מציגה רק אותה</span></div>' +
        '<div class="grid-wrap sal-grid"><table class="grid"><thead><tr><th>רשות</th><th class="num">תנועות</th><th class="num">תשלומים</th><th class="num">זיכויים</th><th class="num">נטו</th></tr></thead><tbody>';
      for (const k of keys) {
        const o = by[k];
        h += '<tr><td><a href="#" class="emp-link" data-act="authwho" data-who="' + esc(k) + '"><b>' + esc(k) + '</b></a></td><td class="num">' + o.n + '</td>' +
          '<td class="num neg">' + fmtMoney(r2(o.pay)) + '</td><td class="num pos">' + fmtMoney(r2(o.cred)) + '</td><td class="num b">' + fmtMoney(r2(o.cred - o.pay)) + '</td></tr>';
      }

  h += '<div class="sal-subhead"><b>פירוט פעולות</b><span class="grow"></span><span class="muted" style="font-size:12px">סמן שורות למחיקה מרובה · לחיצה על כותרת עמודה ממיינת לפיה</span></div>';
  h += docBarHTML(t);
  const aSel = authSel();
  const selItems = items.filter(x => aSel.has(x.row.id));
  if (selItems.length) {
    const sum = r2(selItems.reduce((a, x) => a + (x.c.isCredit ? -x.c.amount : x.c.amount), 0));
    h += '<div class="bulk-bar"><b>נבחרו ' + selItems.length + ' שורות</b><span class="muted">· סה״כ ' + fmtMoney(sum) + ' ₪</span><span class="grow"></span>' +
      '<button class="btn sm danger" data-act="authdelsel">🗑 מחיקת ' + selItems.length + ' השורות</button>' +
      '<button class="btn sm" data-act="authselclear">✖ ניקוי בחירה</button></div>';
  }
  h += gridHTML(t, items, {
    sort: st.sort, sortAct: 'authsort',
    rowClass: (row, c) => c.viaCredit ? 'viacredit' : c.viaBank ? 'viabank' : (c.expectCredit ? 'waitcc' : ''),
    select: { has: id => aSel.has(id), act: 'authsel', allAct: 'authselall' }
  });
  v.innerHTML = yearsDatalist() + authCodesDatalist() + '<div id="msgs"></div>' + h;
}

/* ---------- הוספת פעולה ---------- */
function authAddModal() {
  const st = authState();
  const d = st.tab === 'month' ? st.month : curMonth();
  openModal({
    title: 'הוספת פעולה מול רשות', wide: true,
    body: '<div class="setting-grid">' +
      '<div class="form-row"><label>רשות</label><select id="auWho">' + AUTHORITIES.map(a => '<option value="' + esc(a.name) + '">' + esc(a.name) + '</option>').join('') + '</select></div>' +
      '<div class="form-row"><label>שם הרשות (ל״רשות אחרת״)</label><input id="auName" placeholder="לדוגמה: רשם החברות"></div>' +
      '<div class="form-row"><label>קוד מוסד</label><input id="auCode" list="authCodes" value="2761"></div>' +
      '<div class="form-row"><label>סוג פעולה</label><select id="auAction"><option value="pay">תשלום</option><option value="credit">זיכוי</option></select></div>' +
      '<div class="form-row"><label>שנה</label><input id="auYear" list="yearsList" value="' + d.slice(0, 4) + '"></div>' +
      '<div class="form-row"><label>חודש</label><select id="auMonth">' + MONTHS.map(m => '<option' + (m === d.slice(5) ? ' selected' : '') + '>' + m + '</option>').join('') + '</select></div>' +
      '<div class="form-row"><label>סכום (₪)</label><input id="auAmt" inputmode="decimal" style="direction:ltr"></div>' +
      '<div class="form-row"><label>אמצעי תשלום / קבלה</label><select id="auMethod">' + AUTH_METHODS.map(m => '<option' + (m === 'כרטיס אשראי' ? ' selected' : '') + '>' + esc(m) + '</option>').join('') + '</select></div>' +
      '<div class="form-row"><label>תאריך צפי תשלום</label>' + dateInputHTML('', 'id="auDue"') + '</div>' +
      '<div class="form-row"><label>תאריך בפועל</label>' + dateInputHTML('', 'id="auPay"') + '</div>' +
      '<div class="form-row"><label>אסמכתה / מסמך</label><input id="auDoc"></div>' +
      '<div class="form-row"><label>תיאור / הערה</label><input id="auNote"></div></div>' +
      '<p class="muted">שורה עם תאריך בפועל המסומנת כבוצעה נכנסת לתזרים כתנועה בפועל. שורה עם תאריך צפי בלבד מוצגת בתזרים כתנועה צפויה.</p>',
    onOpen: bg => {
      const sync = () => {
        const a = AUTHORITIES.find(x => x.name === $('#auWho', bg).value);
        if (a) { $('#auCode', bg).value = a.code; $('#auAction', bg).value = a.dir; }
        $('#auName', bg).disabled = $('#auWho', bg).value !== 'רשות אחרת';
      };
      $('#auWho', bg).onchange = sync; sync();
      $('#auAmt', bg).focus();
    },
    buttons: [{
      label: 'שמירה', cls: 'primary', onClick: bg => {
        const amt = num($('#auAmt', bg).value);
        if (amt === null || amt <= 0) { toast('סכום לא תקין', 'err'); return false; }
        const due = $('#auDue', bg).value.trim() ? parseDateInput($('#auDue', bg).value) : '';
        const pay = $('#auPay', bg).value.trim() ? parseDateInput($('#auPay', bg).value) : '';
        if (due === null || pay === null) { toast('תאריך לא תקין', 'err'); return false; }
        if (!due && !pay) { toast('יש להזין תאריך צפי או תאריך בפועל', 'err'); return false; }
        const rows = S.ops.authorities.rows;
        const r = newRow('authorities');
        Object.assign(r, {
          serial: nextSerial(rows), authType: $('#auWho', bg).value, authName: $('#auName', bg).value.trim(),
          code: $('#auCode', bg).value.trim(), action: $('#auAction', bg).value, amount: Math.abs(amt),
          method: $('#auMethod', bg).value, year: $('#auYear', bg).value.trim(), month: $('#auMonth', bg).value,
          dueDate: due, payDate: pay, status: !!pay, docNo: $('#auDoc', bg).value.trim(), notes: $('#auNote', bg).value.trim()
        });
        rows.push(r);
        authBankSync(r);
        const st2 = authState(); st2.tab = 'month'; st2.month = (pay || due).slice(0, 7); st2.who = '';
        markDirty(); navigate('ops:authorities', r.id);
        toast('הפעולה נוספה' + (r.bankRowId ? ' · נרשמה גם בחוצץ הבנק ומשם לתזרים' : r.status ? ' ונכנסה לתזרים' : ' כתנועה צפויה'), 'ok', 5000);
      }
    }, { label: 'ביטול' }]
  });
}

/* ---------- פעולות ---------- */
function authAction(act, el, e, t) {
  const st = authState();
  switch (act) {
    case 'authtab': st.tab = el.dataset.tab; render(); break;
    case 'authprev': case 'authnext': { const nm = monthAdd(st.month, act === 'authprev' ? -1 : 1); if (nm >= CAL_MIN_YEAR + '-01') { st.month = nm; render(); } break; }
    case 'authpickmonth': openCalendar(el, { value: st.month + '-01', pickMonth: true, onPick: iso => { st.month = iso.slice(0, 7); render(); } }); break;
    case 'authwho': e && e.preventDefault(); st.who = el.dataset.who; render(); break;
    case 'authclearf': st.who = ''; render(); break;
    case 'authsort': {
      e && e.preventDefault();
      const k = el.dataset.key;
      if (st.sort.key === k) st.sort.dir = st.sort.dir === 'asc' ? 'desc' : 'asc';
      else st.sort = { key: k, dir: 'asc' };
      render(); break;
    }
    case 'authadd': authAddModal(); break;
    case 'ccauthmatch': ccAuthMatchModal(false); break;
    case 'authsel': { const id = el.dataset.row, sl = authSel(); sl.has(id) ? sl.delete(id) : sl.add(id); render(); break; }
    case 'authselall': {
      const sl = authSel(), items = authFilter(t);
      const allOn = items.length && items.every(x => sl.has(x.row.id));
      items.forEach(x => allOn ? sl.delete(x.row.id) : sl.add(x.row.id));
      render(); break;
    }
    case 'authselclear': authSel().clear(); render(); break;
    case 'authdelsel': {
      const ids = [...authSel()].filter(id => t.rows.some(r => r.id === id));
      if (!ids.length) break;
      const linked = t.rows.filter(r => ids.includes(r.id) && r.creditRowId).length;
      const sum = r2(ids.reduce((a, id) => { const r = t.rows.find(x => x.id === id); const c = calcRow('authorities', r); return a + (c.isCredit ? -c.amount : c.amount); }, 0));
      confirmModal('מחיקת שורות רשויות',
        'למחוק <b>' + ids.length + '</b> שורות בסך <b dir="ltr">' + fmtMoney(sum) + ' ₪</b>?' +
        (linked ? '<br><span class="muted">' + linked + ' מהן משויכות לעסקאות אשראי – העסקאות עצמן יישארו בחוצץ האשראי, רק השיוך לרשות יוסר.</span>' : '') +
        '<br><span class="muted">תנועות התזרים שנגזרו מהשורות האלה ייעלמו.</span>', 'מחיקה', () => {
          const del = t.rows.filter(r => ids.includes(r.id));
          del.forEach(r => { if (r.creditRowId) { const cc = S.ops.credit.rows.find(x => x.id === r.creditRowId); if (cc) { cc.authType = ''; } } });
          S.ops.authorities.rows = t.rows.filter(r => !ids.includes(r.id));
          for (const d of Object.values(S.docs)) if (d.tabId === 'ops:authorities' && ids.includes(d.rowId)) delete S.docs[d.id];
          authSel().clear(); markDirty(); render();
          toast(ids.length + ' שורות נמחקו מחוצץ הרשויות', 'ok');
        }, true);
      break;
    }
    case 'authxlsx': {
      const items = authFilter(t);
      exportExcel('רשויות', ['מס״ד', 'שנה', 'חודש', 'קוד', 'רשות', 'סוג פעולה', 'סכום', 'אמצעי תשלום', 'צפי תשלום', 'תאריך בפועל', 'סטטוס', 'אסמכתה', 'הערה'],
        items.map(({ row, c }) => [row.serial, row.year || '', row.month || '', row.code || '', c.authName, c.isCredit ? 'זיכוי' : 'תשלום', c.amount, row.method || '', fmtDate(row.dueDate), fmtDate(row.payDate), c.authStatus, row.docNo || '', row.notes || '']));
      break;
    }
  }
}

/* ---------- סנכרון רשויות ⇄ בנק ----------
   תשלום לרשות באמצעי בנקאי נרשם כשורה בחוצץ הבנק, ומשם הוא נכנס לתזרים.
   שורת הרשות עצמה מפסיקה לייצר תנועה, כדי שלא תהיה כפילות. */
function authBankRowOf(row) { return row.bankRowId ? S.ops.bank.rows.find(b => b.id === row.bankRowId) : null; }
function authBankSync(row) {
  const c = calcRow('authorities', row);
  const shouldLink = !row.creditRowId && c.bankMethod && !!row.status && !!(row.payDate || row.dueDate);
  let b = authBankRowOf(row);
  if (!shouldLink) {
    if (b) { S.ops.bank.rows = S.ops.bank.rows.filter(x => x.id !== b.id); }
    delete row.bankRowId;
    markDirty();
    return;
  }
  const date = row.payDate || row.dueDate;
  const amt = Math.abs(nz(row.amount));
  if (!b) {
    // אם כבר קיימת תנועה מתאימה בבנק (אותו תאריך ואותו סכום) – מתחברים אליה במקום ליצור כפילות
    b = S.ops.bank.rows.find(x => !x.authRowId && x.date === date && Math.abs(Math.abs(nz(x.income)) + Math.abs(nz(x.expense)) - amt) < 0.5);
    if (!b) {
      b = newRow('bank');
      b.serial = nextSerial(S.ops.bank.rows);
      S.ops.bank.rows.push(b);
    }
    b.authRowId = row.id;
    row.bankRowId = b.id;
  }
  Object.assign(b, {
    date, forMonth: (row.year && row.month) ? row.year + '-' + row.month : date.slice(0, 7),
    txType: c.isCredit ? 'זיכוי מרשות' : 'תשלום לרשויות',
    party: c.authName,
    description: [c.isCredit ? 'זיכוי' : 'תשלום', c.authName, (row.month && row.year) ? 'תקופה ' + row.month + '/' + row.year : '', row.method || ''].filter(Boolean).join(' · '),
    docNo: b.docNo || row.docNo || ''
  });
  if (c.isCredit) { b.income = amt; b.expense = null; } else { b.expense = amt; b.income = null; }
  markDirty();
}
function authBankSyncAll() { S.ops.authorities.rows.forEach(r => { if (r.bankRowId || (calcRow('authorities', r).bankMethod && r.status)) authBankSync(r); }); }
/* =====================================================================
   כ״א · רישום אנשים אחיד (עובדים + עצמאיים) · כרטיס אדם מרכז
   ===================================================================== */

/* מפתח אדם: emp:<id> לעובד במערכת, ent:<id> לחוצץ אדם עצמאי.
   אדם שהוא גם עובד וגם בעל חוצץ מזוהה לפי שם ומוצג פעם אחת. */
function normPerson(n) { return String(n || '').replace(/["'׳״\-]/g, '').replace(/\s+/g, ' ').trim(); }
/* קבוצות שמות: "ברי" ו-"ברוך בארי כהן" הם אותו אדם. השם הראשון בקבוצה הוא השם הראשי. */
function aliasGroups() { return (S.settings.personAliases || []).map(g => g.filter(Boolean)); }
function aliasGroupOf(name) {
  const n = normPerson(name); if (!n) return null;
  return aliasGroups().find(g => g.some(x => normPerson(x) === n)) || null;
}
function personCanon(name) { const g = aliasGroupOf(name); return normPerson(g ? g[0] : name); }
function personAliasesOf(name) { const g = aliasGroupOf(name); return g ? g.filter(x => normPerson(x) !== normPerson(name)) : []; }
function samePerson(a, b) { return personCanon(a) === personCanon(b) && !!personCanon(a); }
function personEntities() { return S.entityOrder.filter(id => S.entities[id].type === 'freelancer').map(id => S.entities[id]); }
function allPeople(includeArchived) {
  const out = [];
  const byName = new Map();
  for (const e of S.employees) {
    const p = { key: 'emp:' + e.id, name: e.name, empId: e.id, entId: '', empNo: e.empNo || '', startDate: e.startDate || '', archived: !!e.archived, roles: ['שכיר'], aliases: personAliasesOf(e.name) };
    out.push(p); byName.set(personCanon(e.name), p);
  }
  for (const ent of personEntities()) {
    const hit = byName.get(personCanon(ent.name));
    if (hit) {
      hit.entId = ent.id; hit.roles.push('עצמאי');
      if (normPerson(hit.name) !== normPerson(ent.name) && !hit.aliases.includes(ent.name)) hit.aliases = [...new Set([...hit.aliases, ent.name])];
      continue;
    }
    const p = { key: 'ent:' + ent.id, name: ent.name, empId: '', entId: ent.id, empNo: '', startDate: '', archived: !!ent.archived, roles: ['עצמאי'], note: ent.owner || '', aliases: personAliasesOf(ent.name) };
    out.push(p); byName.set(personCanon(ent.name), p);
  }
  return out.filter(p => includeArchived || !p.archived).sort((a, b) => a.name.localeCompare(b.name, 'he'));
}
function personByKey(key) {
  if (!key) return null;
  const all = allPeople(true);
  return all.find(p => p.key === key) ||
    all.find(p => (key.startsWith('emp:') && p.empId === key.slice(4)) || (key.startsWith('ent:') && p.entId === key.slice(4))) || null;
}
function personRows(p) {
  const sal = p.empId ? S.ops.salaries.rows.filter(r => r.employeeId === p.empId) : [];
  const pen = p.empId ? S.ops.pensions.rows.filter(r => r.employeeId === p.empId) : [];
  const own = p.entId && S.entities[p.entId] ? S.entities[p.entId].rows : [];
  return { sal, pen, own };
}
function personYears(p) {
  const { sal, pen, own } = personRows(p);
  const ys = new Set();
  sal.forEach(r => r.year && ys.add(String(r.year)));
  pen.forEach(r => r.year && ys.add(String(r.year)));
  own.forEach(r => r.year && ys.add(String(r.year)));
  if (!ys.size) ys.add(curMonth().slice(0, 4));
  return [...ys].sort().reverse();
}
function personState() {
  const st = UI.person || (UI.person = { key: '', year: '', showArchived: false });
  return st;
}

/* ---------------- כרטיס אדם ---------------- */
function renderPerson(v) {
  const st = personState();
  const p = personByKey(st.key);
  if (!p) { v.innerHTML = '<div class="empty-state"><b>לא נמצא אדם</b>בחר אדם מהרשימה בסרגל הצד.</div>'; return; }
  const years = personYears(p);
  if (!years.includes(st.year)) st.year = years[0];
  const { sal, pen, own } = personRows(p);
  const inY = r => String(r.year || '') === st.year;
  const salY = sal.filter(inY), penY = pen.filter(inY), ownY = own.filter(inY);
  const sum = (arr, f) => r2(arr.reduce((a, x) => a + nz(f(x)), 0));
  const penTot = r => calcRow('pensions', r).total;
  const gross = sum(salY, r => r.grossTotal), net = sum(salY, r => r.net);
  const penSum = r2(penY.reduce((a, r) => a + penTot(r), 0));
  const ownSum = sum(ownY, r => calcRow('freelancer', r).base);
  const cost = r2(gross + penSum + ownSum);

  let h = '<div class="crumb"><h2>' + esc(p.name) + '</h2>' +
    '<span class="meta">' + p.roles.map(r => '<span class="kind-badge">' + r + '</span>').join(' ') +
    (p.empNo ? ' · עובד מס׳ ' + esc(p.empNo) : '') + (p.startDate ? ' · תחילת עבודה ' + fmtDate(p.startDate) : '') +
    ((p.aliases && p.aliases.length) ? ' · ידוע גם כ: ' + p.aliases.map(esc).join(', ') : '') +
    (p.archived ? ' · <b style="color:var(--warn)">בארכיון</b>' : '') + '</span><span class="grow"></span>' +
    '<button class="btn sm" data-act="peredit">✎ עריכת פרטים</button>' +
    (p.entId ? '<button class="btn sm" data-act="perown">📄 חוצץ התשלומים</button>' : '<button class="btn sm" data-act="peraddtab">＋ פתיחת חוצץ תשלומים</button>') +
    '<button class="btn sm" data-act="perarch">' + (p.archived ? '↩ החזרה מהארכיון' : '🗄 העברה לארכיון') + '</button>' +
    '<button class="btn sm danger" data-act="perdel">🗑 מחיקת אדם</button></div>';

  h += '<div class="toolbar"><label class="pl">שנה להצגה <select id="perYearSel">' +
    years.map(y => '<option' + (y === st.year ? ' selected' : '') + '>' + y + '</option>').join('') + '</select></label>' +
    '<span class="muted" style="font-size:12.5px">כל הנתונים נמשכים אוטומטית מחוצצי המקור – אין כאן הזנה כפולה</span></div>';

  h += '<div class="scards">' +
    statCard('חודשי שכר ב-' + st.year, salY.length) +
    statCard('ברוטו', money(gross)) + statCard('נטו לתשלום', money(net)) +
    statCard('הפקדות לקופות', money(penSum)) +
    statCard('תשלומים כעצמאי', money(ownSum)) +
    statCard('סה״כ עלות לאטלס', money(cost), 'bad') + '</div>';

  // שכר
  h += '<div class="sal-subhead"><b>שכר – ' + st.year + '</b><span class="grow"></span>' +
    (p.empId ? '<button class="btn sm" data-act="pergo" data-tab="ops:salaries">לחוצץ המשכורות ›</button>' : '<span class="muted" style="font-size:12px">אינו עובד שכיר</span>') + '</div>';
  if (salY.length) {
    h += '<div class="grid-wrap sal-grid"><table class="grid"><thead><tr><th>חודש</th><th class="num">ברוטו</th><th class="num">ניכויים</th><th class="num">נטו</th><th class="num">פנסיה + קה״ל</th><th>תאריך תשלום</th><th>סטטוס</th><th>תלוש</th></tr></thead><tbody>';
    for (const r of salY.slice().sort((a, b) => String(b.month).localeCompare(String(a.month)))) {
      const c = calcRow('salaries', r);
      h += '<tr><td class="num"><b>' + esc(r.month || '') + '.' + esc(r.year || '') + '</b></td><td class="num">' + fmtMoney(r.grossTotal) + '</td><td class="num">' + fmtMoney(r.deductions) + '</td>' +
        '<td class="num b">' + fmtMoney(r.net) + '</td><td class="num">' + fmtMoney(c.funds) + '</td><td class="num">' + fmtDate(r.payDate) + '</td>' +
        '<td><span class="status ' + (r.status ? 'yes' : 'no') + '">' + (r.status ? 'שולם' : 'טרם שולם') + '</span></td>' +
        '<td>' + (r.payslip ? '<span class="chip linked" data-act="perdoc" data-tab="ops:salaries" data-row="' + r.id + '" data-field="payslip">📄 תלוש</span>' : '<span class="muted">—</span>') + '</td></tr>';
    }
    h += '<tr class="tot-row"><td>סה״כ</td><td class="num">' + fmtMoney(gross) + '</td><td class="num">' + fmtMoney(sum(salY, r => r.deductions)) + '</td><td class="num">' + fmtMoney(net) + '</td><td class="num">' + fmtMoney(sum(salY, r => calcRow('salaries', r).funds)) + '</td><td colspan="3"></td></tr>';
    h += '</tbody></table></div>';
  } else h += '<div class="msg info">אין שורות שכר ב-' + st.year + '</div>';

  // פנסיה
  h += '<div class="sal-subhead"><b>פנסיה והפקדות – ' + st.year + '</b><span class="grow"></span>' +
    (p.empId ? '<button class="btn sm" data-act="pergo" data-tab="ops:pensions">לחוצץ הפנסיות ›</button>' : '') + '</div>';
  if (penY.length) {
    h += '<div class="grid-wrap sal-grid"><table class="grid"><thead><tr><th>חודש</th><th>קופה</th><th>סוג</th><th class="num">עובד</th><th class="num">מעסיק</th><th class="num">פיצויים</th><th class="num">סה״כ</th><th>תאריך תשלום</th><th>אסמכתה</th></tr></thead><tbody>';
    for (const r of penY.slice().sort((a, b) => String(b.month).localeCompare(String(a.month)))) {
      h += '<tr><td class="num"><b>' + esc(r.month || '') + '.' + esc(r.year || '') + '</b></td><td>' + esc(r.fundName || '—') + '</td><td>' + esc(r.fundKind || '') + '</td>' +
        '<td class="num">' + fmtMoney(r.empDeposit) + '</td><td class="num">' + fmtMoney(r.erDeposit) + '</td><td class="num">' + fmtMoney(r.severance) + '</td>' +
        '<td class="num b">' + fmtMoney(penTot(r)) + '</td><td class="num">' + fmtDate(r.payDate) + '</td><td>' + esc(r.reference || '') + '</td></tr>';
    }
    h += '<tr class="tot-row"><td>סה״כ</td><td colspan="2"></td><td class="num">' + fmtMoney(sum(penY, r => r.empDeposit)) + '</td><td class="num">' + fmtMoney(sum(penY, r => r.erDeposit)) + '</td><td class="num">' + fmtMoney(sum(penY, r => r.severance)) + '</td><td class="num">' + fmtMoney(penSum) + '</td><td colspan="2"></td></tr>';
    h += '</tbody></table></div>';
  } else h += '<div class="msg info">אין הפקדות ב-' + st.year + '</div>';

  // תשלומים כעצמאי
  h += '<div class="sal-subhead"><b>תשלומים כעצמאי – ' + st.year + '</b><span class="grow"></span>' +
    (p.entId ? '<button class="btn sm" data-act="perown">לחוצץ האדם ›</button>' : '<button class="btn sm" data-act="peraddtab">＋ פתיחת חוצץ תשלומים</button>') + '</div>';
  if (ownY.length) {

/* =====================================================================
   תשלום לעצמאי · קישור בין חוצץ האדם לחוצץ הבנק
   --------------------------------------------------------------------
   אותו תשלום נרשם פעם אחת בלבד בתזרים. הקישור דו-כיווני: שורה שנוצרת
   בחוצץ העצמאי פותחת שורת בנק תואמת, ושורת בנק שסומנה "תשלום לעצמאי"
   ומולאה בשם האדם פותחת לו שורה בחוצץ שלו. הדפוס זהה לקישור
   רשויות↔בנק הקיים, אלא שכאן השורה בגיליון הראשי מוצגת תחת שם האדם
   ולא בבלוק הבנק – כדי שכל מה שיצא לאדם יופיע במקום אחד לצד השכר
   והפנסיה. היתרה המצטברת בחוצץ הבנק נשמרת, כי שורת הבנק היא זו
   שנספרת בתזרים.
   ===================================================================== */
const FREE_TX_TYPE = 'תשלום לעצמאי';
function freeRowOf(bankRow) {
  if (!bankRow || !bankRow.freeEntId || !bankRow.freeRowId) return null;
  const ent = S.entities[bankRow.freeEntId];
  if (!ent || ent.type !== 'freelancer') return null;
  const row = (ent.rows || []).find(r => r.id === bankRow.freeRowId);
  return row ? { ent, row } : null;
}
function freeBankRowOf(row) { return row && row.bankRowId ? S.ops.bank.rows.find(b => b.id === row.bankRowId) : null; }
function freeEntOfRow(row) { return personEntities().find(e => (e.rows || []).some(r => r.id === row.id)) || null; }
/* חוצץ העצמאי של אדם לפי שם. נפתח אוטומטית רק לאדם שכבר רשום בכ״א –
   שם שאינו של אדם קיים לעולם אינו פותח רשומת אדם חדשה. */
function personEntityFor(name, create) {
  const n = String(name || '').trim(); if (!n) return null;
  const ent = personEntities().find(e => samePerson(e.name, n) || normPerson(e.name) === normPerson(n));
  if (ent || !create) return ent || null;
  const p = allPeople(true).find(x => samePerson(x.name, n) || normPerson(x.name) === normPerson(n));
  if (!p) return null;                       // שם לא מזוהה – לא נפתח אדם חדש
  const id = uid('freelancer');
  const e2 = { id, type: 'freelancer', name: p.name, owner: '', docPath: '', createdAt: new Date().toISOString(), rows: [] };
  S.entities[id] = e2; S.entityOrder.push(id); UI.sbOpen.freelancer = true;
  return e2;
}
/* שמות דומים לאדם קיים – כדי להתריע על כפילות שנוצרה מטעות הקלדה */
function personNearMatch(name) {
  const w = normPerson(name).split(' ').filter(Boolean);
  if (w.length < 1) return null;
  const hits = allPeople(true).filter(p => {
    if (samePerson(p.name, name) || normPerson(p.name) === normPerson(name)) return false;
    const pw = normPerson(p.name).split(' ').filter(Boolean);
    return w.every(x => pw.includes(x)) || (pw.length > 1 && pw.every(x => w.includes(x)));
  });
  return hits.length === 1 ? hits[0] : null;
}
/* המסמך שצורף בצד אחד נגיש גם מהצד השני ומהגיליון הראשי */
function freeDocMirror(ent, row, b) {
  const a = findDoc(ent.id, row.id, 'taxReceiptNo'), c = findDoc('ops:bank', b.id, 'docNo');
  const src = a || c; if (!src || (a && c)) return;
  const tgt = a ? { tabId: 'ops:bank', rowId: b.id, field: 'docNo' } : { tabId: ent.id, rowId: row.id, field: 'taxReceiptNo' };
  const id = uid('doc');
  S.docs[id] = Object.assign({}, src, tgt, { id, mirrorOf: src.id });
  if (sessionBlobs[src.id]) sessionBlobs[id] = sessionBlobs[src.id];
  if (sessionFiles[src.id]) sessionFiles[id] = sessionFiles[src.id];
}
function freeDocDrop(tabId, rowId, field) {
  for (const d of Object.values(S.docs)) if (d.tabId === tabId && d.rowId === rowId && d.field === field && d.mirrorOf) delete S.docs[d.id];
}
/* מחוצץ העצמאי אל הבנק */
function freeBankSync(row, ent) {
  ent = ent || freeEntOfRow(row); if (!ent) return;
  const amt = Math.abs(nz(row.amount));
  let b = freeBankRowOf(row);
  // תשלום ללא תאריך או ללא סכום הוא עדיין צפי – אין לו תנועה בבנק
  if (!row.payDate || !amt) {
    if (b) { freeDocDrop('ops:bank', b.id, 'docNo'); S.ops.bank.rows = S.ops.bank.rows.filter(x => x.id !== b.id); }
    delete row.bankRowId; markDirty(); return;
  }
  if (!b) {
    // אם כבר קיימת תנועה מתאימה בבנק (אותו תאריך ואותו סכום) – מתחברים אליה במקום ליצור כפילות.
    // תנועות שכבר שייכות למשהו אחר (רשויות, פיקדון) אינן נחטפות.
    b = S.ops.bank.rows.find(x => !x.authRowId && !x.freeRowId && !x.depId && x.date === row.payDate && Math.abs(Math.abs(nz(x.income)) + Math.abs(nz(x.expense)) - amt) < 0.5);
    if (!b) { b = newRow('bank'); b.serial = nextSerial(S.ops.bank.rows); S.ops.bank.rows.push(b); }
    b.freeEntId = ent.id; b.freeRowId = row.id; row.bankRowId = b.id;
  }
  Object.assign(b, {
    date: row.payDate,
    forMonth: (row.year && row.month) ? row.year + '-' + pad2(row.month) : row.payDate.slice(0, 7),
    txType: FREE_TX_TYPE, party: ent.name,
    description: [FREE_TX_TYPE, ent.name, row.projectName || '', (row.month && row.year) ? 'חודש ' + row.month + '/' + row.year : ''].filter(Boolean).join(' · ')
  });
  b.expense = amt; b.income = null;
  if (!String(b.docNo || '').trim() && String(row.taxReceiptNo || '').trim()) b.docNo = row.taxReceiptNo;
  freeDocMirror(ent, row, b);
  markDirty();
}
/* מחוצץ הבנק אל חוצץ העצמאי */
function bankFreeSync(b) {
  const link = freeRowOf(b);
  const name = String(b.party || '').trim();
  if ((b.txType || '') !== FREE_TX_TYPE || !name) {
    if (link) { freeDocDrop(link.ent.id, link.row.id, 'taxReceiptNo'); link.ent.rows = link.ent.rows.filter(r => r.id !== link.row.id); }
    delete b.freeEntId; delete b.freeRowId;
    if (link) markDirty();
    return;
  }
  let ent = link && (samePerson(link.ent.name, name) || normPerson(link.ent.name) === normPerson(name)) ? link.ent : personEntityFor(name, true);
  // שם שאינו של אדם רשום – השורה נשארת תנועת בנק רגילה עד שייבחר אדם מהרשימה
  if (!ent) {
    if (link) { freeDocDrop(link.ent.id, link.row.id, 'taxReceiptNo'); link.ent.rows = link.ent.rows.filter(r => r.id !== link.row.id); }
    delete b.freeEntId; delete b.freeRowId; markDirty();
    return;
  }
  let row = link && ent === link.ent ? link.row : null;
  if (link && ent !== link.ent) { freeDocDrop(link.ent.id, link.row.id, 'taxReceiptNo'); link.ent.rows = link.ent.rows.filter(r => r.id !== link.row.id); }
  if (!row) {
    row = newRow('freelancer'); row.serial = nextSerial(ent.rows); ent.rows.push(row);
    b.freeEntId = ent.id; b.freeRowId = row.id; row.bankRowId = b.id;
  }
  // שם מזוהה נרשם בצורתו הרשמית ("ברי" → "ברוך בארי כהן"), כדי שהחוצץ והבנק ידברו באותו שם
  if (normPerson(b.party) !== normPerson(ent.name)) b.party = ent.name;
  const ym = b.forMonth || (b.date || '').slice(0, 7) || curMonth();
  Object.assign(row, {
    amount: Math.abs(nz(b.expense)) || Math.abs(nz(b.income)),
    payDate: b.date || '', year: ym.slice(0, 4), month: ym.slice(5, 7)
  });
  if (!String(row.taxReceiptNo || '').trim() && String(b.docNo || '').trim()) row.taxReceiptNo = b.docNo;
  freeDocMirror(ent, row, b);
  markDirty();
}
