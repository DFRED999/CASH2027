<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATLAS – תזרים ופרויקטים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{
  --navy:#14213d; --navy2:#1f3160; --gold:#c9a227; --gold-soft:#f6ecc8;
  --lav:#eceafd; --lav2:#d9d5f7; --bg:#f3f4f8; --card:#fff; --line:#dfe2ea;
  --text:#1b2233; --muted:#6b7385; --red:#c62828; --red-bg:#fde8e8;
  --green:#1e7d3a; --green-bg:#e3f5e8; --blue:#1d5fbf; --edit:#fffbea; --auto:#f4f6fb;
  --warn:#b26a00; --warn-bg:#fff3dc;
  /* צבע זיהוי לסוג הפרויקט: יזם מול משהב״ט */
  --pt-yazam:#0f766e; --pt-yazam-bg:#e2f2f0;
  --pt-mod:#6d28d9;   --pt-mod-bg:#efe8fd;
}
/* ---- הבחנה חזותית בין סוגי פרויקטים ---- */
.sb-group[data-ptype]>.sb-group-h{border-inline-start:4px solid transparent;padding-inline-start:8px}
.sb-group[data-ptype=yazam]>.sb-group-h{border-inline-start-color:var(--pt-yazam);color:var(--pt-yazam)}
.sb-group[data-ptype=mod]>.sb-group-h{border-inline-start-color:var(--pt-mod);color:var(--pt-mod)}
.sb-group[data-ptype=yazam] .sb-children{border-inline-start:2px solid var(--pt-yazam-bg);margin-inline-start:5px}
.sb-group[data-ptype=mod] .sb-children{border-inline-start:2px solid var(--pt-mod-bg);margin-inline-start:5px}
.sb-group[data-ptype=yazam] .sb-client-h{color:#0b5b55}
.sb-group[data-ptype=mod] .sb-client-h{color:#5b21b6}
.sb-group[data-ptype=yazam] .sb-item:not(.active){background:var(--pt-yazam-bg)}
.sb-group[data-ptype=mod] .sb-item:not(.active){background:var(--pt-mod-bg)}
.sb-group[data-ptype] .sb-item{margin-bottom:2px}
.ptag{display:inline-block;font-size:11px;font-weight:700;border-radius:9px;padding:1px 8px;white-space:nowrap}
.pt-yazam{background:var(--pt-yazam-bg);color:var(--pt-yazam)}
.pt-mod{background:var(--pt-mod-bg);color:var(--pt-mod)}
.crumb[data-ptype]{border-inline-start:6px solid transparent;padding-inline-start:10px;border-radius:4px}
.crumb[data-ptype=yazam]{border-inline-start-color:var(--pt-yazam)}
.crumb[data-ptype=mod]{border-inline-start-color:var(--pt-mod)}
.crumb[data-ptype=yazam] h2{color:var(--pt-yazam)}
.crumb[data-ptype=mod] h2{color:var(--pt-mod)}
.grid tr[data-ptype=yazam]:not(.pairrow) td:first-child{box-shadow:inset -4px 0 0 var(--pt-yazam)}
.grid tr[data-ptype=mod]:not(.pairrow) td:first-child{box-shadow:inset -4px 0 0 var(--pt-mod)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Heebo,"Segoe UI",Arial,sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
button{font-family:inherit;font-size:13px;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px}
.hidden{display:none!important}

/* ---------- top bar ---------- */
#topbar{position:fixed;top:0;right:0;left:0;height:56px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;z-index:50;box-shadow:0 2px 6px rgba(0,0,0,.25)}
#topbar .brand{font-weight:800;font-size:20px;letter-spacing:1px;display:flex;align-items:center;gap:8px;white-space:nowrap}
#topbar .brand small{font-weight:400;font-size:12px;opacity:.75;letter-spacing:0}
.pill-gold{background:var(--gold);color:var(--navy);border-radius:999px;padding:4px 12px;font-weight:700;white-space:nowrap}
.tb-stat{font-size:12px;opacity:.9;white-space:nowrap}
.tb-stat b{font-size:14px}
#searchBox{flex:1;max-width:340px;position:relative}
#searchBox input{width:100%;border-radius:999px;border:0;padding:7px 14px;background:#2b3d6b;color:#fff}
#searchBox input::placeholder{color:#b9c2dc}
#searchResults{position:absolute;top:38px;right:0;left:0;background:#fff;color:var(--text);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-height:360px;overflow:auto;z-index:60}
#searchResults div{padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer}
#searchResults div:hover{background:var(--lav)}
.tb-spacer{flex:1}
.tb-btn{background:#2b3d6b;color:#fff;border:0;border-radius:8px;padding:7px 11px;white-space:nowrap}
.tb-btn:hover{background:#3a4f86}
.tb-btn.gold{background:var(--gold);color:var(--navy);font-weight:700}
#saveState{font-size:12px;white-space:nowrap}
#syncState{font-size:12px;white-space:nowrap}
#syncState.sync-ok{color:#8fe3a6}#syncState.sync-wait{color:#ffd37a}#syncState.sync-err{color:#ff9a9a}
.sync-rules{direction:ltr;text-align:left;background:#f6f7fb;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11.5px;overflow:auto;max-height:190px;margin:6px 0 0}
#saveState.dirty{color:#ffd37a}#saveState.ok{color:#8fe3a6}#saveState.err{color:#ff9a9a}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;text-align:center;margin-inline-start:4px}

/* ---------- sidebar ---------- */
#sidebar{position:fixed;top:56px;right:0;bottom:0;width:236px;background:#fff;border-left:1px solid var(--line);overflow:auto;padding:10px 8px 80px;z-index:40}
.sb-item,.sb-group-h{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;cursor:pointer;user-select:none}
.sb-item:hover,.sb-group-h:hover{background:var(--lav)}
.sb-item.active{background:var(--navy);color:#fff}
.sb-group-h{font-weight:700;margin-top:6px}
.sb-group-h .chev{display:inline-block;transition:transform .15s;font-size:11px;width:12px}
.sb-group.closed .chev{transform:rotate(90deg)}
.sb-group.closed .sb-children{display:none}
.sb-children{padding-right:14px}
.sb-children .sb-item{font-size:13px;padding:6px 10px}
.sb-count{margin-inline-start:auto;font-size:11px;color:var(--muted);background:var(--bg);border-radius:9px;padding:0 6px}
.sb-item.active .sb-count{background:#2b3d6b;color:#fff}
.sb-empty{font-size:12px;color:var(--muted);padding:4px 12px}
#btnNew{display:block;width:100%;margin:6px 0 10px;background:var(--gold);color:var(--navy);border:0;border-radius:10px;padding:10px;font-weight:800;font-size:14px}
.sb-client{margin:0}
.sb-group-h.sb-client-h{font-weight:600;font-size:13.5px;margin-top:2px;padding:6px 10px;color:#2a3450}
.sb-client-h .sb-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-client .sb-children{padding-right:16px;border-right:1px dashed #d9dde8;margin-right:14px}
.sb-group.closed > .sb-group-h .chev{transform:rotate(90deg)}
.sb-group:not(.closed) > .sb-group-h .chev{transform:none}
.sb-sep{border-top:1px solid var(--line);margin:10px 4px}

/* ---------- main ---------- */
#main{margin:56px 236px 0 0;padding:16px 18px 40px;min-height:calc(100vh - 56px)}
.crumb{background:var(--lav);border:1px solid var(--lav2);border-radius:10px;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.crumb h2{margin:0;font-size:18px}
.crumb .meta{font-size:12px;color:var(--muted)}
.crumb .grow{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;color:var(--text);white-space:nowrap}
.btn:hover{border-color:var(--navy2)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}
.btn.danger{color:var(--red);border-color:#f0b9b9}
.btn.danger:hover{background:var(--red-bg)}
.btn.sm{padding:3px 8px;font-size:12px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.stat{background:#fff;border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:10px;padding:8px 14px;min-width:130px}
.stat .l{font-size:11px;color:var(--muted)}
.stat .v{font-size:17px;font-weight:700;direction:ltr;text-align:right}
.stat.green{border-top-color:var(--green)}.stat.red{border-top-color:var(--red)}.stat.gold{border-top-color:var(--gold)}
.filter-note{font-size:12px;color:var(--blue);margin-bottom:6px}
.layout-side{display:flex;gap:12px;align-items:flex-start}
.layout-side .main-col{flex:1;min-width:0}
.side-panel{width:220px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;flex-shrink:0;position:sticky;top:70px}
.side-panel h4{margin:0 0 8px;font-size:14px}
.side-panel table{width:100%;border-collapse:collapse;font-size:13px}
.side-panel td{padding:4px;border-bottom:1px solid var(--line)}
.side-panel td:last-child{text-align:left;direction:ltr}

/* ---------- messages ---------- */
#msgArea{margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.msg{border-radius:8px;padding:7px 12px;font-size:13px;display:flex;gap:8px;align-items:center}
.msg.warn{background:var(--warn-bg);color:var(--warn);border:1px solid #f3d49b}
.msg.err{background:var(--red-bg);color:var(--red);border:1px solid #f0b9b9}
.msg.info{background:#e7f0fd;color:var(--blue);border:1px solid #c3d8f7}
#toasts{position:fixed;bottom:16px;left:16px;display:flex;flex-direction:column;gap:6px;z-index:200}
.toast{background:var(--navy);color:#fff;padding:9px 14px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:420px;font-size:13px}
.toast.ok{background:var(--green)}.toast.err{background:var(--red)}.toast.warn{background:var(--warn)}

/* ---------- grid ---------- */
.grid-wrap{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 290px)}
table.grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
.grid th{position:sticky;top:0;background:var(--navy);color:#fff;font-weight:500;font-size:11.5px;padding:4px 5px;border-left:1px solid #2b3d6b;white-space:normal;line-height:1.2;z-index:2;text-align:right}
.grid th .fbtn{background:transparent;border:0;color:#aeb8d6;padding:0 3px;font-size:11px}
.grid th .fbtn.on{color:var(--gold)}
.grid th.num{text-align:left}
.grid td{border-bottom:1px solid var(--line);border-left:1px solid #eef0f5;padding:1px 4px;vertical-align:middle;white-space:nowrap;font-size:13px;line-height:1.2}
.grid tr:hover td{background:#fafbff}
.grid tr.flash td{animation:flash 2s}
@keyframes flash{0%,40%{background:var(--gold-soft)}100%{background:transparent}}
.grid td.auto{background:var(--auto)}
.grid td.num{text-align:left;direction:ltr}
.grid input.cell,.grid select.cell{border:1px solid #d7dbe6;border-radius:5px;background:var(--edit);padding:1px 4px;height:22px;line-height:18px;width:100%;min-width:46px}
.grid input.cell:focus,.grid select.cell:focus{outline:2px solid var(--gold);background:#fff}
.grid input.cell.num{text-align:left;direction:ltr}
.grid input.cell.w-s{min-width:40px;width:44px}
.grid input.cell.w-n{min-width:56px;width:60px}
.grid input.cell.w-y{min-width:52px;width:56px}
.grid select.cell.w-t{min-width:58px;width:62px}
.grid select.cell.w-s{min-width:46px;width:50px}
.grid input.cell.w-m{min-width:74px;width:80px}
.grid input.cell.w-ord{min-width:92px;width:96px}
.grid input.cell.w-l{min-width:110px;width:130px}
.computed{min-width:56px}
.grid td.sticky-r{position:sticky;right:0;background:#fff;z-index:1}
.grid th.sticky-r{right:0;z-index:3}
.computed{direction:ltr;display:inline-block;min-width:70px;text-align:left}
.ovr{background:#fff0c2;border-radius:4px;padding:0 3px}
.ovr-mark{color:var(--warn);font-size:11px;cursor:pointer;margin-inline-start:3px}
.muted{color:var(--muted)}
.fc{font-style:italic;color:var(--muted)}
.red{color:var(--red)!important;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:3px;border:1px solid #b9c6e6;background:#eef3ff;color:var(--blue);border-radius:6px;padding:1px 6px;cursor:pointer;direction:ltr}
.chip.linked{background:#e3f5e8;border-color:#9fd3ae;color:var(--green)}
.chip.zero{background:var(--red-bg);border-color:#f0b9b9;color:var(--red);font-weight:700}
.chip .ed{color:var(--muted);font-size:11px;padding-left:2px}
.status{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;cursor:pointer;user-select:none}
.status.no{background:var(--red-bg);color:var(--red)}
.status.yes{background:var(--green-bg);color:var(--green)}
.status.fc{background:#eef0f5;color:var(--muted);font-style:normal}
.row-del{border:0;background:transparent;color:#b8bdc9;font-size:15px;padding:0 4px}
.row-del:hover{color:var(--red)}
.term-wrap{display:flex;flex-direction:column;gap:1px}
.term-wrap small{font-size:10.5px;color:var(--muted);direction:ltr;text-align:right;white-space:nowrap}
.tot-row td{background:var(--gold-soft)!important;font-weight:700;position:sticky;bottom:0}

/* ---------- date picker ---------- */
.dp{display:inline-flex;align-items:center;gap:2px}
.dp input{width:76px!important;min-width:76px!important;direction:ltr;text-align:center;font-size:12.5px}
.dp button{border:0;background:transparent;padding:0 1px;font-size:12px}
.period-bar .dp input{width:100px!important;min-width:100px!important;font-size:13px}
#dpPop{position:fixed;background:#fff;border:1px solid #e3e6ec;border-radius:12px;box-shadow:0 10px 30px rgba(20,33,61,.18);padding:12px 12px 10px;z-index:300;width:300px;font-family:inherit}
#dpPop .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
#dpPop .hd select{flex:1;height:34px;border:1px solid #d9dde4;border-radius:7px;padding:0 8px;background:#fff;font-size:14px;color:#1b2233}
#dpPop .hd .nav{flex:0 0 34px;width:34px;height:34px;border:1px solid #d9dde4;background:#fff;border-radius:7px;font-size:18px;line-height:1;color:#6b7385;padding:0}
#dpPop .hd .nav.prev{color:var(--red)}
#dpPop .hd .nav:hover:not(:disabled){background:#f4f5f9}
#dpPop .hd .nav:disabled{opacity:.35;cursor:default}
#dpPop table{width:100%;border-collapse:collapse;text-align:center;table-layout:fixed}
#dpPop th{font-size:12px;color:#8a92a3;font-weight:400;padding:4px 0 8px}
#dpPop td{padding:2px 0}
#dpPop td button{width:36px;height:34px;border:2px solid transparent;border-radius:7px;background:transparent;font-size:14px;color:#1b2233}
#dpPop td button:hover{background:#eef0f6}
#dpPop td button.inmonth{background:#eef1f8}
#dpPop td button.sel{background:var(--navy2);color:#fff;font-weight:700}
#dpPop td button.today{background:var(--navy2);color:#fff;font-weight:700;border-color:var(--red)}
#dpPop .ft{display:flex;justify-content:space-between;margin-top:10px}
#dpPop .fbt{height:32px;padding:0 14px;border:1px solid #d9dde4;border-radius:7px;background:#fff;color:#1b2233;font-size:13.5px}
#dpPop .fbt:hover{background:#f4f5f9}

/* ---------- filter popup ---------- */
#fPop{position:fixed;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:8px;z-index:300;width:220px}
#fPop input[type=text]{width:100%;margin-bottom:6px;padding:4px 6px;border:1px solid var(--line);border-radius:6px}
#fPop .list{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px}
#fPop label{display:flex;gap:6px;align-items:center;padding:2px 2px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fPop .ft{display:flex;gap:4px;justify-content:space-between;margin-top:6px}

/* ---------- drop zone ---------- */
.docbar{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin-top:12px}
.dropzone{flex:1;min-width:260px;border:2px dashed #9aa6c6;border-radius:12px;background:#fafbff;padding:14px;text-align:center;color:var(--muted)}
.dropzone.over{background:var(--lav);border-color:var(--navy2);color:var(--navy)}
.docpath{flex:1;min-width:260px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.docpath label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.docpath .r{display:flex;gap:6px}
.docpath input{flex:1;direction:ltr;padding:6px;border:1px solid var(--line);border-radius:6px}
.doclist{font-size:12px;margin-top:6px;max-height:110px;overflow:auto;text-align:right}
.doclist div{padding:2px 0;border-bottom:1px dashed var(--line)}

/* ---------- modal ---------- */
#modalBg{position:fixed;inset:0;background:rgba(15,22,40,.5);z-index:250;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{max-width:1100px}
.modal .mh{background:var(--navy);color:#fff;padding:12px 16px;font-weight:700;font-size:16px;display:flex;align-items:center;border-radius:14px 14px 0 0;position:sticky;top:0;z-index:2}
.modal .mh .x{margin-inline-start:auto;background:transparent;border:0;color:#fff;font-size:20px}
.modal .mb{padding:16px}
.modal .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start;position:sticky;bottom:0;background:#fff}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-weight:500;margin-bottom:4px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px}
.form-row .hint{font-size:12px;color:var(--muted);margin-top:3px}
.type-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.type-card{border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:center}
.type-card b{display:block;font-size:15px;margin-bottom:4px}
.type-card span{font-size:12px;color:var(--muted)}
.type-card.sel{border-color:var(--gold);background:var(--gold-soft)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv div:nth-child(odd){color:var(--muted)}
table.simple{border-collapse:collapse;width:100%;font-size:13px}
table.simple th,table.simple td{border:1px solid var(--line);padding:5px 7px;text-align:right}
table.simple th{background:var(--lav)}
table.simple td.num{direction:ltr;text-align:left}
.setting-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.setting-card h3{margin:0 0 10px;font-size:15px}
.setting-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.empty-state{background:#fff;border:1px dashed #b9c0d3;border-radius:12px;padding:30px;text-align:center;color:var(--muted)}
.empty-state b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.an-card{background:#fff;border:1px solid var(--line);border-right:4px solid var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:8px}
.an-card.s-exception{border-right-color:var(--green)}
.an-card.s-fix{border-right-color:var(--blue)}
.an-card .kv{margin:6px 0}
.indent td:nth-child(3){padding-right:22px}
/* ---------- new project modal (לפי העיצוב) ---------- */
.modal.np-modal{max-width:640px;border-radius:12px;padding:22px 20px 18px;background:#fff}
.np-title{font-size:17px;font-weight:700;color:#1b1f23;margin-bottom:18px}
.np-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.np-card{border:1.5px solid #d4d8dd;border-radius:10px;padding:16px 12px;text-align:center;cursor:pointer;background:#fff;transition:border-color .12s,background .12s}
.np-card:hover{border-color:#9fb3a8}
.np-card b{display:block;font-size:14.5px;color:#1b1f23;margin-bottom:6px}

<script>
/* =====================================================================
   ATLAS – מערכת תזרים ופרויקטים | שלב א׳ (תבנית ריקה)
   מבנה: utils · state/storage · templates · calc · cashflow · anomalies
   ===================================================================== */
'use strict';

/* ---------------- utils ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = p => (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const r2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const clone = o => JSON.parse(JSON.stringify(o));
function num(v) {
  if (v === null || v === undefined) return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  const s = String(v).replace(/[,₪\s]/g, '').replace(/^\((.*)\)$/, '-$1');
  if (s === '' || s === '-') return null;
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
const nz = v => num(v) || 0;
function fmtMoney(n, blankZero) {
  if (n === null || n === undefined || n === '') return '';
  const v = Number(n);
  if (!isFinite(v)) return '';
  if (blankZero && v === 0) return '';
  return v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtNum(n) {
  if (n === null || n === undefined || n === '') return '';
  const v = Number(n); if (!isFinite(v)) return '';
  return v.toLocaleString('en-US', { maximumFractionDigits: 4 });
}
const pad2 = n => String(n).padStart(2, '0');
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
const curMonth = () => todayISO().slice(0, 7);
function isoFromParts(y, m, d) {
  y = +y; m = +m; d = +d;
  if (y < 100) y += 2000;
  const dt = new Date(y, m - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== m - 1 || dt.getDate() !== d) return null;
  return y + '-' + pad2(m) + '-' + pad2(d);
}
function parseDateInput(s) {
  if (s === null || s === undefined) return null;
  if (typeof s === 'number') return excelSerialToISO(s);
  s = String(s).trim();
  if (!s) return '';
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return isoFromParts(m[1], m[2], m[3]);
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
  if (m) return isoFromParts(m[3], m[2], m[1]);
  m = s.match(/^(\d{2})(\d{2})(\d{4})$/);
  if (m) return isoFromParts(m[3], m[2], m[1]);
  if (/^\d{5}(\.\d+)?$/.test(s)) return excelSerialToISO(+s);
  return null;
}
function excelSerialToISO(n) {
  const d = new Date(Math.round((n - 25569) * 86400000));
  return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate());
}
function fmtDate(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-'); return d + '/' + m + '/' + y; }
function addDays(iso, n) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(y, m - 1, d + Number(n || 0));
  return dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate());
}
function monthAdd(ym, k) { let [y, m] = ym.split('-').map(Number); m += k; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return y + '-' + pad2(m); }
function hoursToHHMM(h) {
  h = num(h); if (h === null) return '';
  const neg = h < 0; h = Math.abs(h);
  let H = Math.floor(h), M = Math.round((h - H) * 60);
  if (M === 60) { H++; M = 0; }
  return (neg ? '-' : '') + H + ':' + pad2(M);
}
function hashStr(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function download(name, content, mime) {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime || 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function toast(text, kind, ms) {
  const t = document.createElement('div');
  t.className = 'toast ' + (kind || '');
  t.textContent = text;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), ms || 3800);
}

/* ---------------- state ---------------- */
/* סוגי תנועה בבנק – רשימה נפתחת שמתרחבת לבד (אפשר להוסיף סוג חדש מתוך הטבלה) */
const BANK_TX_TYPES = ['עמלת בנק', 'העברה לפיקדון', 'משיכה מפיקדון', 'ריבית / רווח', 'דיבידנד', 'העברה בנקאית', 'תשלום לעצמאי', 'החזר / זיכוי', 'תנועה בנקאית אחרת'];
const BANK_TYPE_MIGRATE = { fee: 'עמלת בנק', deposit: 'העברה בנקאית', withdrawal: 'משיכה מפיקדון', other: 'תנועה בנקאית אחרת' };
const SCHEMA = 'atlas-cashflow';
const SCHEMA_VERSION = 1;
function defaultState() {
  return {
    schema: SCHEMA, version: SCHEMA_VERSION, createdAt: new Date().toISOString(), savedAt: null,
    settings: {
      openingBalance: 0, openingDate: '', vatDefault: 18, kmRate: 1.4,
      supplierPayOffsetDays: 0, salaryDateRule: 'payDate', includeForecast: true, autosave: true,
      // כמה ימים לפני סיום תוקף הזמנה להתחיל להתריע (ניתן לשינוי גם בכל הזמנה בנפרד)
      orderAlertDays: 30,
      // מראה הטבלה בגיליון הראשי: 'classic' (צפוף וצבעוני) או 'soft' (מרווח ועדין)
      cfSkin: 'classic',
      bankFee: { startMonth: '', history: [{ from: '0000-00', amount: 26 }], generated: {} },
      bankTxTypes: BANK_TX_TYPES.slice(),
      // קבוצות שמות של אותו אדם (השם הראשון הוא השם הראשי)
      personAliases: [['ברוך בארי כהן', 'ברי', 'בארי', 'ברוך כהן', 'בארי כהן']]
    },
    entities: {}, entityOrder: [],
    ops: {
      salaries: { docPath: '', rows: [] }, pensions: { docPath: '', rows: [] },
      authorities: { docPath: '', rows: [] }, bank: { docPath: '', rows: [], deposit: { opening: 0, openingDate: '', rows: [] } },
      credit: { docPath: '', rows: [], imports: [], cards: [], recurring: [], recon: {} }
    },
    employees: [], docs: {}, anomalies: {}
  };
}
let S = defaultState();
const UI = { view: 'main', sbOpen: { yazam: true, mod: true, regular: true, ops: true, freelancer: true }, filters: {}, editing: null, flashRow: null, cfShowForecast: null };
const sessionBlobs = {}; // docId -> objectURL (לסשן הנוכחי בלבד)

/* ---------------- storage adapter (נפרד מהקוד) ---------------- */
const Storage = {
  key: 'atlas_cashflow_v1',
  name: 'שמירה מקומית בדפדפן',
  load() { const s = localStorage.getItem(this.key); return s ? JSON.parse(s) : null; },
  save(obj) {
    const json = JSON.stringify(obj);
    localStorage.setItem(this.key, json);
    const back = localStorage.getItem(this.key);
    if (back !== json) throw new Error('אימות שמירה נכשל – הנתון שנקרא חזרה אינו זהה');
    return json.length;
  }
};
let dirty = false, saveTimer = null;
function setSaveState(kind, text) { const el = $('#saveState'); el.className = kind; el.textContent = text; }
function markDirty() {
  dirty = true;
  setSaveState('dirty', '● שינויים לא נשמרו');
  if (S.settings.autosave) { clearTimeout(saveTimer); saveTimer = setTimeout(() => saveNow(true), 1200); }
}
function saveNow(silent) {
  clearTimeout(saveTimer);
  try {
    S.savedAt = new Date().toISOString();
    const bytes = Storage.save(S);
    dirty = false;
    const t = new Date().toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
    setSaveState('ok', '✓ נשמר ואומת ' + t);

function normalizeState(o) {
  const d = defaultState();
  const s = Object.assign(d, o || {});
  s.settings = Object.assign(defaultState().settings, (o && o.settings) || {});
  s.settings.bankFee = Object.assign(defaultState().settings.bankFee, s.settings.bankFee || {});
  s.ops = Object.assign(defaultState().ops, s.ops || {});
  for (const k of Object.keys(defaultState().ops)) {
    s.ops[k] = Object.assign({ docPath: '', rows: [] }, s.ops[k] || {});
    if (!Array.isArray(s.ops[k].rows)) s.ops[k].rows = [];
  }
  if (!Array.isArray(s.ops.credit.imports)) s.ops.credit.imports = [];
  if (!Array.isArray(s.ops.credit.cards)) s.ops.credit.cards = [];
  if (!Array.isArray(s.ops.credit.recurring)) s.ops.credit.recurring = [];
  if (!s.ops.credit.recon || typeof s.ops.credit.recon !== 'object') s.ops.credit.recon = {};
  // אשראי: מבנה ישן (כרטיס כטקסט, סכום שלילי = זיכוי) → כרטיסים מנוהלים + סוג פעולה
  s.ops.credit.rows.forEach(r => {
    if (!r.kind) { r.kind = nz(r.amount) < 0 ? 'credit' : 'charge'; r.amount = Math.abs(nz(r.amount)); }
    if (!r.cardId && r.card) {
      const nm = String(r.card).trim();
      let card = s.ops.credit.cards.find(c => c.name === nm || c.last4 === nm);
      if (!card) { card = { id: uid('cc'), name: /^\d{4}$/.test(nm) ? 'כרטיס ' + nm : nm, last4: /^\d{4}$/.test(nm) ? nm : '', company: '', bankAccount: '', active: true }; s.ops.credit.cards.push(card); }
      r.cardId = card.id;
    }
  });
  if (!Array.isArray(s.settings.bankTxTypes) || !s.settings.bankTxTypes.length) s.settings.bankTxTypes = BANK_TX_TYPES.slice();
  if (!Array.isArray(s.settings.personAliases)) s.settings.personAliases = defaultState().settings.personAliases;
  s.settings.personAliases = s.settings.personAliases.filter(g => Array.isArray(g) && g.filter(Boolean).length > 1);
  s.ops.bank.deposit = Object.assign({ opening: 0, openingDate: '', rows: [] }, s.ops.bank.deposit || {});
  if (!Array.isArray(s.ops.bank.deposit.rows)) s.ops.bank.deposit.rows = [];
  // בנק: מבנה ישן (סכום + כיוון + קוד סוג) → הכנסה/הוצאה + סוג תנועה בעברית
  s.ops.bank.rows.forEach(r => {
    if (r.income === undefined && r.expense === undefined && r.amount !== undefined) {
      const dir = r.txType === 'deposit' ? 'in' : (r.txType === 'other' ? (r.direction || 'out') : 'out');
      const amt = Math.abs(nz(r.amount));
      if (dir === 'in') r.income = amt; else r.expense = amt;
    }
    if (BANK_TYPE_MIGRATE[r.txType]) r.txType = BANK_TYPE_MIGRATE[r.txType];
    if (r.reference) { r.notes = [r.notes, 'אסמכתה: ' + r.reference].filter(Boolean).join(' · '); delete r.reference; }
    if (!r.forMonth && r.date) r.forMonth = r.date.slice(0, 7);
    delete r.amount; delete r.direction;
    if (r.txType && !s.settings.bankTxTypes.includes(r.txType)) s.settings.bankTxTypes.push(r.txType);
  });
  // סוג התנועה "תשלום לעצמאי" נוסף לאתרים קיימים שנשמרו לפניו
  if (!s.settings.bankTxTypes.includes('תשלום לעצמאי')) s.settings.bankTxTypes.splice(6, 0, 'תשלום לעצמאי');
  s.entities = s.entities || {};
  s.entityOrder = (s.entityOrder || []).filter(id => s.entities[id]);
  for (const id of Object.keys(s.entities)) {
    if (!s.entityOrder.includes(id)) s.entityOrder.push(id);
    const e = s.entities[id];
    if (!Array.isArray(e.rows)) e.rows = [];
    e.rows.forEach(migrateOffset);
    // חוצץ אדם: מבנה ישן (ללא מע״מ + מע״מ% + תוספת/קיזוז) → סכום אחד
    if (e.type === 'freelancer') e.rows.forEach(r => {
      if (r.amount === undefined) {
        const tot = (r.ov && r.ov.total != null && r.ov.total !== '') ? nz(r.ov.total) : r2(nz(r.net) * (1 + nz(r.vatPct) / 100));
        r.amount = r2(tot + r2(Math.abs(nz(r.offAdd)) - Math.abs(nz(r.offDed))));
        delete r.net; delete r.vatPct; delete r.offAdd; delete r.offDed; if (r.ov) delete r.ov.total;
      }
    });
  }
  // פנסיות: מבנה ישן (amount/depType) → מבנה חדש
  s.ops.pensions.rows.forEach(r => {
    if (r.amount !== undefined && r.empDeposit === undefined && r.erDeposit === undefined && r.severance === undefined) {
      r.ov = r.ov || {}; if (nz(r.amount)) r.ov.total = nz(r.amount);
      if (!r.fundKind && r.depType) r.fundKind = r.depType;
      if (r.status === undefined) r.status = !!r.payDate;
      delete r.amount; delete r.depType;
    }
  });
  s.employees = s.employees || []; s.docs = s.docs || {}; s.anomalies = s.anomalies || {};
  // ניקוי: גרסה קודמת פתחה רשומת אדם בכ״א מכל שם שהוקלד בעמודת ״גוף״ בבנק, כולל שמות
  // שאינם אנשים (למשל ״פיקדון בנקאי״). הרשומות האלה מוסרות, ותנועות הבנק שלהן משוחררות
  // וחוזרות להיות תנועות בנק רגילות – הכסף עצמו נשמר, רק השיוך המוטעה בוטל.
  for (const id of Object.keys(s.entities)) {
    const e = s.entities[id];
    if (e.type !== 'freelancer' || !e.unmatchedName) continue;
    const isPerson = s.employees.some(x => String(x.name || '').trim() === String(e.name || '').trim());
    if (isPerson) { delete e.unmatchedName; continue; }
    for (const r of e.rows || []) {
      const b = s.ops.bank.rows.find(x => x.id === r.bankRowId);
      if (!b) continue;
      delete b.freeEntId; delete b.freeRowId;
      // תנועת פיקדון שנחטפה – מוחזרת לזהותה המקורית
      if (b.depId) { b.party = 'פיקדון בנקאי'; b.txType = Math.abs(nz(b.income)) ? 'משיכה מפיקדון' : 'העברה לפיקדון'; }
    }
    for (const d of Object.values(s.docs)) if (d.tabId === id) delete s.docs[d.id];
    delete s.entities[id];
    s.entityOrder = s.entityOrder.filter(x => x !== id);
  }
  return s;
}

      c.income = ac.isCredit ? ac.amount : 0;
      c.expense = ac.isCredit ? 0 : ac.amount;
      c.both = false;
      c.dir = ac.isCredit ? 'in' : 'out';
      c.amount = ac.amount;
      c.authName = ac.authName;
      c.cfDate = asrc.payDate || asrc.dueDate || row.date || '';

      return c;
    }
    // שורה שמקושרת לחוצץ עצמאי – התנועה נספרת כאן, אך מוצגת בגיליון הראשי תחת שם האדם
    const fl = freeRowOf(row);
    c.toFree = !!fl;
    c.freeMissing = !!row.freeRowId && !fl;
    if (fl) { c.freeName = fl.ent.name; c.freeEntId = fl.ent.id; c.freeDoc = String(fl.row.taxReceiptNo || '').trim(); c.freeProject = fl.row.projectName || ''; }
    // ממלאים רק צד אחד: הכנסה או הוצאה. הכיוון והסכום נגזרים מהם.
    const inc = Math.abs(nz(row.income)), exp = Math.abs(nz(row.expense));
    c.income = inc; c.expense = exp;
    c.both = inc > 0 && exp > 0;
    c.dir = inc > 0 ? 'in' : 'out';
    c.amount = inc > 0 ? inc : exp;
    c.cfDate = row.date || '';
    c.inCashflow = !!(row.date && c.amount);
  }
  return c;
}

/* ---------------- cashflow (נגזר – לא נשמר) ---------------- */
const DOC_LABELS = { dealNo: 'ח.עסקה', taxInvNo: 'ח.מס', taxReceiptNo: 'ח.מס קבלה', receiptNo: 'קבלה', supplierDocNo: 'ספק', docNo: 'מסמך' };
function buildCashflow() {
  const out = [];
  const today = todayISO();
  const push = o => { if (o.date && o.amount) out.push(o); };
  for (const id of S.entityOrder) {
    const t = tabInfo(id); if (!t) continue;
    for (const row of t.rows) {
      const c = calcRow(t.kind, row);
      const isProj = PROJECT_TYPES.includes(t.kind);
      // היררכיה בגיליון הראשי: סוג פרויקט › לקוח › פרויקט
      const refBase = { tabId: id, rowId: row.id, serial: row.serial, tabName: t.name, group: isProj ? TYPE_LABEL[t.kind] : GROUP_LABEL[t.kind], client: isProj ? (t.entity.client || '') : t.name, ptype: isProj ? t.kind : '' };
      if (PROJECT_TYPES.includes(t.kind)) {
        const docs = ['dealNo', 'taxInvNo', 'taxReceiptNo', 'receiptNo'].filter(k => row[k]).map(k => ({ field: k, no: row[k] }));
        // צמד: הכנסה לאטלס + תשלום לספק של אותה שורה – מסומנים יחד בגיליון הראשי
        const pair = c.supplierPay ? id + '|' + row.id : null;
        push(Object.assign({}, refBase, {
          pair, key: id + '|' + row.id + '|in', dir: 'in', role: 'הכנסה לאטלס', amount: c.base,
          date: c.moneyDate || c.expectedDate, status: c.moneyDate ? 'actual' : 'forecast',
          entity: t.name, desc: (t.entity.owner ? 'אחראי: ' + t.entity.owner + ' · ' : '') + 'חודש ' + (row.month || '') + '/' + (row.year || ''), docs
        }));
        if (c.supplierPay) {
          const sd = c.supplierPayDate || c.supplierPayDateForecast;
          push(Object.assign({}, refBase, {
            pair, key: id + '|' + row.id + '|sup', dir: 'out', role: 'תשלום לספק', amount: c.supplierPay,
            date: sd, status: row.supplierPaid ? 'actual' : 'forecast', entity: t.name,
            desc: 'תשלום לספק' + (row.supplierDocDate ? ' · ח. מס קבלה ספק ' + fmtDate(row.supplierDocDate) : ''),
            docs: [{ field: 'supplierDocNo', no: row.supplierDocNo || '', zero: String(row.supplierDocNo || '').trim() === '0' || !String(row.supplierDocNo || '').trim() }]
          }));
        }
      } else if (t.kind === 'freelancer') {
        if (!c.inCashflow) continue; // תשלום שנרשם בחוצץ הבנק נספר שם
        push(Object.assign({}, refBase, {
          key: id + '|' + row.id, dir: 'out', role: 'תשלום לעצמאי', amount: c.base, date: row.payDate,
          status: row.payDate && row.payDate <= today ? 'actual' : 'forecast', entity: t.name, desc: row.projectName || '',
          docs: row.taxReceiptNo ? [{ field: 'taxReceiptNo', no: row.taxReceiptNo }] : []
        }));
      }
    }
  }
  const opsRef = (k, row) => ({ tabId: 'ops:' + k, rowId: row.id, serial: row.serial, tabName: OPS[k], group: 'תפעול' });
  for (const row of S.ops.salaries.rows) {
    const c = calcRow('salaries', row);
    if (!c.inCashflow) continue; // שורת תזרים אחת לכל משכורת – רק כששולם ויש תאריך
    push(Object.assign(opsRef('salaries', row), { key: 'sal|' + row.id, salGroup: 'salgrp|' + row.payDate, grpMonth: (row.month || '') + '/' + (row.year || ''), dir: 'out', role: 'משכורת', amount: nz(row.net), date: row.payDate, status: 'actual', entity: employeeName(row.employeeId), client: employeeName(row.employeeId), desc: 'שכר ' + (row.month || '') + '/' + (row.year || ''), docs: [] }));
  }
  for (const row of S.ops.pensions.rows) {
    const c = calcRow('pensions', row);
    if (!c.inCashflow) continue; // רק הפקדה ששולמה ויש לה תאריך תשלום
    push(Object.assign(opsRef('pensions', row), { key: 'pen|' + row.id, salGroup: 'pengrp|' + row.payDate, grpMonth: (row.month || '') + '/' + (row.year || ''), dir: 'out', role: row.fundKind || 'פנסיה', amount: c.total, date: row.payDate, status: 'actual', entity: employeeName(row.employeeId), client: employeeName(row.employeeId), desc: (row.fundName ? row.fundName + ' · ' : '') + 'חודש ' + (row.month || '') + '/' + (row.year || ''), docs: [] }));
  }
  for (const row of S.ops.authorities.rows) {
    const c = calcRow('authorities', row);
    if (!c.inCashflow) continue;
    const per = (row.month || '') && (row.year || '') ? 'תקופה ' + row.month + '/' + row.year : '';
    push(Object.assign(opsRef('authorities', row), {
      key: 'auth|' + row.id, authGroup: 1, dir: c.dir, role: c.isCredit ? 'זיכוי מרשות' : 'תשלום לרשות', amount: c.amount, date: c.cfDate,
      status: row.status ? 'actual' : 'forecast', entity: c.authName, client: c.authName,
      desc: [per, row.method || '', row.notes || ''].filter(Boolean).join(' · '),
      docs: row.docNo ? [{ field: 'docNo', no: row.docNo }] : []
    }));
  }
  for (const row of S.ops.bank.rows) {
    const c = calcRow('bank', row);
    if (!c.inCashflow) continue;
    // "עבור איזה חודש" הוא מידע ניהולי בלבד – התזרים נקבע תמיד לפי התאריך בפועל
    const d = c.cfDate || row.date;
    const forM = row.forMonth && row.forMonth !== d.slice(0, 7) ? ' · עבור ' + row.forMonth.slice(5) + '.' + row.forMonth.slice(0, 4) : '';
    const docs = row.docNo ? [{ field: 'docNo', no: row.docNo }] : [];
    const base = Object.assign(opsRef('bank', row), { key: 'bank|' + row.id, dir: c.dir, amount: c.amount, date: d, status: d <= today ? 'actual' : 'forecast', desc: (row.description || '') + forM, docs });
    // תשלום לעצמאי מוצג תחת שם האדם, לצד השכר והפנסיה שלו, ולא בבלוק תנועות הבנק
    if (c.toFree) push(Object.assign(base, { group: GROUP_LABEL.freelancer, role: FREE_TX_TYPE, entity: c.freeName, client: c.freeName, tabName: c.freeName, desc: [c.freeProject, row.description || ''].filter(Boolean).join(' · ') + forM }));
    else push(Object.assign(base, { bankGroup: 1, role: row.txType || 'תנועה בנקאית', entity: (c.fromAuth ? c.authName : row.party) || 'בנק', client: 'בנק' }));
  }
  // אשראי: שורה אחת לכל חיוב חודשי של כרטיס (סכום העסקאות פחות הזיכויים), לפי מועד החיוב בבנק
  const groups = {};
  for (const row of S.ops.credit.rows) {
    const c = calcRow('credit', row);
    if (!c.inCashflow) continue;
    const g = c.chargeDate + '|' + (row.cardId || '');
    (groups[g] = groups[g] || { date: c.chargeDate, cardId: row.cardId || '', amount: 0, count: 0, credits: 0, rowId: row.id }).amount += c.signed;
    groups[g].count++;
    if (c.isCredit) groups[g].credits++;
  }
  for (const g of Object.keys(groups).sort()) {
    const x = groups[g]; const amt = r2(x.amount);
    if (!amt) continue;
    const nm = ccCardName(x.cardId);
    push({ key: 'cc|' + g, ccGroup: g, tabId: 'ops:credit', rowId: x.rowId, tabName: 'אשראי', group: 'תפעול', dir: amt >= 0 ? 'out' : 'in', role: 'חיוב אשראי', amount: Math.abs(amt), date: x.date, status: x.date <= today ? 'actual' : 'forecast', entity: nm, client: nm, desc: x.count + ' עסקאות' + (x.credits ? ' · כולל ' + x.credits + ' זיכויים' : '') + (ccReconOf(g) ? ' · הותאם לבנק' : ''), docs: [] });
  }
  const cmp = (x, y) => String(x || '').localeCompare(String(y || ''), 'he', { numeric: true });
  const isOpsE = e => String(e.tabId || '').startsWith('ops:');
  out.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.dir !== b.dir ? (a.dir === 'in' ? -1 : 1) : (cmp(a.group, b.group) ||
    (isOpsE(a) && isOpsE(b) ? (cmp(a.tabName, b.tabName) || cmp(a.client, b.client)) : (cmp(a.client, b.client) || cmp(a.tabName, b.tabName))))));
  return out;
}
function cashflowWithBalance(includeForecast) {
  const rows = buildCashflow().filter(r => includeForecast || r.status === 'actual');
  let bal = nz(S.settings.openingBalance);
  rows.forEach((r, i) => { bal = r2(bal + (r.dir === 'in' ? r.amount : -r.amount)); r.balance = bal; r.n = i + 1; });

}
function actualBalanceToday() {
  const t = todayISO();

}

/* ---------------- anomalies ---------------- */
function detectAnomalies() {
  const list = [];
  for (const id of S.entityOrder) {
    const t = tabInfo(id); if (!t) continue;
    const fields = OVERRIDABLE_NUM[t.kind] || [];
    for (const row of t.rows) {
      const c = calcRow(t.kind, row);
      for (const f of fields) {
        if (!c.isOv[f]) continue;
        const existing = num(row.ov[f]), computed = num(c.auto[f]);
        if (computed === null || existing === null) continue;
        const diff = r2(existing - computed);
        if (Math.abs(diff) < 0.005) continue;
        const key = id + '|' + row.id + '|' + f;
        const dec = S.anomalies[key];
        const decided = dec && dec.value === existing ? dec : null;
        list.push({
          key, tabId: id, rowId: row.id, field: f, tabName: t.name, serial: row.serial,
          label: (COLS[t.kind].find(x => x.key === f) || {}).label || f,
          existing, computed, diff, formula: FORMULA[t.kind + '.' + f] || '',
          status: decided ? decided.status : 'pending', note: decided ? decided.note : '', decidedAt: decided ? decided.decidedAt : ''
        });
      }
    }
  }
  return list;
}
function pendingAnomalyCount(tabId) { return detectAnomalies().filter(a => a.status === 'pending' && (!tabId || a.tabId === tabId)).length; }

    case 'computed': return col.text ? String(c[col.key] == null ? '' : c[col.key]) : (col.key === 'hhmm' ? (c.hhmm || '') : fmtMoney(c[col.key]));
    case 'numAuto': return col.money === false ? fmtNum(c[col.key]) : fmtMoney(c[col.key]);
    case 'num': return col.money ? fmtMoney(num(v)) : fmtNum(num(v));
    case 'adjust': { const ak = col.addKey || 'offAdd', dk = col.dedKey || 'offDed'; const a = Math.abs(nz(row[ak])), d = Math.abs(nz(row[dk])); if (ak === 'offAdd' && row.offAdd === undefined && row.offDed === undefined && nz(row.offset)) return fmtMoney(nz(row.offset)); return [a ? '+' + fmtMoney(a) : '', d ? '−' + fmtMoney(d) : ''].filter(Boolean).join(' / '); }
    case 'pct': return num(v) === null ? '' : fmtNum(num(v)) + '%';

    case 'bankDir': return c.dir === 'in' ? 'הכנסה' : 'הוצאה';
    case 'card': return ccCardById(v) ? ccCardName(v) : '';
    case 'authority': return v || '';
    case 'authCode': return v || '';
    case 'bankType': return v || '';

/* ---- date picker (רכיב אחד לכל האתר) ---- */
const HEB_MONTHS = ['ינואר', 'פברואר', 'מרץ', 'אפריל', 'מאי', 'יוני', 'יולי', 'אוגוסט', 'ספטמבר', 'אוקטובר', 'נובמבר', 'דצמבר'];

const CAL_MIN_YEAR = 2023;
/* רכיב לוח שנה אחיד לכל האתר.
   opts: { value: ISO, onPick(iso), pickMonth: bool (לחיצה על יום בוחרת את החודש) } */
function openCalendar(anchor, opts) {
  closePopups();

  const cur = opts.value || today;
  let [y, m] = cur.split('-').map(Number);
  const maxYear = Math.max(new Date().getFullYear() + 3, y);

  const pop = document.createElement('div'); pop.id = 'dpPop';

    const atMin = y === minYear && m === 1, atMax = y === maxYear && m === 12;

      '<select class="mSel" aria-label="חודש">' + HEB_MONTHS.map((n, i) => '<option value="' + (i + 1) + '"' + (i + 1 === m ? ' selected' : '') + '>' + n + '</option>').join('') + '</select>' +
      '<select class="ySel" aria-label="שנה">' + yOpts + '</select>' +

    html += '<table><tr>' + ['א׳', 'ב׳', 'ג׳', 'ד׳', 'ה׳', 'ו׳', 'ש׳'].map(d => '<th>' + d + '</th>').join('') + '</tr><tr>';
    const first = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate();
    const selIso = opts.value || '';
    const selMonth = opts.pickMonth && selIso ? selIso.slice(0, 7) : '';
    for (let i = 0; i < first; i++) html += '<td></td>';
    for (let d = 1; d <= days; d++) {
      const iso = y + '-' + pad2(m) + '-' + pad2(d);
      const cls = (iso === today ? 'today ' : '') + (!opts.pickMonth && iso === selIso ? 'sel ' : '') ;
      html += '<td><button data-iso="' + iso + '" class="' + cls.trim() + '">' + d + '</button></td>';
      if ((first + d) % 7 === 0 && d < days) html += '</tr><tr>';
    }
    html += '</tr></table><div class="ft"><button class="fbt tdy">היום</button><button class="fbt cls">סגור</button></div>';
    pop.innerHTML = html;
    $('.prev', pop).onclick = () => { if (atMin) return; m--; if (m < 1) { m = 12; y--; } draw(); };
    $('.next', pop).onclick = () => { if (atMax) return; m++; if (m > 12) { m = 1; y++; } draw(); };
    $('.mSel', pop).onchange = e => { m = +e.target.value; draw(); };
    $('.ySel', pop).onchange = e => { y = +e.target.value; draw(); };
    $$('td button', pop).forEach(b => b.onclick = () => commit(b.dataset.iso));
    $('.tdy', pop).onclick = () => commit(today);
    $('.cls', pop).onclick = closePopups;
  };
  const commit = iso => { closePopups(); opts.onPick(iso); };
  pop.addEventListener('keydown', e => { if (e.key === 'Escape') closePopups(); });
  draw();
  positionPop(pop, anchor);
}

    case 'num': return td('<input class="cell num ' + (col.money ? 'mny w-m' : 'w-n') + '" type="text" inputmode="decimal" value="' + esc(col.money ? fmtMoney(num(v)) : fmtNum(num(v))) + '" data-type="num" ' + a + '>');
    case 'adjust': {
      const ra = 'data-row="' + row.id + '"', ak = col.addKey || 'offAdd', dk = col.dedKey || 'offDed', forSup = !!col.addKey;
      const a = row[ak] == null ? '' : fmtMoney(Math.abs(num(row[ak]))), d = row[dk] == null ? '' : fmtMoney(Math.abs(num(row[dk])));
      const net = forSup ? adjNet(row, ak, dk) : rowOffset(row);
      // הסכומים מוזנים ללא מע״מ; ההשפעה בפועל על התשלום היא נטו × (1 + מע״מ%)
      const gross = r2(net * (1 + nz(row.vatPct) / 100));
      return td('<div class="adj' + (forSup ? ' sup' : '') + '" title="' + (forSup ? 'מתווסף/מקוזז ישירות מהתשלום לספק' : 'משנה את הסכום שאטלס מקבלת בלבד') + ' · מוזן ללא מע״מ · נטו: ' + fmtMoney(net) + ' · בתשלום (כולל מע״מ): ' + fmtMoney(gross) + '">' +
        '<label class="ln add"><span class="sg">+</span><input class="cell num" type="text" inputmode="decimal" placeholder="' + (forSup ? 'תוספת לספק' : 'תוספת') + '" value="' + esc(a) + '" data-type="num" ' + ra + ' data-key="' + ak + '"></label>' +
        '<label class="ln ded"><span class="sg">−</span><input class="cell num" type="text" inputmode="decimal" placeholder="' + (forSup ? 'קיזוז מהספק' : 'קיזוז') + '" value="' + esc(d) + '" data-type="num" ' + ra + ' data-key="' + dk + '"></label></div>');

    case 'year': return td('<input class="cell num w-y" list="yearsList" value="' + esc(v) + '" data-type="year" ' + a + '>');
    case 'month': return td('<select class="cell w-s" data-type="text" ' + a + '><option value=""></option>' + MONTHS.map(mm => '<option' + (mm === v ? ' selected' : '') + '>' + mm + '</option>').join('') + '</select>');
    case 'date': return td(dateInputHTML(v, a));
    case 'dateAuto': {

      if (col.text) return td('<span class="computed">' + esc(c[k] == null ? '' : c[k]) + '</span>', 'auto');

        return td('<span class="computed mny' + (adj ? ' adjusted' : '') + '"' + (adj ? ' title="כולל תוספת/קיזוז של ' + (adj > 0 ? '+' : '') + fmtMoney(adj) + ' ₪"' : '') + '>' + esc(fmtMoney(c[k])) + '</span>' + (adj ? '<span class="adj-mark">' + (adj > 0 ? '▲' : '▼') + '</span>' : ''), 'auto num');
      }
      return td('<span class="computed' + (col.money ? ' mny' : '') + '">' + esc(k === 'hhmm' ? (c.hhmm || '') : fmtMoney(c[k])) + '</span>', 'auto num');
    }
    case 'numAuto': {
      const isOv = c.isOv[k];
      const f = col.money === false ? fmtNum : fmtMoney;
      return td('<input class="cell num w-m ' + (col.money === false ? '' : 'mny ') + (isOv ? 'ovr' : 'fc') + '" type="text" value="' + esc(f(c[k])) + '" data-type="num" data-ov="1" ' + a + ' title="' + esc(isOv ? 'דריסה ידנית. חישוב אוטומטי: ' + f(c.auto[k]) : 'חישוב אוטומטי – ניתן לדרוס בהקלדה') + '">' + (isOv ? ovMark : ''), isOv ? '' : 'auto');
    }
    case 'doc': case 'supdoc': {
      const val = String(v == null ? '' : v).trim();
      const editing = UI.editing === row.id + ':' + k;
      if (!val || editing) return td('<input class="cell num w-n" type="text" value="' + esc(val) + '" data-type="text" ' + a + (editing ? ' data-autofocus="1"' : '') + ' placeholder="' + (col.type === 'supdoc' ? '0' : '') + '">');
      const linked = findDoc(t.tabId, row.id, k);
      const zero = col.type === 'supdoc' && val === '0';
      return td('<span class="chip ' + (zero ? 'zero' : linked ? 'linked' : '') + '" data-act="opendoc" ' + a + ' title="' + (zero ? 'מסמך ספק חסר' : linked ? 'פתח מסמך: ' + esc(linked.fileName) : 'לא קושר מסמך – גרור PDF לאזור המסמכים') + '">' + (zero ? '0 · חסר' : (linked ? '📄 ' : '') + esc(val)) + '<span class="ed" data-act="editdoc" ' + a + ' title="עריכת מספר">✎</span></span>');
    }
    case 'term': {
      const opts = TERMS.slice();
      const extra = [v, t.entity && t.entity.termDays].map(x => x == null ? '' : String(x)).filter(x => x && x !== 'manual' && !opts.some(o => o.v === x));
      [...new Set(extra)].forEach(x => opts.splice(opts.length - 1, 0, { v: x, l: '+' + x }));
      let inner = '<div class="term-wrap"><select class="cell w-t" data-type="text" ' + a + '>' + opts.map(x => '<option value="' + x.v + '"' + (String(v || '') === x.v ? ' selected' : '') + '>' + x.l + '</option>').join('') + '</select>';
      if (v === 'manual') inner += dateInputHTML(row.expectedManual, 'data-row="' + row.id + '" data-key="expectedManual"');
      else if (c.expectedDate) inner += '<small>צפי: ' + fmtDate(c.expectedDate) + '</small>';
      return td(inner + '</div>');
    }
    case 'toggle': {
      const L = t.kind === 'authorities' ? (row.action === 'credit' ? ['טרם התקבל', 'התקבל'] : ['טרם שולם', 'שולם']) : (TOGGLE_LABELS[k] || ['לא', 'כן']);
      return td('<span class="status ' + (v ? 'yes' : 'no') + '" data-act="toggle" ' + a + '>' + L[v ? 1 : 0] + '</span>');
    }
    case 'paidStatus': return td('<span class="status ' + (c.paid ? 'yes' : 'no') + '" title="נקבע לפי תאריך קבלת הכסף">' + (c.paid ? 'שולם' : 'טרם שולם') + '</span>');
    case 'employee': return td('<select class="cell w-m" data-type="employee" ' + a + '><option value=""></option>' + S.employees.map(e => '<option value="' + e.id + '"' + (e.id === v ? ' selected' : '') + '>' + esc(e.name) + '</option>').join('') + '<option value="__new">+ עובד חדש…</option></select>');
    case 'select': {
      const opts = (col.options || []).map(x => typeof x === 'string' ? { v: x, l: x } : x);
      if (v && !opts.some(o => o.v === v)) opts.push({ v, l: v });
      return td('<select class="cell w-m" data-type="text" ' + a + '><option value=""></option>' + opts.map(o => '<option value="' + esc(o.v) + '"' + (o.v === v ? ' selected' : '') + '>' + esc(o.l) + '</option>').join('') + '</select>');
    }
    case 'category': {
      const opts = CREDIT_CATEGORIES.slice(); if (v && !opts.includes(v)) opts.push(v);
      return td('<select class="cell w-m" data-type="text" ' + a + '>' + opts.map(o => '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>');
    }
    case 'authority': {
      const opts = AUTHORITIES.map(x => x.name); if (v && !opts.includes(v)) opts.push(v);
      return td('<select class="cell w-m" data-type="text" ' + a + '><option value=""></option>' + opts.map(o => '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>');
    }
    case 'authCode': {
      const codes = AUTHORITIES.map(x => x.code).filter(Boolean);
      return td('<input class="cell num w-s" list="authCodes" value="' + esc(v) + '" data-type="text" ' + a + ' placeholder="קוד מוסד">');
    }
    case 'card': {
      const cards = ccCards().filter(x => x.active !== false || x.id === v);
      return td('<select class="cell w-m" data-type="text" ' + a + '><option value=""></option>' + cards.map(x => '<option value="' + x.id + '"' + (x.id === v ? ' selected' : '') + '>' + esc(x.name + (x.last4 ? ' · ' + x.last4 : '')) + '</option>').join('') + '<option value="__new">+ כרטיס חדש…</option></select>');
    }
    case 'bankType': {
      const opts = bankTxTypes(); if (v && !opts.includes(v)) opts.push(v);
      return td('<select class="cell w-m" data-type="text" ' + a + '><option value=""></option>' + opts.map(o => '<option' + (o === v ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '<option value="__new">+ סוג חדש…</option></select>');
    }
    case 'party': {
      // תשלום לעצמאי חייב להיות מופנה לאדם קיים בכ״א – בחירה מרשימה, לא טקסט חופשי,
      // כדי שלא ייפתח בטעות "אדם" חדש משם שהוקלד (למשל ״פיקדון בנקאי״)
      if ((row.txType || '') === FREE_TX_TYPE) {
        const ppl = allPeople(false);
        const known = ppl.some(p => normPerson(p.name) === normPerson(v));
        return td('<select class="cell w-' + (col.w || 'm') + '" data-type="text" ' + a + '><option value="">— בחר אדם —</option>' +
          (v && !known ? '<option value="' + esc(v) + '" selected>' + esc(v) + ' (לא מזוהה)</option>' : '') +
          ppl.map(p => '<option value="' + esc(p.name) + '"' + (normPerson(p.name) === normPerson(v) ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('') + '</select>');
      }
      return td('<input class="cell w-' + (col.w || 'm') + '" type="text" list="bankPartyList" value="' + esc(v) + '" data-type="text" ' + a + ' placeholder="למי / ממי">');
    }
    case 'ymonth': {
      const lbl = v ? v.slice(5) + '.' + v.slice(0, 4) : '—';
      return td('<span class="mpick" data-act="pickymonth" ' + a + ' title="חודש ניהולי בלבד – אינו משפיע על מיקום התנועה בתזרים">' + lbl + '</span>');
    }
    case 'bankBal': {
      const b = bankBalanceOf(row.id);
      return td('<span class="computed' + (b !== null && b < 0 ? ' neg' : '') + '">' + (b === null ? '' : fmtMoney(b)) + '</span>', 'auto num');
    }
    case 'bankDir':
      if (row.txType === 'other') return td('<select class="cell w-s" data-type="text" ' + a + '><option value="out"' + (row.direction !== 'in' ? ' selected' : '') + '>הוצאה</option><option value="in"' + (row.direction === 'in' ? ' selected' : '') + '>הכנסה</option></select>');
      return td('<span class="' + (c.dir === 'in' ? '' : 'muted') + '">' + (c.dir === 'in' ? 'הכנסה' : 'הוצאה') + '</span>', 'auto');
  }
  return td(esc(v));
}

/* ---- בנק: רשימת סוגי תנועה, גופים ויתרת עו״ש מצטברת ---- */
function bankTxTypes() { return (S.settings.bankTxTypes || BANK_TX_TYPES).slice(); }
function bankPartyList() {
  const set = new Set(S.ops.bank.rows.map(r => (r.party || '').trim()).filter(Boolean));
  // שמות האנשים מוצעים גם הם, כדי שתשלום לעצמאי יתקשר לחוצץ הנכון
  allPeople(false).forEach(p => set.add(p.name));
  return '<datalist id="bankPartyList">' + [...set].map(x => '<option value="' + esc(x) + '">').join('') + '</datalist>';
}
let BANK_BAL = null;
function bankBalReset() { BANK_BAL = null; }
function bankBalMap() {
  if (BANK_BAL) return BANK_BAL;
  BANK_BAL = {};
  for (const r of cashflowWithBalance(true)) if (r.tabId === 'ops:bank' && r.rowId) BANK_BAL[r.rowId] = r.balance;
  return BANK_BAL;
}
function bankBalanceOf(rowId) { const m = bankBalMap(); return rowId in m ? m[rowId] : null; }

function gridHTML(t, items, opt) {
  const f = tabFilters(t.tabId);
  const so = opt && opt.sort ? opt.sort : null;
  const sel = opt && opt.select ? opt.select : null;
  let h = '<div class="grid-wrap" data-tab="' + t.tabId + '"><table class="grid"><thead><tr>';
  if (sel) {
    const allOn = items.length && items.every(x => sel.has(x.row.id));
    h += '<th class="selcol"><input type="checkbox" data-act="' + sel.allAct + '"' + (allOn ? ' checked' : '') + ' title="בחירת כל השורות המוצגות"></th>';
  }
  for (const col of t.cols) {
    const on = f[col.key] ? ' on' : '';
    const lbl = opt && opt.sortAct
      ? '<a href="#" class="sort-h" data-act="' + opt.sortAct + '" data-key="' + col.key + '" title="מיון לפי עמודה זו">' + esc(col.label) + (so && so.key === col.key ? (so.dir === 'asc' ? ' ▲' : ' ▼') : '') + '</a>'
      : esc(col.label);
    // רמז קצר מתחת לכותרת (למשל "ללא מע״מ" בעמודות תוספת/קיזוז) – אינו מרחיב את העמודה
    const hint = col.hint ? '<span style="display:block;font-size:10px;font-weight:400;opacity:.65">' + esc(col.hint) + '</span>' : '';
    h += '<th class="' + (col.type === 'serial' ? 'sticky-r' : '') + '">' + lbl + ' <button class="fbtn' + on + '" data-act="filter" data-key="' + col.key + '" title="סינון">▼</button>' + hint + '</th>';
  }
  h += '<th></th></tr></thead><tbody>';
  if (!items.length) {
    h += '<tr><td colspan="' + (t.cols.length + 1 + (sel ? 1 : 0)) + '" style="padding:24px;text-align:center" class="muted">' + (t.rows.length ? 'אין שורות התואמות לסינון' : 'החוצץ ריק – לחץ ״➕ הוספת שורה״ כדי להתחיל') + '</td></tr>';
  }
  for (const { row, c } of items) {
    const on = sel && sel.has(row.id);
    const rc = [UI.flashRow === row.id ? 'flash' : '', on ? 'selrow' : '', opt && opt.rowClass ? opt.rowClass(row, c) : ''].filter(Boolean).join(' ');
    h += '<tr data-row="' + row.id + '"' + (rc ? ' class="' + rc + '"' : '') + '>';
    if (sel) h += '<td class="selcol"><input type="checkbox" data-act="' + sel.act + '" data-row="' + row.id + '"' + (on ? ' checked' : '') + '></td>';
    for (const col of t.cols) h += cellHTML(t, col, row, c);
    h += '<td><button class="row-del" data-act="delrow" data-row="' + row.id + '" title="מחיקת שורה">🗑</button></td></tr>';
  }
  h += '</tbody></table></div>';
  return h;
}

/* ---- summaries ---- */
function statHTML(label, value, cls) { return '<div class="stat ' + (cls || '') + '"><div class="l">' + esc(label) + '</div><div class="v">' + value + '</div></div>'; }
function summariesHTML(t, items) {
  const sum = fn => r2(items.reduce((s, x) => s + (nz(fn(x))), 0));
  const n = items.length;
  let h = '<div class="stats">' + statHTML('שורות', n);
  if (PROJECT_TYPES.includes(t.kind)) {
    const sup = t.kind !== 'regular';
    if (sup) h += statHTML('שורות עם ספק', items.filter(x => x.c.supplierOn).length + ' / ' + n);
    if (t.kind === 'mod') {
      const hrs = sum(x => x.row.hours);
      h += statHTML('סה״כ שעות', fmtNum(r2(hrs)) + ' <small class="muted">(' + hoursToHHMM(hrs) + ')</small>');
      h += statHTML('ממוצע שעות לשורה', n ? fmtNum(r2(hrs / n)) : '0');
      h += statHTML('ימים', fmtNum(sum(x => x.row.days)));
      h += statHTML('סה״כ ק״מ', fmtNum(sum(x => x.c.kmMonth)));
      h += statHTML('לפני מע״מ', fmtMoney(sum(x => x.c.preVat)));
    } else {
      h += statHTML('ללא מע״מ', fmtMoney(sum(x => x.row.net)));
      h += statHTML('מע״מ', fmtMoney(sum(x => x.c.vatAmt)));
    }
    h += statHTML('כולל מע״מ', fmtMoney(sum(x => x.c.total)), 'gold');
    h += statHTML('תוספות (ללא מע״מ)', '<span style="color:var(--green)">' + fmtMoney(sum(x => Math.abs(nz(x.row.offAdd)))) + '</span>');
    h += statHTML('קיזוזים (ללא מע״מ)', '<span style="color:var(--red)">' + fmtMoney(sum(x => Math.abs(nz(x.row.offDed)))) + '</span>');
    h += statHTML('התקבל', fmtMoney(sum(x => x.c.paid ? x.c.base : 0)), 'green');
    h += statHTML('טרם התקבל', fmtMoney(sum(x => x.c.paid ? 0 : x.c.base)), 'red');
    if (sup) {
      h += statHTML('תשלום לספקים', fmtMoney(sum(x => x.c.supplierPay)));
      const sa = sum(x => x.c.supplierOn ? Math.abs(nz(x.row.supAdd)) : 0), sd = sum(x => x.c.supplierOn ? Math.abs(nz(x.row.supDed)) : 0);
      if (sa || sd) h += statHTML('התאמות לספק (ללא מע״מ)', '<span style="color:var(--green)">+' + fmtMoney(sa) + '</span> <span style="color:var(--red)">−' + fmtMoney(sd) + '</span>');
      h += statHTML('טרם שולם לספק', fmtMoney(sum(x => x.row.supplierPaid ? 0 : x.c.supplierPay)), 'red');
      h += statHTML('נטו לאטלס', fmtMoney(sum(x => x.c.atlasNet)), 'green');
    }
  } else if (t.kind === 'freelancer') {
    h += statHTML('ללא מע״מ', fmtMoney(sum(x => x.row.net)));
    h += statHTML('כולל מע״מ', fmtMoney(sum(x => x.c.total)), 'gold');
    h += statHTML('תוספות', '<span style="color:var(--green)">' + fmtMoney(sum(x => Math.abs(nz(x.row.offAdd)))) + '</span>');
    h += statHTML('קיזוזים', '<span style="color:var(--red)">' + fmtMoney(sum(x => Math.abs(nz(x.row.offDed)))) + '</span>');
    h += statHTML('שולם', fmtMoney(sum(x => x.row.payDate ? x.c.base : 0)), 'green');
    h += statHTML('טרם שולם', fmtMoney(sum(x => x.row.payDate ? 0 : x.c.base)), 'red');
  } else if (t.kind === 'salaries') {
    h += statHTML('סה״כ נטו', fmtMoney(sum(x => x.row.net)), 'gold');
    h += statHTML('שולם', fmtMoney(sum(x => x.row.status ? x.row.net : 0)), 'green');
    h += statHTML('טרם שולם', fmtMoney(sum(x => x.row.status ? 0 : x.row.net)), 'red');
    h += statHTML('עובדים', new Set(items.map(x => x.row.employeeId).filter(Boolean)).size);
  } else if (t.kind === 'pensions') {
    h += statHTML('סה״כ הפקדות', fmtMoney(sum(x => x.row.amount)), 'gold');
    h += statHTML('שולם (עם תאריך)', fmtMoney(sum(x => x.row.payDate ? x.row.amount : 0)), 'green');
    h += statHTML('ללא תאריך תשלום', fmtMoney(sum(x => x.row.payDate ? 0 : x.row.amount)), 'red');
    const byType = {}; items.forEach(x => { const k = x.row.depType || 'לא סווג'; byType[k] = r2((byType[k] || 0) + nz(x.row.amount)); });
    Object.keys(byType).forEach(k => h += statHTML(k, fmtMoney(byType[k])));
  } else if (t.kind === 'authorities') {
    h += statHTML('סה״כ', fmtMoney(sum(x => x.row.amount)), 'gold');
    h += statHTML('שולם', fmtMoney(sum(x => x.row.payDate ? x.row.amount : 0)), 'green');
    const byType = {}; items.forEach(x => { const k = x.row.authType || 'לא סווג'; byType[k] = r2((byType[k] || 0) + nz(x.row.amount)); });
    Object.keys(byType).forEach(k => h += statHTML(k, fmtMoney(byType[k])));
  } else if (t.kind === 'bank') {
    const inc = sum(x => x.c.income), exp = sum(x => x.c.expense);
    h += statHTML('הכנסות', fmtMoney(inc), 'green');
    h += statHTML('הוצאות', fmtMoney(exp), 'red');

/* =====================================================================
   DocFS – שמירת מסמכים בפועל לתיקייה במחשב (File System Access API)
   הדפדפן אינו רשאי לכתוב לנתיב טקסטואלי כלשהו. המשתמש מחבר פעם אחת
   "תיקיית בסיס" (למשל C:\ATLAS), וכל נתיב מסמכים של חוצץ נפתר ביחס אליה.
   ===================================================================== */
const IDB = {
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('atlas_fs', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); },
  async del(k) { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); }); }
};
const sessionFiles = {}; // docId -> File (לשמירה חוזרת בסשן הנוכחי)

const DocFS = {
  supported: typeof window.showDirectoryPicker === 'function',
  root: null,
  get rootName() { return this.root ? this.root.name : ''; },
  async init() {
    try { const h = await IDB.get('docRoot'); if (h) { this.root = h; return true; } } catch (e) { }
    return false;
  },
  async connect() {
    const h = await window.showDirectoryPicker({ id: 'atlas-docs', mode: 'readwrite' });
    this.root = h;
    try { await IDB.set('docRoot', h); } catch (e) { }
    return h;
  },
  async setRoot(h) { this.root = h; try { await IDB.set('docRoot', h); } catch (e) { } },
  async disconnect() { this.root = null; try { await IDB.del('docRoot'); } catch (e) { } },
  async permission(ask) {
    if (!this.root) return false;
    if (typeof this.root.queryPermission !== 'function') return true;
    let p = await this.root.queryPermission({ mode: 'readwrite' });
    if (p === 'granted') return true;
    if (!ask) return false;
    p = await this.root.requestPermission({ mode: 'readwrite' });
    return p === 'granted';
  },
  /* פירוק נתיב החוצץ לתתי-תיקיות מתחת לתיקיית הבסיס */
  resolve(docPath) {
    const raw = String(docPath || '').trim();
    if (!raw) return { ok: false, error: 'לא הוגדר נתיב שמירת מסמכים לחוצץ' };
    if (!this.root) return { ok: false, error: 'לא חוברה תיקיית מסמכים במחשב' };
    const clean = raw.replace(/^file:\/+/i, '');
    let segs = clean.split(/[\\/]+/).filter(s => s && s !== '.');
    if (segs.some(s => s === '..')) return { ok: false, error: 'הנתיב אינו יכול לכלול ".."' };
    const isAbs = /^[a-zA-Z]:$/.test(segs[0] || '') || /^[\\/]/.test(clean);
    if (isAbs) {
      const rn = this.rootName.toLowerCase();
      let idx = -1;
      segs.forEach((s, i) => { if (s.toLowerCase() === rn) idx = i; });
      if (idx < 0) return { ok: false, error: 'התיקייה שחוברה ("' + this.rootName + '") אינה חלק מהנתיב ' + raw + '. חבר תיקייה שמופיעה בנתיב, למשל "' + (segs[1] || segs[0]) + '".' };
      segs = segs.slice(idx + 1);
    }
    segs = segs.map(s => s.replace(/[<>:"|?*]/g, '_').trim()).filter(Boolean);
    return { ok: true, segs };
  },
  displayTarget(docPath) { const r = this.resolve(docPath); return r.ok ? [this.rootName, ...r.segs].join(' › ') : ''; },
  async dirFor(docPath, create) {
    const r = this.resolve(docPath);
    if (!r.ok) throw new Error(r.error);
    let d = this.root;
    for (const s of r.segs) d = await d.getDirectoryHandle(s, { create });
    return { dir: d, segs: r.segs };
  },
  async exists(dir, name) { try { return await (await dir.getFileHandle(name)).getFile(); } catch (e) { return null; } },
  async save(docPath, file, opts) {
    const { dir, segs } = await this.dirFor(docPath, true);
    let name = file.name.replace(/[\\/<>:"|?*]/g, '_');
    let note = '';
    const ex = await this.exists(dir, name);
    if (ex && opts && opts.overwrite) note = 'הקובץ הקיים עודכן';
    else if (ex) {
      if (ex.size === file.size) return { name, segs, note: 'קובץ זהה כבר קיים בתיקייה – לא נשמר עותק נוסף' };
      const m = name.match(/^(.*?)(\.[^.]*)?$/); const base = m[1], ext = m[2] || '';
      let i = 2; while (await this.exists(dir, base + ' (' + i + ')' + ext)) i++;
      name = base + ' (' + i + ')' + ext;
      note = 'קובץ אחר באותו שם כבר קיים – נשמר בשם ' + name;
    }
    let fh;
    try { fh = await dir.getFileHandle(name, { create: true }); }
    catch (e) {
      // יש מערכות קבצים שדוחות שמות מסוימים – ניסיון חוזר בשם חלופי
      if (!(opts && opts.fallbackName) || opts.fallbackName === name) throw e;
      name = opts.fallbackName; note = 'השם המקורי נדחה על ידי מערכת הקבצים – נשמר בשם ' + name;
      if (await this.exists(dir, name) && !opts.overwrite) throw e;
      fh = await dir.getFileHandle(name, { create: true });
    }
    const w = await fh.createWritable();
    await w.write(file); await w.close();
    const check = await this.exists(dir, name);
    if (!check || check.size !== file.size) throw new Error('אימות הכתיבה נכשל עבור ' + name);
    return { name, segs, note };
  },
  async read(docPath, name) { const { dir } = await this.dirFor(docPath, false); return (await dir.getFileHandle(name)).getFile(); },
  async testWrite() {
    const name = '.atlas_write_test.txt';
    const fh = await this.root.getFileHandle(name, { create: true });
    const w = await fh.createWritable(); await w.write('ok ' + new Date().toISOString()); await w.close();
    const f = await fh.getFile(); const ok = f.size > 0;
    try { await this.root.removeEntry(name); } catch (e) { }
    return ok;
  }
};
function fsErrText(e) {
  if (!e) return '';
  if (e.name === 'AbortError') return 'בחירת התיקייה בוטלה';
  if (e.name === 'NotAllowedError' || e.name === 'SecurityError') return 'הדפדפן לא אישר גישה לתיקייה';
  if (e.name === 'NotFoundError') return 'הקובץ או התיקייה לא נמצאו';
  return e.message || String(e);
}
async function connectDocFolder(silent) {
  if (!DocFS.supported) { toast('שמירה לתיקייה נתמכת רק ב-Chrome או Edge במחשב', 'err', 7000); return false; }
  try {
    await DocFS.connect();
    if (!silent) toast('תיקיית המסמכים חוברה: ' + DocFS.rootName, 'ok');
    render();
    return true;
  } catch (e) { toast(fsErrText(e), 'warn'); return false; }
}
/* שמירת מסמך מקושר לתיקייה (בזמן גרירה או שמירה חוזרת) */
async function saveDocToFolder(t, doc, file) {
  const r = await DocFS.save(t.holder.docPath, file);
  doc.fileName = r.name;
  doc.saved = true;
  doc.savedTo = [DocFS.rootName, ...r.segs].join('\\');
  doc.savedAt = new Date().toISOString();
  delete doc.saveError;
  return r;
}

function pickDateFromText(txt) {
  const re = /(\d{4})-(\d{2})-(\d{2})|(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/g;
  const cands = [];
  let m;
  while ((m = re.exec(txt))) {
    let iso = '';
    if (m[1]) iso = m[1] + '-' + m[2] + '-' + m[3];
    else { let y = m[6]; if (y.length === 2) y = '20' + y; iso = y + '-' + pad2(+m[5]) + '-' + pad2(+m[4]); }
    const yy = +iso.slice(0, 4), mm = +iso.slice(5, 7), dd = +iso.slice(8, 10);
    if (!(yy >= 2015 && yy <= 2100 && mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31)) continue;
    cands.push({ iso, idx: m.index });
  }
  if (!cands.length) return '';
  for (const k of ['תאריך', 'ךיראת']) {          // גם טקסט הפוך, כמו במסמכים עבריים מסוימים
    let i = txt.indexOf(k);
    while (i >= 0) {
      const near = cands.filter(c => c.idx >= i - 8 && c.idx <= i + 70).sort((a, b) => a.idx - b.idx)[0];
      if (near) return near.iso;
      i = txt.indexOf(k, i + 1);
    }
  }
  return cands[0].iso;
}
async function readPdfDate(file) {

      const tc = await (await pdf.getPage(i)).getTextContent();
      txt += ' ' + tc.items.map(x => x.str).join(' ');
    }
    const d = pickDateFromText(txt);
    if (d) return d;
    const meta = await pdf.getMetadata().catch(() => null);
    const cd = meta && meta.info && meta.info.CreationDate;
    const m = cd && String(cd).match(/D:(\d{4})(\d{2})(\d{2})/);

      if (!DocFS.root) await DocFS.connect();
      canSave = await DocFS.permission(true);
      if (!canSave) why = 'לא ניתנה הרשאת כתיבה לתיקייה';
      else { const r = DocFS.resolve(path); if (!r.ok) { canSave = false; why = r.error; } }
    } catch (e) { why = fsErrText(e); }
  }
  let saved = 0; const notes = [];
  for (const p of picks) {
    if (!String(p.row[p.field] || '').trim()) p.row[p.field] = p.number;
    // תאריך המסמך → שדה התאריך המתאים בשורה (רק אם ריק)
    if (p.docDate) {
      const tgt = docDateTarget(t, p.field);
      if (tgt) {
        const cur = rowDateValue(p.row, tgt);
        if (!cur) {
          setRowDate(p.row, tgt, p.docDate);
          notes.push(p.file.name + ': ' + tgt.label + ' עודכן ל-' + fmtDate(p.docDate) + ' לפי תאריך המסמך');
        } else if (cur !== p.docDate && p.override) {
          setRowDate(p.row, tgt, p.docDate);
          notes.push(p.file.name + ': ' + tgt.label + ' נדרס מ-' + fmtDate(cur) + ' ל-' + fmtDate(p.docDate) + ' לפי תאריך המסמך');
        } else if (cur !== p.docDate) {
          notes.push(p.file.name + ': ' + tgt.label + ' נשאר ' + fmtDate(cur) + ' – לא נדרס');
        }
        // ״הוגש״ אחרי מסמך קבלה: ממולא רק אם הוא ריק, כדי שלשורה יהיה תאריך הגשה ולא תיפול בהתראות
        if (tgt.also && !p.row[tgt.also.key]) {
          p.row[tgt.also.key] = p.docDate;
          notes.push(p.file.name + ': ' + tgt.also.label + ' היה ריק ומולא ב-' + fmtDate(p.docDate));
        }
      }
    }
    const old = findDoc(t.tabId, p.row.id, p.field);
    if (old) delete S.docs[old.id];
    const id = uid('doc');
    const doc = S.docs[id] = { id, tabId: t.tabId, rowId: p.row.id, field: p.field, number: String(p.row[p.field]).trim(), fileName: p.file.name, size: p.file.size, linkedAt: new Date().toISOString(), pathAtLink: path, saved: false };
    sessionBlobs[id] = URL.createObjectURL(p.file);
    sessionFiles[id] = p.file;
    if (p.note) notes.push(p.file.name + ': ' + p.note);
    if (canSave) {
      try { const r = await saveDocToFolder(t, doc, p.file); saved++; if (r.note) notes.push(p.file.name + ': ' + r.note); }
      catch (e) { doc.saveError = fsErrText(e); notes.push(p.file.name + ': השמירה נכשלה – ' + doc.saveError); }
    } else doc.saveError = why;
  }
  closeModal(); markDirty(); render();
  if (saved === picks.length) toast(saved + ' מסמכים נשמרו בתיקייה ' + DocFS.displayTarget(path) + ' וקושרו', 'ok', 6000);
  else if (saved) toast(saved + ' מתוך ' + picks.length + ' מסמכים נשמרו. ' + (why || ''), 'warn', 7000);
  else toast(picks.length + ' מסמכים קושרו אך לא נשמרו בתיקייה: ' + why, 'err', 8000);
  notes.forEach(n => toast(n, 'info', 7000));
}

function setField(t, rowId, key, raw, type, isOv) {
  const row = t.rows.find(r => r.id === rowId); if (!row) return;
  row.ov = row.ov || {};
  let val = raw;
  if (type === 'num') {
    if (String(raw).trim() === '') val = null;
    else { val = num(raw); if (val === null) { toast('ערך מספרי לא תקין: ' + raw, 'err'); render(); return; } }
  } else if (type === 'date') {
    const p = parseDateInput(raw);
    if (p === null) { toast('תאריך לא תקין: ' + raw + ' (פורמט dd/mm/yyyy)', 'err'); render(); return; }
    val = p;
  } else if (type === 'year') {
    val = String(raw).trim();
    if (val && !/^\d{4}$/.test(val)) { toast('שנה לא תקינה', 'err'); render(); return; }
  } else if (type === 'employee') {
    if (raw === '__new') { addEmployeeModal(emp => { row.employeeId = emp.id; markDirty(); }); return; }
  } else if (typeof val === 'string') val = val.trim();

  if (t.kind === 'authorities' && key === 'authType') {
    const a = AUTHORITIES.find(x => x.name === String(raw).trim());
    if (a) { row.code = a.code; if (!row.action || row.action === 'pay' || row.action === 'credit') row.action = a.dir; }
  }
  if (t.kind === 'credit' && ['authType', 'amount', 'chargeDate', 'txDate', 'kind', 'merchant', 'cardId'].includes(key)) setTimeout(() => { ccAuthSync(row); render(); }, 0);
  if (t.kind === 'credit' && key === 'authType' && String(raw).trim() && (!row.category || row.category === 'כללי')) row.category = 'רשויות';
  if (t.kind === 'credit' && key === 'cardId' && raw === '__new') { ccCardsModal(); render(); return; }
  if (t.kind === 'bank' && key === 'txType' && raw === '__new') { newBankTypeModal(tp => { row.txType = tp; markDirty(); render(); }); return; }
  if (key === 'offAdd' || key === 'offDed') { if (val !== null) val = Math.abs(val); migrateOffset(row); }
  if ((key === 'supAdd' || key === 'supDed') && val !== null) val = Math.abs(val);
  if (isOv) {
    const c = calcRow(t.kind, row);
    if (val === null || val === '') delete row.ov[key];
    else if (type === 'num' && Math.abs(nz(val) - nz(c.auto[key])) < 0.005) delete row.ov[key];
    else if (type === 'date' && val === c.auto[key]) delete row.ov[key];
    else row.ov[key] = val;
  } else {
    row[key] = val;
  }
  if (row.auto && t.kind === 'bank' && (key === 'expense' || key === 'income')) row.autoEdited = true;
  if (t.kind === 'bank' && (key === 'income' || key === 'expense') && val !== null) {
    // ממלאים רק צד אחד – מילוי צד אחד מנקה את הצד השני
    const other = key === 'income' ? 'expense' : 'income';
    if (Math.abs(nz(val))) { row[key] = Math.abs(val); row[other] = null; }
  }
  if (t.kind === 'bank' && key === 'date' && val && !row.forMonth) row.forMonth = val.slice(0, 7);
  if ((t.kind === 'salaries' || t.kind === 'pensions' || t.kind === 'authorities') && key === 'payDate') delete row.payDateAuto;
  if (t.kind === 'authorities' && key === 'payDate' && val) row.status = true;
  if (t.kind === 'authorities' && ['status', 'payDate', 'dueDate', 'amount', 'method', 'authType', 'authName', 'action', 'year', 'month'].includes(key)) setTimeout(() => { authBankSync(row); render(); }, 0);
  // תשלום לעצמאי: עריכה בחוצץ האדם מעדכנת את שורת הבנק, ועריכה בבנק מעדכנת את שורת האדם.
  // הסנכרון רץ מיד (ולא ב-setTimeout) כדי שהמצב יהיה עקבי כבר ברינדור שבסוף הפונקציה.
  if (t.kind === 'freelancer' && ['amount', 'payDate', 'year', 'month', 'projectName', 'taxReceiptNo'].includes(key)) freeBankSync(row, t.entity);
  if (t.kind === 'bank' && ['txType', 'party', 'income', 'expense', 'date', 'forMonth', 'docNo'].includes(key) && ((row.txType || '') === FREE_TX_TYPE || row.freeRowId)) bankFreeSync(row);
  if (t.kind === 'bank' && row.authRowId) {
    const a = S.ops.authorities.rows.find(x => x.id === row.authRowId);
    if (a) {
      if (key === 'income' || key === 'expense') { a.amount = Math.abs(nz(val)); if (key === 'income') a.action = 'credit'; if (key === 'expense') a.action = 'pay'; }
      if (key === 'date' && val) { a.payDate = val; a.status = true; }
      setTimeout(() => { authBankSync(a); render(); }, 0);
    }
  }
  if (key === 'term' && val !== 'manual') delete row.expectedManual;
  if (UI.editing === rowId + ':' + key) UI.editing = null;
  markDirty();
  render();
}

// הפונט בתלושי שיקלולית מקודד עברית בתווי MacRoman והטקסט שמור הפוך
const PS_GLYPH = { '∑': 'א', '∏': 'ב', 'π': 'ג', '\u009b': 'ג', '∫': 'ד', 'ª': 'ה', 'º': 'ו', 'Ω': 'ז', 'æ': 'ח', 'ø': 'ט', '¿': 'י', '¡': 'ך', '¬': 'כ', '√': 'ל', 'ƒ': 'ם', '≈': 'מ', '∆': 'ן', '«': 'נ', '»': 'ס', '…': 'ע', 'À': 'ף', 'Ã': 'פ', 'Õ': 'ץ', 'Œ': 'צ', 'œ': 'ק', '–': 'ר', '—': 'ש', '“': 'ת' };
function psDecode(s) {
