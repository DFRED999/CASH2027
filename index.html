  if (!obj) return;
  if (id === 'meta') {
    S.settings = obj.settings || S.settings;
    S.entityOrder = obj.entityOrder || [];
    S.employees = obj.employees || [];
    S.anomalies = obj.anomalies || {};
    if (obj.createdAt) S.createdAt = obj.createdAt;
  } else if (id === 'docs') S.docs = obj || {};
  else if (id.indexOf('ops~') === 0) S.ops[id.slice(4)] = obj;
  else if (id.indexOf('ent~') === 0) S.entities[id.slice(4)] = obj;
}
function syncDropUnit(id) {
  if (id.indexOf('ent~') === 0) { const k = id.slice(4); delete S.entities[k]; S.entityOrder = S.entityOrder.filter(x => x !== k); }
}
function syncPack(obj) {
  const s = JSON.stringify(obj === undefined ? null : obj);
  const parts = [];
  for (let i = 0; i < s.length; i += SYNC_CHUNK) parts.push(s.slice(i, i + SYNC_CHUNK));
  return parts.length ? parts : [''];
}
function syncUnpack(d) {
  try { return JSON.parse((d && d.p ? d.p : ['null']).join('')); } catch (e) { return null; }
}
function syncStateEmpty() {
  return !S.entityOrder.length && !S.employees.length && Object.values(S.ops).every(o => !(o.rows || []).length);
}
function syncFingerprint(pairs) {
  return hashStr(pairs.sort((a, b) => a[0].localeCompare(b[0])).map(([id, hash]) => id + ':' + hash).join('|'));
}
function syncLocalFingerprint() {
  const units = syncUnits();
  return syncFingerprint(Object.keys(units).map(id => [id, hashStr(JSON.stringify(units[id]))]));
}
function syncCloudFingerprint(snap) {
  const pairs = [];
  snap.forEach(d => { pairs.push([d.key, hashStr((((d.val() || {}).p) || []).join(''))]); });
  return syncFingerprint(pairs);
}
function syncSentFingerprint() {
  return syncFingerprint(Object.keys(Sync.sent).map(id => [id, Sync.sent[id]]));
}
function syncScope() {
  return Sync.cfg.projectId + '|' + syncMode() + '|' + (syncMode() === 'open' ? syncSpace() : Sync.user.uid);
}
function syncBaselineLoad() {
  try {
    const base = JSON.parse(localStorage.getItem(SYNC_BASE_KEY) || 'null');
    return base && base.scope === syncScope() ? base : null;
  } catch (e) { return null; }
}
function syncBaselineSave() {
  try {
    localStorage.setItem(SYNC_BASE_KEY, JSON.stringify({
      scope: syncScope(), local: syncLocalFingerprint(), cloud: syncSentFingerprint()
    }));
  } catch (e) { }
}
function syncFirstChoice(cloudEmpty, localEmpty, localHash, cloudHash, base) {
  if (cloudEmpty) return 'push';
  if (localEmpty) return 'pull';
  if (localHash === cloudHash || (base && base.local === localHash && base.cloud === cloudHash)) return 'same';
  if (base && base.local === localHash) return 'pull';
  if (base && base.cloud === cloudHash) return 'push';
  return 'ask';
}
function syncRememberSnap(snap) {
  Sync.sent = {}; Sync.rev = {};
  snap.forEach(d => {
    const data = d.val() || {};
    Sync.sent[d.key] = hashStr((data.p || []).join(''));
    Sync.rev[d.key] = data.rev || 0;
  });
}

/* ---------- טעינת ה-SDK ---------- */
function syncLoadScript(src) {
  return new Promise((res, rej) => {
    if ($('script[data-sdk="' + src + '"]')) return res();
    const s = document.createElement('script');
    s.src = SYNC_SDK_BASE + src; s.dataset.sdk = src;
    s.onload = () => res(); s.onerror = () => rej(new Error('טעינת ' + src + ' נכשלה'));
    document.head.appendChild(s);
  });
}
async function syncLoadSdk() {
  if (window.__atlasFakeFirebase) { window.firebase = window.__atlasFakeFirebase; return; }
  if (window.firebase && window.firebase.database) return;
  await syncLoadScript('firebase-app-compat.js');
  if (syncMode() === 'auth') await syncLoadScript('firebase-auth-compat.js');
  await syncLoadScript('firebase-database-compat.js');
}

function syncSetState(state, err) {
  Sync.state = state; Sync.err = err || '';
  const el = $('#syncState');
  if (el) {
    const map = { off: ['', ''], connecting: ['☁ מתחבר…', 'sync-wait'], signin: ['☁ נדרשת התחברות', 'sync-wait'], on: ['☁ מסונכרן', 'sync-ok'], push: ['☁ שומר…', 'sync-wait'], err: ['☁ שגיאה', 'sync-err'] };
    const [txt, cls] = map[state] || ['', ''];
    el.textContent = txt; el.className = cls + (txt ? '' : ' hidden');
    el.title = err || (Sync.user ? 'מחובר: ' + Sync.user.email : '');
  }
  if (UI.view === 'settings') renderSettings($('#view'));
}

/* ---------- חיבור ---------- */
async function syncConnect() {
  if (!syncCfgLoad()) { syncSetState('off'); return false; }
  syncSetState('connecting');
  try {
    await syncLoadSdk();
    if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(Sync.cfg);
    Sync.db = firebase.database();
    if (syncMode() === 'open') {
      Sync.auth = null;
      Sync.user = { uid: syncSpace(), email: 'ללא התחברות' };
      syncStart().catch(e => syncSetState('err', e.message));
      return true;
    }
    Sync.auth = firebase.auth();
    Sync.auth.onAuthStateChanged(u => {
      Sync.user = u || null;
      if (u) syncStart().catch(e => syncSetState('err', e.message));
      else { syncStop(); syncSetState('signin'); }
    });
    return true;
  } catch (e) { syncSetState('err', e.message); return false; }
}
async function syncSignIn(email, pw, createIfMissing) {
  if (!Sync.auth) { const ok = await syncConnect(); if (!ok) return false; }
  try {
    await Sync.auth.signInWithEmailAndPassword(email, pw);
    return true;
  } catch (e) {
    if (createIfMissing && /user-not-found|invalid-login|INVALID_LOGIN/i.test(e.code + ' ' + e.message)) {
      try { await Sync.auth.createUserWithEmailAndPassword(email, pw); return true; } catch (e2) { syncSetState('err', e2.message); toast('יצירת המשתמש נכשלה: ' + e2.message, 'err', 7000); return false; }
    }
    syncSetState('err', e.message); toast('ההתחברות נכשלה: ' + e.message, 'err', 7000); return false;
  }
}
async function syncSignOut() {
  syncStop();
  if (syncMode() === 'open') { Sync.user = null; Sync.sent = {}; Sync.rev = {}; syncSetState('off'); return; }
  if (Sync.auth) { try { await Sync.auth.signOut(); } catch (e) { } }
  Sync.user = null; Sync.sent = {}; Sync.rev = {};
  syncSetState(Sync.cfg ? 'signin' : 'off');
}
function syncCol() { return Sync.db.ref('atlas/' + (syncMode() === 'open' ? syncSpace() : Sync.user.uid) + '/state'); }
function syncStop() {
  if (Sync.unsub) { try { Sync.unsub(); } catch (e) { } Sync.unsub = null; }
  Sync.on = false;
}

/* ---------- סנכרון ראשון: החלטה לאיזה כיוון ---------- */
async function syncStart() {
  if (!Sync.db || !Sync.user) return;
  syncSetState('connecting');
  const col = syncCol();
  const snap = await col.once('value');
  const cloudEmpty = !snap.exists();
  const localEmpty = syncStateEmpty();
  const choice = syncFirstChoice(cloudEmpty, localEmpty, syncLocalFingerprint(), syncCloudFingerprint(snap), syncBaselineLoad());
  if (choice === 'same') { syncRememberSnap(snap); Sync.on = true; }
  else if (choice === 'push') { syncRememberSnap(snap); Sync.on = true; await syncPushNow(true); }
  else if (choice === 'pull') { syncPullSnap(snap); Sync.on = true; }
  else {
    let cloudRows = 0;
    snap.forEach(d => { cloudRows += (((d.val() || {}).p || []).join('').match(/"id":"r_/g) || []).length; });
    const localRows = Object.values(S.entities).reduce((a, e) => a + e.rows.length, 0) + Object.values(S.ops).reduce((a, o) => a + (o.rows || []).length, 0);
    const done = await new Promise(res => {
      openModal({
        title: 'בחירת גרסה – הנתונים שונים במכשיר ובענן',
        body: '<p>נמצאו שינויים שלא ניתן ליישב אוטומטית. יש לבחור מה הגרסה הנכונה – הצד השני יידרס.</p>' +
          '<table class="simple"><tr><th></th><th>שורות</th></tr><tr><td>המכשיר הזה</td><td class="num">' + localRows + '</td></tr><tr><td>הענן</td><td class="num">≈' + cloudRows + '</td></tr></table>' +
          '<p class="muted" style="font-size:12px">לפני דריסה יורד אוטומטית גיבוי JSON של המצב הנוכחי במכשיר.</p>',
        buttons: [
          { label: '⬆ העלאת המכשיר לענן', cls: 'primary', onClick: () => { res('push'); } },
          { label: '⬇ הורדה מהענן למכשיר', onClick: () => { res('pull'); } },
          { label: 'ביטול', onClick: () => { res('cancel'); } }
        ]
      });
    });
    if (done === 'cancel') { syncSetState('signin', 'הסנכרון לא הופעל'); return; }
    doBackup();
    if (done === 'push') {
      syncRememberSnap(snap);
      Sync.on = true;
      await syncPushNow(true);
    }
    else { syncPullSnap(snap); Sync.on = true; }
  }
  const onError = e => syncSetState('err', e.message);
  const onAdd = d => syncOnChild('added', d);
  const onChange = d => syncOnChild('changed', d);
  const onRemove = d => syncOnChild('removed', d);
  col.on('child_added', onAdd, onError);
  col.on('child_changed', onChange, onError);
  col.on('child_removed', onRemove, onError);
  Sync.unsub = () => {
    col.off('child_added', onAdd);
    col.off('child_changed', onChange);
    col.off('child_removed', onRemove);
  };
  Sync.last = new Date();
  syncBaselineSave();
  syncSetState('on');
}
function syncPullSnap(snap) {
  Sync.busy = true;
  S = defaultState();
  snap.forEach(d => {
    const id = d.key, data = d.val() || {};
    syncApplyUnit(id, syncUnpack(data));
    Sync.rev[id] = data.rev || 0;
    Sync.sent[id] = hashStr((data.p || []).join(''));
  });
  S = normalizeState(S);
  Sync.busy = false;
  saveNow(true);
  render();
}
function syncOnChild(type, snap) {
  if (!Sync.on) return;
  const id = snap.key, d = snap.val() || {};
  if (type === 'removed') {
    syncDropUnit(id); delete Sync.rev[id]; delete Sync.sent[id];
  } else {
    if (d.by === syncDeviceId()) { Sync.rev[id] = d.rev; Sync.sent[id] = hashStr((d.p || []).join('')); return; }
    if (Sync.rev[id] && d.rev <= Sync.rev[id]) return;
    syncApplyUnit(id, syncUnpack(d));
    Sync.rev[id] = d.rev;
    Sync.sent[id] = hashStr((d.p || []).join(''));
  }
  S = normalizeState(S);
  Sync.busy = true;
  saveNow(true);
  Sync.busy = false;
  Sync.last = new Date();
  render();
  syncBaselineSave();
  toast('התקבל עדכון ממכשיר אחר', 'ok');
}

/* ---------- שליחה ---------- */
function syncSchedulePush() {
  if (!Sync.on || Sync.busy) return;
  clearTimeout(Sync.pushTimer);
  Sync.pushTimer = setTimeout(() => { syncPushNow().catch(e => syncSetState('err', e.message)); }, 900);
}
async function syncPushNow(all) {
  if (!Sync.on || !Sync.db || !Sync.user) return;
  const col = syncCol();
  const units = syncUnits();
  const put = [];
  for (const id of Object.keys(units)) {
    const parts = syncPack(units[id]);
    const h = hashStr(parts.join(''));
    if (!all && Sync.sent[id] === h) continue;
    put.push({ id, parts, h });
  }
  const gone = Object.keys(Sync.sent).filter(id => !(id in units));
  if (!put.length && !gone.length) return;
  syncSetState('push');
  try {
    for (const it of put) {
      const rev = Date.now();
      await col.child(it.id).set({ p: it.parts, rev, by: syncDeviceId() });
      Sync.sent[it.id] = it.h; Sync.rev[it.id] = rev;
    }
    for (const id of gone) { await col.child(id).remove(); delete Sync.sent[id]; delete Sync.rev[id]; }
    Sync.last = new Date();
    syncBaselineSave();
    syncSetState('on');
  } catch (e) { syncSetState('err', e.message); throw e; }
}

function syncAction(act, el) {
  switch (act) {

      if (!/^[A-Za-z0-9_-]{3,60}$/.test(sp)) { toast('מזהה המרחב חייב להיות 3-60 תווים באנגלית, ספרות, מקף או קו תחתון', 'err', 6000); return true; }

      syncCfgSave(cfg);

      syncConnect().then(() => render());
      return true;
    }
    case 'synccfgdel':
      confirmModal('מחיקת הגדרות הסנכרון', 'הנתונים בענן לא יימחקו – רק החיבור מהמכשיר הזה. להמשיך?', 'מחיקה', () => {

      }, true);

    case 'syncin': case 'syncnew': {
      const email = ($('#syncEmail') || {}).value, pw = ($('#syncPw') || {}).value;
      if (!email || !pw) { toast('יש להזין אימייל וסיסמה', 'err'); return true; }
      if (pw.length < 6) { toast('הסיסמה חייבת להיות באורך 6 תווים לפחות', 'err'); return true; }
      syncSignIn(email.trim(), pw, act === 'syncnew').then(okv => { if (okv) toast('מחובר – מסנכרן…', 'ok'); render(); });
      return true;

    case 'syncout': syncSignOut().then(() => render()); return true;

  }
  return false;
}

function alertSnooze() { return S.settings.alertSnooze || (S.settings.alertSnooze = {}); }
function alertState() { return UI.alerts || (UI.alerts = { cat: '', sev: '', showSnoozed: false }); }
function daysBetween(a, b) { return Math.round((new Date(b) - new Date(a)) / 86400000); }

function buildAlerts() {
  const out = [], today = todayISO();
  const add = o => out.push(o);

  /* ---- פרויקטים: גבייה, ספקים ומסמכים ---- */
  for (const id of S.entityOrder) {
    const t = tabInfo(id); if (!t || !PROJECT_TYPES.includes(t.kind)) continue;
    const who = t.name + (t.entity.client ? ' · ' + t.entity.client : '');

    /* הזמנות עבודה: סיום תוקף מתקרב / פג, וניצול התקרה */
    for (const o of entityOrders(t.entity)) {
      const s = orderStatus(t.entity, o);
      const oref = { tabId: id, tabName: t.name };
      const nm = 'הזמנה ' + (o.no || '(ללא מספר)');
      if (s.expired) {
        add(Object.assign({ key: id + '|' + o.id + '|ordexp', sev: 'err', cat: 'docs', date: o.until, days: Math.abs(s.daysLeft),
          title: 'פג תוקף הזמנת עבודה', detail: who + ' · ' + nm + ' · התוקף הסתיים ב-' + fmtDate(o.until) + ' (לפני ' + Math.abs(s.daysLeft) + ' ימים)' }, oref));
      } else if (s.expiring) {
        add(Object.assign({ key: id + '|' + o.id + '|ordsoon', sev: s.daysLeft <= Math.round(s.lead / 2) ? 'err' : 'warn', cat: 'docs', date: o.until, days: s.daysLeft,
          title: 'הזמנת עבודה עומדת להסתיים · ' + s.daysLeft + ' ימים', detail: who + ' · ' + nm + ' · בתוקף עד ' + fmtDate(o.until) + ' – יש לחדש' }, oref));
      }
      if (s.overCeiling) {
        add(Object.assign({ key: id + '|' + o.id + '|ordover', sev: 'err', cat: 'docs', date: '', amount: s.used,
          title: 'חריגה מתקרת ההזמנה', detail: who + ' · ' + nm + ' · נוצל ' + fmtMoney(s.used) + ' מתוך ' + fmtMoney(s.ceiling) + ' ₪ ללא מע״מ · חריגה ' + fmtMoney(Math.abs(s.left)) + ' ₪' }, oref));
      } else if (s.nearCeiling) {
        add(Object.assign({ key: id + '|' + o.id + '|ordnear', sev: 'warn', cat: 'docs', date: '', amount: s.used,
          title: 'תקרת ההזמנה כמעט נוצלה · ' + s.pct + '%', detail: who + ' · ' + nm + ' · נותרו ' + fmtMoney(s.left) + ' ₪ ללא מע״מ מתוך ' + fmtMoney(s.ceiling) }, oref));
      }
    }

    for (const row of t.rows) {
      const c = calcRow(t.kind, row);
      const per = (row.month || '') + '/' + (row.year || '');
      const ref = { tabId: id, rowId: row.id, tabName: t.name, serial: row.serial, amount: c.base };
      const hasAmount = !!nz(c.total);
      if (!hasAmount) continue;

      if (c.moneyDate && !row.submitted) { /* הכסף כבר התקבל – אין מה לרדוף אחרי תאריך ההגשה */ }
      else if (!row.submitted) {
        add(Object.assign({ key: id + '|' + row.id + '|nosubmit', sev: 'warn', cat: 'money', date: '',
          title: 'טרם הוגשה חשבונית', detail: who + ' · חודש ' + per + ' · ' + fmtMoney(c.total) + ' ₪ ללא תאריך הגשה – לא נוצר צפי תשלום' }, ref));
      } else if (!c.expectedDate) {
        add(Object.assign({ key: id + '|' + row.id + '|noterm', sev: 'warn', cat: 'money', date: row.submitted,
          title: 'חסר צפי לתשלום', detail: who + ' · חודש ' + per + ' · הוגש ' + fmtDate(row.submitted) + ' ללא תנאי תשלום – השורה לא נכנסת לתזרים' }, ref));
      } else if (!c.moneyDate && c.expectedDate < today) {
        const d = daysBetween(c.expectedDate, today);
        add(Object.assign({ key: id + '|' + row.id + '|late', sev: d > 30 ? 'err' : 'warn', cat: 'money', date: c.expectedDate, days: d,
          title: 'איחור בתשלום מהלקוח · ' + d + ' ימים', detail: who + ' · חודש ' + per + ' · ' + fmtMoney(c.base) + ' ₪ · צפי היה ' + fmtDate(c.expectedDate) }, ref));
      }
      if (c.supplierOn && c.supplierPay) {
        if (c.moneyDate && !row.supplierPaid) {
          const d = daysBetween(c.moneyDate, today);
          add(Object.assign({ key: id + '|' + row.id + '|supdue', sev: d > 14 ? 'err' : 'warn', cat: 'supplier', date: c.moneyDate, days: d,
            title: 'הכסף התקבל וטרם שולם לספק' + (d > 0 ? ' · ' + d + ' ימים' : ''), detail: who + ' · חודש ' + per + ' · ' + fmtMoney(c.supplierPay) + ' ₪ לספק · התקבל ' + fmtDate(c.moneyDate), amount: c.supplierPay }, ref));
        }
        const sd = String(row.supplierDocNo || '').trim();
        if (row.supplierPaid && (!sd || sd === '0')) {
          add(Object.assign({ key: id + '|' + row.id + '|supdoc', sev: 'err', cat: 'docs', date: c.supplierPayDate || '',
            title: 'חסרה חשבונית מס קבלה מהספק', detail: who + ' · חודש ' + per + ' · שולמו ' + fmtMoney(c.supplierPay) + ' ₪ ללא מסמך ספק', amount: c.supplierPay }, ref));
        }
        if (num(row.supplierPct) === null) {
          add(Object.assign({ key: id + '|' + row.id + '|nopct', sev: 'warn', cat: 'supplier', date: '',
            title: 'שורה עם ספק ללא אחוז גבייה', detail: who + ' · חודש ' + per }, ref));
        }
      }
      if (c.moneyDate && !String(row.taxReceiptNo || '').trim() && !String(row.receiptNo || '').trim()) {
        add(Object.assign({ key: id + '|' + row.id + '|norcpt', sev: 'warn', cat: 'docs', date: c.moneyDate,
          title: 'התקבל כסף ללא ח. מס קבלה', detail: who + ' · חודש ' + per + ' · ' + fmtMoney(c.base) + ' ₪' }, ref));
      }
    }
  }

  /* ---- שכר ופנסיות ---- */
  const opsRef = (k, row, extra) => Object.assign({ tabId: 'ops:' + k, rowId: row.id, tabName: OPS[k], serial: row.serial }, extra || {});
  for (const row of S.ops.salaries.rows) {
    if (row.status && !row.payDate) add(Object.assign({ key: 'sal|' + row.id + '|nodate', sev: 'err', cat: 'ops', date: '', amount: nz(row.net),
      title: 'משכורת מסומנת ״שולם״ ללא תאריך תשלום', detail: employeeName(row.employeeId) + ' · ' + (row.month || '') + '/' + (row.year || '') + ' · ' + fmtMoney(row.net) + ' ₪ – לא נכנסת לתזרים' }, opsRef('salaries', row)));
    else if (!row.status && row.payDate && row.payDate < today) add(Object.assign({ key: 'sal|' + row.id + '|notpaid', sev: 'warn', cat: 'ops', date: row.payDate, amount: nz(row.net),
      title: 'משכורת עם תאריך תשלום שעבר ועדיין ״טרם שולם״', detail: employeeName(row.employeeId) + ' · ' + (row.month || '') + '/' + (row.year || '') + ' · ' + fmtMoney(row.net) + ' ₪' }, opsRef('salaries', row)));
  }
  for (const row of S.ops.pensions.rows) {
    const c = calcRow('pensions', row);
    if (row.status && !row.payDate) add(Object.assign({ key: 'pen|' + row.id + '|nodate', sev: 'err', cat: 'ops', date: '', amount: c.total,
      title: 'הפקדה לקופה מסומנת ״שולם״ ללא תאריך', detail: employeeName(row.employeeId) + ' · ' + (row.fundName || '') + ' · ' + fmtMoney(c.total) + ' ₪' }, opsRef('pensions', row)));
    else if (!row.status && c.total && row.year && row.month && (row.year + '-' + row.month) < monthAdd(curMonth(), -1)) {
      add(Object.assign({ key: 'pen|' + row.id + '|old', sev: 'warn', cat: 'ops', date: '', amount: c.total,
        title: 'הפקדה ישנה שטרם שולמה', detail: employeeName(row.employeeId) + ' · ' + (row.fundName || '') + ' · חודש ' + row.month + '/' + row.year + ' · ' + fmtMoney(c.total) + ' ₪' }, opsRef('pensions', row)));
    }
  }

  /* ---- רשויות ---- */
  for (const row of S.ops.authorities.rows) {
    const c = calcRow('authorities', row);
    if (!row.status && !c.isCredit && row.dueDate && row.dueDate < today && !c.viaCredit) {
      const d = daysBetween(row.dueDate, today);
      add(Object.assign({ key: 'auth|' + row.id + '|late', sev: d > 7 ? 'err' : 'warn', cat: 'ops', date: row.dueDate, days: d, amount: c.amount,
        title: 'תשלום לרשות עבר את תאריך היעד · ' + d + ' ימים', detail: c.authName + ' · ' + fmtMoney(c.amount) + ' ₪ · יעד ' + fmtDate(row.dueDate) }, opsRef('authorities', row)));
    }
    if (!row.creditRowId && row.method === 'כרטיס אשראי' && row.status) {
      add(Object.assign({ key: 'auth|' + row.id + '|dbl', sev: 'err', cat: 'ops', date: row.payDate || row.dueDate, amount: c.amount,
        title: 'סיכון לכפילות בתזרים', detail: c.authName + ' · ' + fmtMoney(c.amount) + ' ₪ סומן כשולם בכרטיס אך לא שויך לעסקה בחוצץ האשראי', act: 'ccauthmatch' }, opsRef('authorities', row)));
    }
    if (row.creditRowId && num(row.expectedAmount) !== null) {
      const d = r2(c.amount - nz(row.expectedAmount));
      add(Object.assign({ key: 'auth|' + row.id + '|gap', sev: 'warn', cat: 'ops', date: row.payDate, amount: c.amount,
        title: 'הרשות חויבה בסכום שונה מהצפי', detail: c.authName + ' · צפי ' + fmtMoney(nz(row.expectedAmount)) + ' · בפועל ' + fmtMoney(c.amount) + ' · פער ' + (d > 0 ? '+' : '') + fmtMoney(d) + ' ₪' }, opsRef('authorities', row)));
    }
  }
  const waiting = authAwaitingCredit().length;
  if (waiting) add({ key: 'auth|awaiting', sev: 'warn', cat: 'ops', date: '', title: waiting + ' תשלומי רשויות ממתינים לשיוך לחיוב אשראי',
    detail: 'הם מוצגים בתזרים כתנועה צפויה בנוסף לחיוב הכרטיס – עד לשיוך עלולה להיווצר כפילות', tabId: 'ops:authorities', act: 'ccauthmatch' });

  /* ---- אשראי ---- */
  const ccGroups = {};
  for (const row of S.ops.credit.rows) {
    const c = calcRow('credit', row);
    if (!c.chargeDate) { add({ key: 'cc|' + row.id + '|nodate', sev: 'warn', cat: 'ops', date: row.txDate || '', amount: c.amount, tabId: 'ops:credit', rowId: row.id, tabName: 'אשראי', serial: row.serial, title: 'עסקת אשראי ללא תאריך חיוב', detail: (row.merchant || '') + ' · ' + fmtMoney(c.amount) + ' ₪' }); continue; }
    if (!row.cardId) add({ key: 'cc|' + row.id + '|nocard', sev: 'info', cat: 'ops', date: c.chargeDate, amount: c.amount, tabId: 'ops:credit', rowId: row.id, tabName: 'אשראי', serial: row.serial, title: 'עסקת אשראי ללא שיוך לכרטיס', detail: (row.merchant || '') + ' · ' + fmtMoney(c.amount) + ' ₪' });
    const g = ccGroupKey(row);
    (ccGroups[g] = ccGroups[g] || { date: c.chargeDate, cardId: row.cardId, amount: 0, n: 0 }).amount += c.signed;
    ccGroups[g].n++;
  }
  const unrecon = [];
  for (const g of Object.keys(ccGroups)) {
    const x = ccGroups[g], rec = ccReconOf(g);
    if (x.date > today || !r2(x.amount)) continue;
    if (!rec && daysBetween(x.date, today) > 5) {
      // ריכוז לשורה אחת – לא התראה לכל חיוב
      unrecon.push(x);
    } else if (rec && Math.abs(r2(nz(rec.bankAmount) - r2(x.amount))) >= 0.01) {
      add({ key: 'cc|' + g + '|gap', sev: 'warn', cat: 'ops', date: x.date, tabId: 'ops:credit',
        title: 'פער בין חיוב האשראי לבנק', detail: ccCardName(x.cardId) + ' · לפי האשראי ' + fmtMoney(r2(x.amount)) + ' · בבנק ' + fmtMoney(nz(rec.bankAmount)) + ' ₪' });
    }
  }

  if (unrecon.length) {
    const recent = unrecon.filter(x => daysBetween(x.date, today) <= 120);
    const sum = r2(recent.reduce((a, x) => a + Math.abs(r2(x.amount)), 0));
    const last = recent.sort((a, b) => b.date.localeCompare(a.date))[0];
    if (recent.length) add({ key: 'cc|recon-all', sev: 'info', cat: 'ops', date: last ? last.date : '', amount: sum, tabId: 'ops:credit',
      title: recent.length + ' חיובי אשראי טרם הותאמו לבנק', detail: 'ב-4 החודשים האחרונים · סה״כ ' + fmtMoney(sum) + ' ₪' + (unrecon.length > recent.length ? ' · ועוד ' + (unrecon.length - recent.length) + ' ישנים יותר' : '') });
  }

  /* ---- בנק ---- */
  for (const row of S.ops.bank.rows) {
    const inc = Math.abs(nz(row.income)), exp = Math.abs(nz(row.expense));
    if (inc && exp) add({ key: 'bank|' + row.id + '|both', sev: 'err', cat: 'ops', date: row.date || '', tabId: 'ops:bank', rowId: row.id, tabName: 'בנק', serial: row.serial,
      title: 'שורת בנק עם הכנסה והוצאה יחד', detail: (row.description || row.txType || '') + ' · יש למלא צד אחד בלבד' });
    else if ((inc || exp) && !row.date) add({ key: 'bank|' + row.id + '|nodate', sev: 'warn', cat: 'ops', date: '', amount: inc || exp, tabId: 'ops:bank', rowId: row.id, tabName: 'בנק', serial: row.serial,
      title: 'תנועת בנק ללא תאריך', detail: (row.description || row.txType || '') + ' · ' + fmtMoney(inc || exp) + ' ₪ – לא נכנסת לתזרים' });
  }

  /* ---- תזרים: מתי היתרה הצפויה יורדת מתחת לאפס ---- */
  const cf = cashflowWithBalance(true);
  const fut = cf.filter(r => r.date >= today);
  const neg = fut.find(r => r.balance < 0);
  if (neg) {
    const d = daysBetween(today, neg.date);
    add({ key: 'cash|neg', sev: d <= 30 ? 'err' : 'warn', cat: 'cash', date: neg.date, amount: Math.abs(neg.balance),
      title: 'היתרה הצפויה יורדת מתחת לאפס ב-' + fmtDate(neg.date), detail: 'יתרה צפויה ' + fmtMoney(neg.balance) + ' ₪ · בעוד ' + d + ' ימים · לפי ' + neg.tabName + ' – ' + neg.role, tabId: 'main' });
  }
  const bal = actualBalanceToday();
  if (bal < 0) add({ key: 'cash|negnow', sev: 'err', cat: 'cash', date: today, amount: Math.abs(bal),
    title: 'יתרת העו״ש בפועל שלילית', detail: 'יתרה נוכחית ' + fmtMoney(bal) + ' ₪', tabId: 'main' });
  const in30 = cf.filter(r => r.date >= today && r.date <= addDays(today, 30));
  const due30 = r2(in30.reduce((a, r) => a + (r.dir === 'out' ? r.amount : 0), 0));
  const get30 = r2(in30.reduce((a, r) => a + (r.dir === 'in' ? r.amount : 0), 0));
  if (due30 > get30 && due30) add({ key: 'cash|month', sev: 'info', cat: 'cash', date: addDays(today, 30), amount: r2(due30 - get30),
    title: 'ב-30 הימים הקרובים ההוצאות גדולות מההכנסות', detail: 'צפי הוצאות ' + fmtMoney(due30) + ' ₪ מול הכנסות ' + fmtMoney(get30) + ' ₪ · פער ' + fmtMoney(r2(due30 - get30)) + ' ₪', tabId: 'main' });

  /* ---- אנומליות ---- */
  for (const a of detectAnomalies().filter(x => x.status === 'pending')) {
    add({ key: 'an|' + a.key, sev: 'warn', cat: 'docs', date: '', amount: Math.abs(a.diff), tabId: a.tabId, rowId: a.rowId, tabName: a.tabName, serial: a.serial,
      title: 'ערך שנדרס ידנית ואינו תואם לחישוב', detail: a.tabName + ' · שורה ' + a.serial + ' · ' + a.label + ' · קיים ' + fmtMoney(a.existing) + ' מול מחושב ' + fmtMoney(a.computed) });
  }

  out.sort((a, b) => SEV_ORDER[a.sev] - SEV_ORDER[b.sev] || (b.days || 0) - (a.days || 0) || String(a.date).localeCompare(String(b.date)));
  const sn = alertSnooze();
  out.forEach(a => { a.snoozed = !!(sn[a.key] && sn[a.key] > todayISO()); a.snoozeUntil = sn[a.key] || ''; });
  return out;
}
function alertCount() { const l = buildAlerts().filter(a => !a.snoozed && a.sev !== 'info'); return l.length; }

/* ---------------- תצוגה ---------------- */
function renderAlerts(v) {
  const st = alertState();
  const all = buildAlerts();
  const live = all.filter(a => !a.snoozed);
  const snoozed = all.filter(a => a.snoozed);
  const shown = (st.showSnoozed ? snoozed : live).filter(a => (!st.cat || a.cat === st.cat) && (!st.sev || a.sev === st.sev));
  const n = s => live.filter(a => a.sev === s).length;

  let h = '<div class="crumb"><h2>🔔 מרכז התראות</h2><span class="meta">נגזר אוטומטית מכל החוצצים · מה שדורש טיפול מופיע כאן במקום אחד</span></div>';
  h += '<div class="stats">' +
    statHTML('דחוף', n('err'), n('err') ? 'red' : '') +
    statHTML('לטיפול', n('warn'), n('warn') ? 'gold' : '') +
    statHTML('לידיעה', n('info')) +
    statHTML('נדחו להמשך', snoozed.length) + '</div>';

  h += '<div class="cc-bar"><div class="seg sal-seg" style="display:inline-flex;border:1px solid var(--navy);border-radius:9px;overflow:hidden">' +
    [['', 'הכל'], ['err', 'דחוף'], ['warn', 'לטיפול'], ['info', 'לידיעה']].map(([k, l]) => '<button class="' + (st.sev === k ? 'on' : '') + '" data-act="alsev" data-k="' + k + '" style="border:0;background:' + (st.sev === k ? 'var(--navy)' : '#fff') + ';color:' + (st.sev === k ? '#fff' : 'var(--navy)') + ';padding:7px 14px">' + l + '</button>').join('') + '</div>' +
    '<label class="pl">נושא <select id="alCatSel"><option value="">כל הנושאים</option>' +
    Object.keys(ALERT_CATS).map(k => '<option value="' + k + '"' + (st.cat === k ? ' selected' : '') + '>' + esc(ALERT_CATS[k]) + ' (' + live.filter(a => a.cat === k).length + ')</option>').join('') + '</select></label>' +
    '<span class="grow"></span>' +
    (snoozed.length ? '<button class="btn sm" data-act="alsnoozed">' + (st.showSnoozed ? '↩ חזרה להתראות פעילות' : '🕓 התראות שנדחו (' + snoozed.length + ')') + '</button>' : '') +
    '</div>';

  if (!shown.length) {
    h += '<div class="empty-state"><b>' + (st.showSnoozed ? 'אין התראות דחויות' : live.length ? 'אין התראות בסינון הנוכחי' : 'הכול מסודר – אין התראות פתוחות') + '</b>' +
      (live.length ? 'נסה לשנות את הסינון למעלה.' : 'המערכת בודקת איחורים בגבייה, תשלומים לספקים, מסמכים חסרים, שכר ורשויות, התאמות אשראי ויתרה צפויה שלילית.') + '</div>';
  }
  for (const a of shown) {
    h += '<div class="al-card s-' + a.sev + '"><div class="al-head"><span class="al-sev ' + a.sev + '">' + SEV_LABEL[a.sev] + '</span>' +
      '<b>' + esc(a.title) + '</b><span class="grow"></span>' +
      (a.amount ? '<span class="al-amt">' + fmtMoney(a.amount) + ' ₪</span>' : '') +
      (a.date ? '<span class="muted al-date">' + fmtDate(a.date) + '</span>' : '') + '</div>' +
      '<div class="al-detail">' + esc(a.detail) + '</div>' +
      '<div class="al-acts">' +
      (a.tabId ? '<button class="btn sm primary" data-act="algo" data-tab="' + esc(a.tabId) + '"' + (a.rowId ? ' data-rowid="' + esc(a.rowId) + '"' : '') + '>מעבר ' + (a.rowId ? 'לשורה' : 'לחוצץ') + ' ›</button>' : '') +
      (a.act ? '<button class="btn sm" data-act="' + esc(a.act) + '">🔗 שיוך עכשיו</button>' : '') +
      '<span class="grow"></span>' +
      (a.snoozed
        ? '<span class="muted" style="font-size:12px">נדחה עד ' + fmtDate(a.snoozeUntil) + '</span> <button class="btn sm" data-act="alwake" data-k="' + esc(a.key) + '">החזרה לרשימה</button>'
        : '<span class="muted" style="font-size:12px">דחייה:</span> <button class="btn sm" data-act="alsnooze" data-k="' + esc(a.key) + '" data-d="7">שבוע</button>' +
          '<button class="btn sm" data-act="alsnooze" data-k="' + esc(a.key) + '" data-d="30">חודש</button>' +
          '<button class="btn sm" data-act="alsnooze" data-k="' + esc(a.key) + '" data-d="3650">להתעלם</button>') +
      '</div></div>';
  }
  v.innerHTML = h;
}
function alertAction(act, el, e) {

function bindCfInputs() {
  const p = cfPeriod();
  const upd = () => { saveCfPeriod(); UI.cfCollapsed = {}; render(); };
  const fc = $('#cfForecast'); if (fc) fc.onchange = e => { UI.cfShowForecast = e.target.checked; render(); };
  $$('.cfdate').forEach(inp => inp.onchange = () => {
    const iso = parseDateInput(inp.value);
    if (!iso) { toast('תאריך לא תקין (dd/mm/yyyy)', 'err'); render(); return; }
    if (iso < CAL_MIN_YEAR + '-01-01') { toast('ניתן לבחור תאריכים החל משנת ' + CAL_MIN_YEAR, 'warn'); render(); return; }
    const b = periodBounds(p); p.fromDate = b.from; p.toDate = b.to;
    p[inp.dataset.which] = iso;
    if (p.fromDate > p.toDate) [p.fromDate, p.toDate] = [p.toDate, p.fromDate];
    upd();
  });
  const so = $('#cfSummaryOnly'); if (so) so.onchange = () => { p.summaryOnly = so.checked; upd(); };
  // הדגשת שתי השורות של הצמד (הכנסה לאטלס + תשלום לספק) במעבר עכבר
  const tb = $('#view .grid-wrap[data-tab="main"] tbody');
  if (tb) {
    const hi = (k, on) => $$('#view tr[data-pair="' + (window.CSS && CSS.escape ? CSS.escape(k) : k) + '"]').forEach(tr => tr.classList.toggle('pair-hi', on));
    tb.addEventListener('mouseover', e => { const tr = e.target.closest('tr[data-pair]'); if (tr) hi(tr.dataset.pair, true); });
    tb.addEventListener('mouseout', e => { const tr = e.target.closest('tr[data-pair]'); if (tr) hi(tr.dataset.pair, false); });
  }
}

/* ---------------- non-tab actions ---------------- */
function viewAction(act, el, e) {
  if (alertAction(act, el, e)) return;
  switch (act) {
    case 'cfrebuild': render(); toast('התזרים נבנה מחדש מחוצצי המקור. נתוני המקור לא שונו.', 'ok'); break;
    case 'cfskin': S.settings.cfSkin = S.settings.cfSkin === 'soft' ? 'classic' : 'soft'; markDirty(); render(); break;
    case 'cfclear': UI.filters.main = {}; render(); break;
    case 'cfsaltoggle': { UI.cfSalOpen = UI.cfSalOpen || {}; UI.cfSalOpen[el.dataset.k] = !UI.cfSalOpen[el.dataset.k]; render(); break; }
    case 'ccauthmatch': e.preventDefault && e.preventDefault(); ccAuthMatchModal(false); break;
    case 'cfcctoggle': { UI.ccOpen = UI.ccOpen || {}; UI.ccOpen[el.dataset.k] = !UI.ccOpen[el.dataset.k]; render(); break; }
    case 'cfauthtoggle': { UI.authOpen = UI.authOpen || {}; UI.authOpen[el.dataset.k] = !UI.authOpen[el.dataset.k]; render(); break; }
    case 'cfbanktoggle': { UI.bankOpen = UI.bankOpen || {}; UI.bankOpen[el.dataset.k] = !UI.bankOpen[el.dataset.k]; render(); break; }
    case 'cfccmonth': { UI.ccMonthOpen = UI.ccMonthOpen || {}; UI.ccMonthOpen[el.dataset.k] = !UI.ccMonthOpen[el.dataset.k]; if (!UI.ccMonthOpen[el.dataset.k]) UI.ccOpen = {}; render(); break; }
    case 'cfmode': { const p = cfPeriod(); p.mode = el.dataset.mode; if (p.mode === 'range' && p.fromDate > p.toDate) [p.fromDate, p.toDate] = [p.toDate, p.fromDate]; saveCfPeriod(); UI.cfCollapsed = {}; render(); break; }
    case 'cfprev': case 'cfnext': { const p = cfPeriod(); const nm = monthAdd(p.month, act === 'cfprev' ? -1 : 1); if (nm < CAL_MIN_YEAR + '-01') return; p.month = nm; saveCfPeriod(); render(); break; }
    case 'cfpickmonth': { const p = cfPeriod(); openCalendar(el, { value: p.month + '-01', pickMonth: true, onPick: iso => { p.month = iso.slice(0, 7); saveCfPeriod(); UI.cfCollapsed = {}; render(); } }); break; }
    case 'cfpickdate': { const p = cfPeriod(), b = periodBounds(p), which = el.dataset.which; openCalendar(el, { value: which === 'fromDate' ? b.from : b.to, onPick: iso => { p.fromDate = b.from; p.toDate = b.to; p[which] = iso; if (p.fromDate > p.toDate) [p.fromDate, p.toDate] = [p.toDate, p.fromDate]; saveCfPeriod(); UI.cfCollapsed = {}; render(); } }); break; }
    case 'cfthis': { const p = cfPeriod(); p.month = curMonth(); saveCfPeriod(); render(); break; }
    case 'cfpreset': {
      const p = cfPeriod(), cm = curMonth(), y = +cm.slice(0, 4);
      if (el.dataset.p === '3') { p.fromDate = monthAdd(cm, -2) + '-01'; p.toDate = monthEnd(cm); }
      else if (el.dataset.p === '6') { p.fromDate = monthAdd(cm, -5) + '-01'; p.toDate = monthEnd(cm); }
      else if (el.dataset.p === 'year') { p.fromDate = y + '-01-01'; p.toDate = y + '-12-31'; }
      else { p.fromDate = (y - 1) + '-01-01'; p.toDate = (y - 1) + '-12-31'; }
      saveCfPeriod(); render(); break;
    }
    case 'cfgomonth': { const p = cfPeriod(); p.mode = 'month'; p.month = el.dataset.m; saveCfPeriod(); render(); window.scrollTo(0, 0); break; }
    case 'cfcollapse': { const c = UI.cfCollapsed || (UI.cfCollapsed = {}); c[el.dataset.m] = !c[el.dataset.m]; render(); break; }
    case 'cffilter': {
      const key = el.dataset.key;
      openFilterPopup(el, () => { const { all } = cfFiltered(); return [...new Set(all.map(r => cfFilterText(r, key)))].sort((a, b) => a.localeCompare(b, 'he', { numeric: true })); },
        tabFilters('main')[key], arr => { tabFilters('main')[key] = arr; render(); });
      break;
    }
    case 'cfsrc': e.preventDefault(); navigate(el.dataset.tab, el.dataset.rowid); break;
    case 'cfdoc': {
      const t = tabInfo(el.dataset.tab); const row = t && t.rows.find(r => r.id === el.dataset.rowid);
      if (!row) return;
      if (!String(row[el.dataset.field] || '').trim() || String(row[el.dataset.field]).trim() === '0') { toast('מסמך חסר – יש להזין מספר מסמך בחוצץ המקור', 'err'); return; }
      openDoc(t, row, el.dataset.field); break;
    }
    case 'cfxlsx': case 'cfpdf': {
      const { rows } = cfFiltered();
      const head = CF_COLS.map(c => c.label);
      const body = rows.map(r => CF_COLS.map(c => c.key === 'income' ? (r.dir === 'in' ? r.amount : '') : c.key === 'expense' ? (r.dir === 'out' ? r.amount : '') : c.key === 'balance' ? r.balance : cfText(r, c.key)));
      const pl = periodLabel(cfPeriod());
      if (act === 'cfxlsx') exportExcel('תזרים ' + pl, head, body); else exportPDF('גיליון ראשי – תזרים', head, body, 'תקופה: ' + pl);
      break;
    }
    case 'an-decide': {
      const key = el.dataset.key, status = el.dataset.status;
      const a = detectAnomalies().find(x => x.key === key); if (!a) return;
      const note = ($('textarea[data-note="' + key + '"]') || {}).value || '';
      if (status === 'fix') {
        confirmModal('אישור לתיקון', 'הערך הקיים <b>' + fmtMoney(a.existing) + '</b> יוחלף בערך המחושב <b>' + fmtMoney(a.computed) + '</b> בחוצץ ' + esc(a.tabName) + ', שורה ' + esc(a.serial) + '. להמשיך?', 'תקן', () => {
          const t = tabInfo(a.tabId); const row = t.rows.find(r => r.id === a.rowId);
          delete row.ov[a.field];
          S.anomalies[key] = { status: 'fix', note, value: a.existing, computed: a.computed, decidedAt: new Date().toISOString(), tabName: a.tabName, serial: a.serial, label: a.label };
          markDirty(); render(); toast('הערך תוקן לפי החישוב', 'ok');
        });
      } else {
        S.anomalies[key] = { status, note, value: a.existing, computed: a.computed, decidedAt: new Date().toISOString(), tabName: a.tabName, serial: a.serial, label: a.label };

const PAIR_COLORS = [
  { bg: '#e8f1fd', line: '#2f6fd0' }, { bg: '#fdf0e6', line: '#c2711f' }, { bg: '#eaf7ee', line: '#2c8a4f' },

function pairColor(tabId) {
  let i = S.entityOrder.indexOf(tabId);
  if (i < 0) { i = 0; for (const ch of String(tabId)) i = (i * 31 + ch.charCodeAt(0)) % 997; }
  return PAIR_COLORS[i % PAIR_COLORS.length];
}

/* ---------------- bank monthly fee ---------------- */
function feeFor(month) {
  const hist = S.settings.bankFee.history.slice().sort((a, b) => a.from < b.from ? -1 : 1);
  let amt = 26; for (const hh of hist) if (hh.from <= month) amt = hh.amount; return amt;
}
function ensureBankFees() {
  const bf = S.settings.bankFee;
  if (!bf.startMonth || !/^\d{4}-\d{2}$/.test(bf.startMonth)) return 0;
  let m = bf.startMonth, created = 0; const end = curMonth(), rows = S.ops.bank.rows;
  let guard = 0;
  while (m <= end && guard++ < 600) {
    if (!bf.generated[m]) {
      const r = newRow('bank');
      Object.assign(r, { serial: nextSerial(rows), date: m + '-01', forMonth: m, txType: 'עמלת בנק', expense: feeFor(m), party: 'הבנק', description: 'עמלת ניהול חשבון חודשית', auto: true, feeMonth: m });
      rows.push(r); bf.generated[m] = r.id; created++;
    }
    m = monthAdd(m, 1);
  }
  return created;
}
function bankFeeBannerHTML() {
  const bf = S.settings.bankFee;

function depState() { return S.ops.bank.deposit || (S.ops.bank.deposit = { opening: 0, openingDate: '', rows: [] }); }
function depSorted() { return depState().rows.slice().sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')) || String(a.id).localeCompare(String(b.id))); }
function depBalance(upto) {
  const d = depState();
  let bal = nz(d.opening);
  for (const r of depSorted()) {
    if (upto && String(r.date || '') > upto) break;
    if (r.kind === 'set') bal = nz(r.amount);
    else if (r.kind === 'out') bal = r2(bal - Math.abs(nz(r.amount)));
    else bal = r2(bal + Math.abs(nz(r.amount)));
  }
  return bal;
}

function doBackup() {

  download('ATLAS_backup_' + stamp + '.json', JSON.stringify(S, null, 1), 'application/json');
  toast('קובץ גיבוי JSON הורד', 'ok');
}
function summarizeState(s) {
  const c = { yazam: 0, mod: 0, freelancer: 0, rows: 0 };
  Object.values(s.entities || {}).forEach(e => { c[e.type] = (c[e.type] || 0) + 1; c.rows += (e.rows || []).length; });
  const ops = Object.fromEntries(Object.keys(OPS).map(k => [k, ((s.ops || {})[k] || { rows: [] }).rows.length]));
  return { ...c, ops, employees: (s.employees || []).length, docs: Object.keys(s.docs || {}).length, anomalies: Object.keys(s.anomalies || {}).length, savedAt: s.savedAt };
}
$('#restoreFile').addEventListener('change', e => {

      '<p>קובץ: <b>' + esc(file.name) + '</b> · נשמר: ' + (nw.savedAt ? new Date(nw.savedAt).toLocaleString('he-IL') : '—') + '</p>' +

/* ---------------- credit import (FIBI / Excel / CSV) ---------------- */
const CC_FIELDS = [
  { key: 'txDate', label: 'תאריך עסקה', kw: ['תאריך עסקה', 'תאריך רכישה', 'תאריך העסקה', 'תאריך'] },
  { key: 'chargeDate', label: 'תאריך חיוב', kw: ['תאריך חיוב', 'מועד חיוב', 'תאריך החיוב'] },
  { key: 'merchant', label: 'בית עסק', kw: ['שם בית העסק', 'שם בית עסק', 'בית עסק', 'בית העסק', 'תיאור', 'פירוט'] },
  { key: 'amount', label: 'סכום חיוב', kw: ['סכום חיוב', 'סכום לחיוב', 'סכום החיוב', 'חיוב בש"ח', 'סכום בש"ח', 'סכום'] },
  { key: 'card', label: 'כרטיס / 4 ספרות', kw: ['4 ספרות', 'ספרות אחרונות', 'מספר כרטיס', 'כרטיס'] },
  { key: 'payments', label: 'מספר תשלומים', kw: ['מספר תשלומים', 'תשלומים', 'מס\' תשלומים'] },
  { key: 'kindCol', label: 'חיוב / זיכוי', kw: ['סוג עסקה', 'סוג תנועה', 'זיכוי', 'סוג חיוב'] },
  { key: 'notes', label: 'הערות', kw: ['הערות', 'פירוט נוסף'] }
];
function ccHash(r) { return hashStr([r.txDate || '', r.chargeDate || '', (r.merchant || '').replace(/\s+/g, ' ').trim(), r2(nz(r.amount)).toFixed(2), r.card || ''].join('|')); }
function readSheetFile(file, cb) {
  const rd = new FileReader();
  if (/\.csv$/i.test(file.name)) {
    rd.onload = () => {
      const text = rd.result.replace(/^\ufeff/, '');
      const rows = text.split(/\r?\n/).map(line => { const out = []; let cur = '', q = false; for (let i = 0; i < line.length; i++) { const ch = line[i]; if (q) { if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; } else if (ch === '"') q = true; else if (ch === ',') { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out; });
      cb(null, rows);
    };
    rd.readAsText(file, 'utf-8');
  } else {
    if (!window.XLSX) { cb(new Error('ספריית Excel לא נטענה (דרוש חיבור אינטרנט). ניתן לשמור את הקובץ כ-CSV ולייבא.')); return; }
    rd.onload = () => { try { const wb = XLSX.read(rd.result, { type: 'array', cellDates: false }); const all = []; wb.SheetNames.forEach(n => { const rows = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' }); all.push(...rows); }); cb(null, all); } catch (e) { cb(e); } };
    rd.readAsArrayBuffer(file);
  }
}
function detectHeader(rows) {
  let best = { idx: -1, score: 0, map: {} };
  rows.slice(0, 40).forEach((r, i) => {
    const cells = r.map(x => String(x || '').trim());
    const map = {}; let score = 0;
    for (const f of CC_FIELDS) {
      for (const kw of f.kw) { const j = cells.findIndex((c, jj) => c && c.includes(kw) && !Object.values(map).includes(jj)); if (j >= 0) { map[f.key] = j; score++; break; } }
    }
    if (score > best.score) best = { idx: i, score, map };
  });
  return best;
}
function openCreditImport() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.xlsx,.xls,.csv';
  inp.onchange = () => {
    const file = inp.files[0]; if (!file) return;
    readSheetFile(file, (err, rows) => {
      if (err) { toast('קריאת הקובץ נכשלה: ' + err.message, 'err', 7000); return; }
      rows = rows.filter(r => r && r.some(x => String(x).trim() !== ''));
      // דוח מרוכז מהבנק (כמה כרטיסים וכמה מקטעים בקובץ אחד)
      if (ccIsStatement(rows)) {
        const parsed = ccParseStatement(rows);
        if (parsed.length) { ccStatementPreview(file, parsed); return; }
        toast('זוהה דוח מרוכז אך לא נמצאו עסקאות – בדוק את הקובץ', 'warn', 6000);
      }
      const hd = detectHeader(rows);
      if (hd.idx < 0) { toast('לא זוהתה שורת כותרות בקובץ', 'err'); return; }
      creditPreview(file, rows, hd);
    });
  };
  inp.click();
}
function creditPreview(file, rows, hd) {
  const header = rows[hd.idx].map(x => String(x || '').trim());
  let map = Object.assign({}, hd.map);
  const existing = new Set(S.ops.credit.rows.map(r => r.hash).filter(Boolean));
  let parsed = [];
  const build = () => {
    const seen = new Set();
    parsed = rows.slice(hd.idx + 1).map(r => {
      const o = {};
      for (const f of CC_FIELDS) { const j = map[f.key]; o[f.key] = (j === undefined || j === '' || j === null) ? '' : r[j]; }
      o.txDate = parseDateInput(o.txDate) || '';
      o.chargeDate = parseDateInput(o.chargeDate) || '';
      o.amount = num(o.amount);
      o.merchant = String(o.merchant || '').trim(); o.card = String(o.card || '').trim(); o.notes = String(o.notes || '').trim();
      if (o.amount === null || (!o.txDate && !o.chargeDate)) return null;
      // חיוב / זיכוי: לפי עמודת סוג העסקה, או לפי סכום שלילי בקובץ
      const kindTxt = String(o.kindCol || '');
      o.kind = (/זיכוי|החזר|ביטול/.test(kindTxt) || o.amount < 0) ? 'credit' : 'charge';
      o.amount = Math.abs(o.amount);
      o.payments = Math.max(0, Math.round(nz(num(o.payments))));
      o.hash = ccHash(o);
      o.dupExisting = existing.has(o.hash);
      o.dupFile = seen.has(o.hash); seen.add(o.hash);
      o.include = !o.dupExisting && !o.dupFile;
      o.category = 'כללי';
      return o;
    }).filter(Boolean);
  };
  build();
  const guessMonth = () => { const d = (parsed.find(p => p.chargeDate) || parsed.find(p => p.txDate) || {}); return (d.chargeDate || d.txDate || todayISO()).slice(0, 7); };
  const draw = bg => {
    const mb = $('.mb', bg);
    const colSel = key => '<select data-map="' + key + '"><option value="">— לא קיים —</option>' + header.map((hh, j) => '<option value="' + j + '"' + (map[key] === j ? ' selected' : '') + '>' + esc(hh || ('עמודה ' + (j + 1))) + '</option>').join('') + '</select>';
    const dupE = parsed.filter(p => p.dupExisting).length, dupF = parsed.filter(p => p.dupFile).length;
    const inc = parsed.filter(p => p.include);
    mb.innerHTML = '<div class="kv" style="margin-bottom:8px"><div>קובץ</div><div>' + esc(file.name) + '</div><div>שורת כותרות שזוהתה</div><div>' + (hd.idx + 1) + '</div></div>' +
      '<div class="setting-grid" style="margin-bottom:8px">' + CC_FIELDS.map(f => '<div class="form-row"><label>' + f.label + '</label>' + colSel(f.key) + '</div>').join('') +
      '<div class="form-row"><label>חודש יבוא</label><input type="month" id="ccMonth" value="' + guessMonth() + '"></div></div>' +
      '<div class="stats">' + statHTML('שורות בקובץ', parsed.length) + statHTML('ייקלטו', inc.length, 'green') + statHTML('כפולות – קיימות במערכת', dupE, 'red') + statHTML('כפולות בתוך הקובץ', dupF, 'red') + statHTML('סכום לקליטה', fmtMoney(r2(inc.reduce((s, p) => s + p.amount, 0))), 'gold') + '</div>' +
      '<div class="form-row" style="margin-bottom:8px"><label>שיוך לכרטיס</label><select id="ccCardImp"><option value="">— לפי 4 הספרות בקובץ —</option>' + ccCards().map(c => '<option value="' + c.id + '">' + esc(c.name + (c.last4 ? ' · ' + c.last4 : '')) + '</option>').join('') + '</select></div>' +
      '<div class="grid-wrap" style="max-height:340px"><table class="grid"><thead><tr><th><input type="checkbox" id="ccAll"></th><th>תאריך עסקה</th><th>תאריך חיוב</th><th>בית עסק</th><th class="num">סכום</th><th>סוג</th><th>תשלומים</th><th>כרטיס</th><th>סיווג</th><th>מצב</th></tr></thead><tbody>' +
      parsed.map((p, i) => '<tr><td><input type="checkbox" data-inc="' + i + '"' + (p.include ? ' checked' : '') + '></td><td>' + fmtDate(p.txDate) + '</td><td>' + fmtDate(p.chargeDate) + '</td><td>' + esc(p.merchant) + '</td><td class="num">' + fmtMoney(p.amount) + '</td><td>' + (p.kind === 'credit' ? '<span class="status yes">זיכוי</span>' : 'חיוב') + '</td><td class="num">' + (p.payments > 1 ? p.payments : '') + '</td><td>' + esc(p.card) + '</td><td><select data-cat="' + i + '">' + CREDIT_CATEGORIES.map(c => '<option' + (c === p.category ? ' selected' : '') + '>' + c + '</option>').join('') + '</select></td><td>' + (p.dupExisting ? '<span class="status no">כפול – כבר נקלט</span>' : p.dupFile ? '<span class="status no">כפול בקובץ</span>' : '<span class="status yes">חדש</span>') + '</td></tr>').join('') +
      '</tbody></table></div>';
    $$('[data-map]', mb).forEach(s => s.onchange = () => { map[s.dataset.map] = s.value === '' ? undefined : +s.value; build(); draw(bg); });
    $$('[data-inc]', mb).forEach(c => c.onchange = () => { parsed[+c.dataset.inc].include = c.checked; draw(bg); });
    $$('[data-cat]', mb).forEach(c => c.onchange = () => { parsed[+c.dataset.cat].category = c.value; });
    $('#ccAll', mb).onchange = e => { parsed.forEach(p => { if (!p.dupExisting) p.include = e.target.checked; }); draw(bg); };
  };
  openModal({
    title: 'יבוא חיובי אשראי – תצוגה מקדימה', wide: true, body: '',
    onOpen: draw,
    buttons: [{
      label: 'אישור יבוא', cls: 'primary', onClick: bg => {
        const month = $('#ccMonth', bg).value || guessMonth();
        const inc = parsed.filter(p => p.include);
        if (!inc.length) { toast('לא נבחרו שורות ליבוא', 'warn'); return false; }
        const dupSel = inc.filter(p => p.dupExisting).length;
        if (dupSel && !confirm(dupSel + ' שורות מסומנות ככפולות וכבר קיימות. לקלוט בכל זאת?')) return false;
        const importId = uid('imp');
        const forced = $('#ccCardImp', bg).value;
        const cardFor = last4 => {
          if (forced) return forced;
          const nm = String(last4 || '').trim();
          if (!nm) return ccCards()[0] ? ccCards()[0].id : '';
          let c = ccCards().find(x => x.last4 === nm || x.name === nm);
          if (!c) { c = { id: uid('cc'), name: /^\d{4}$/.test(nm) ? 'כרטיס ' + nm : nm, last4: /^\d{4}$/.test(nm) ? nm : '', company: '', bankAccount: '', active: true }; ccCards().push(c); }
          return c.id;
        };
        inc.forEach(p => {
          const r = newRow('credit');
          Object.assign(r, { serial: nextSerial(S.ops.credit.rows), txDate: p.txDate, chargeDate: p.chargeDate || p.txDate, merchant: p.merchant, amount: p.amount, kind: p.kind, payments: p.payments > 1 ? p.payments : null, cardId: cardFor(p.card), notes: p.notes, category: p.category, hash: p.hash, importId, importMonth: month, source: file.name });
          S.ops.credit.rows.push(r);
        });
        S.ops.credit.imports.push({ id: importId, fileName: file.name, month, count: inc.length, total: r2(inc.reduce((s, p) => s + p.amount, 0)), at: new Date().toISOString() });
        markDirty(); render(); toast(inc.length + ' חיובים נקלטו מ-' + file.name, 'ok');
      }
    }, { label: 'ביטול' }]
  });
}

    S.entityOrder.push(id);
    rows.forEach(o => { const r = Object.assign(newRow(type, S.entities[id]), o, { isTest: true }); r.serial = nextSerial(S.entities[id].rows); S.entities[id].rows.push(r); });
  };
  mk('yazam', 'בדיקה – יזם', 'אחראי בדיקה', [
    { year: y, month: '01', dealNo: '101', taxReceiptNo: '5001', net: 10000, submitted: addDays(t0, -70), term: '45', hasSupplier: true, supplierPct: 15, supplierDocNo: '0', notes: 'שורת בדיקה – התקבל' },
    { year: y, month: '02', dealNo: '102', net: 8000, offDed: 500, submitted: addDays(t0, -10), term: '60', hasSupplier: false, notes: 'שורת בדיקה – ללא ספק (ספק נכנס בהמשך)' }
  ], { client: 'לקוח בדיקה', termDays: 45, supplierPctDefault: 15 });
  mk('mod', 'בדיקה – משהב״ט', 'אחראי בדיקה', [
    { year: y, month: '03', orderNo: '444-000-0000', dealNo: '201', taxReceiptNo: '6001', hours: 4.8, rate: 280, km: 90, offroad: 100, submitted: addDays(t0, -50), term: '45', supplierPct: 10, supplierDocNo: '777', supplierPaid: true },
    { year: y, month: '04', dealNo: '202', hours: 10, rate: 280, km: 150, submitted: addDays(t0, -5), term: '90', supplierPct: 10, ov: { total: 4000 } }
  ], { client: 'משהב״ט', termDays: 45, supplierPctDefault: 10 });
  mk('freelancer', 'בדיקה – עצמאי', '', [
    { year: y, month: '01', net: 5000, projectName: 'פרויקט בדיקה', taxReceiptNo: '901', payDate: addDays(t0, -20) },
    { year: String(+y - 1), month: '12', net: 3000, projectName: 'פרויקט בדיקה', payDate: addDays(t0, -300) }
  ]);
  const emp = { id: uid('emp'), name: 'עובד בדיקה', isTest: true }; S.employees.push(emp);
  const addOps = (k, o) => { const r = Object.assign(newRow(k), o, { isTest: true }); r.serial = nextSerial(S.ops[k].rows); S.ops[k].rows.push(r); };
  addOps('salaries', { employeeId: emp.id, net: 9000, reportDate: addDays(t0, -12), payDate: addDays(t0, -8), status: true });
  addOps('pensions', { employeeId: emp.id, fundName: 'קופת בדיקה', fundKind: 'פנסיה', empDeposit: 540, erDeposit: 585, severance: 375, payDate: addDays(t0, -7), status: true, reference: 'TEST' });
  addOps('pensions', { employeeId: emp.id, fundName: 'קרן בדיקה', fundKind: 'קרן השתלמות', empDeposit: 175, erDeposit: 525 });
  addOps('authorities', { authType: 'מע״מ', code: '2761', action: 'pay', year: y, month: pad2(new Date().getMonth() + 1), amount: 2300, method: 'העברה בנקאית', dueDate: addDays(t0, -15), payDate: addDays(t0, -15), status: true, notes: 'בדיקה' });
  addOps('authorities', { authType: 'מילואים', code: '', action: 'credit', year: y, month: pad2(new Date().getMonth() + 1), amount: 8420, method: 'זיכוי בנקאי', dueDate: addDays(t0, -5), payDate: addDays(t0, -5), status: true, notes: 'תגמול מילואים – בדיקה' });
  addOps('bank', { date: addDays(t0, -3), forMonth: addDays(t0, -3).slice(0, 7), txType: 'העברה בנקאית', party: 'לקוח בדיקה', income: 50000, description: 'הפקדת בדיקה' });
  let tc = ccCards().find(c => c.isTest);
  if (!tc) { tc = { id: uid('cc'), name: 'כרטיס בדיקה', last4: '1234', company: 'MAX', bankAccount: '', active: true, isTest: true }; ccCards().push(tc); }
  addOps('credit', { txDate: addDays(t0, -30), chargeDate: addDays(t0, -2), merchant: 'בית עסק לבדיקה', amount: 350, kind: 'charge', cardId: tc.id, category: 'כללי', source: 'ידני', hash: 'test1' });
  markDirty(); render(); toast('נוצרו נתוני בדיקה (🧪) – ניתן להסירם מהגדרות', 'ok');

function removeTestData() {
  confirmModal('הסרת נתוני בדיקה', 'יוסרו כל החוצצים, העובדים והשורות שסומנו כנתוני בדיקה (🧪). נתונים אחרים לא יושפעו.', 'הסרה', () => {
    let n = 0;
    for (const id of [...S.entityOrder]) if (S.entities[id].isTest) { delete S.entities[id]; S.entityOrder = S.entityOrder.filter(x => x !== id); n++; for (const d of Object.values(S.docs)) if (d.tabId === id) delete S.docs[d.id]; for (const k of Object.keys(S.anomalies)) if (k.startsWith(id + '|')) delete S.anomalies[k]; }
    for (const id of S.entityOrder) S.entities[id].rows = S.entities[id].rows.filter(r => !r.isTest);
    for (const k of Object.keys(S.ops)) S.ops[k].rows = S.ops[k].rows.filter(r => { if (r.isTest) { n++; for (const d of Object.values(S.docs)) if (d.rowId === r.id) delete S.docs[d.id]; } return !r.isTest; });
    S.employees = S.employees.filter(e => !e.isTest);
    S.ops.credit.cards = ccCards().filter(c => !c.isTest);
    markDirty(); render(); toast('נתוני הבדיקה הוסרו (' + n + ' פריטים)', 'ok');
  }, true);
}

/* ---------------- global search ---------------- */
$('#searchInput').addEventListener('input', e => {
  const q = e.target.value.trim(); const box = $('#searchResults');
  if (q.length < 2) { box.classList.add('hidden'); return; }
  const res = [];
  for (const id of allTabIds()) {
    const t = tabInfo(id);
    if (t.name.includes(q)) res.push({ view: id, text: '📁 ' + t.name });
    for (const row of t.rows) {
      const c = calcRow(t.kind, row);
      const hit = t.cols.map(col => cellText(t, col, row, c)).find(s => s && s.includes(q));
      if (hit) res.push({ view: id, row: row.id, text: t.name + ' · שורה ' + row.serial + ' · ' + hit });
      if (res.length > 40) break;
    }
  }
  box.innerHTML = res.length ? res.map((r, i) => '<div data-i="' + i + '">' + esc(r.text) + '</div>').join('') : '<div class="muted">לא נמצאו תוצאות</div>';
  box.classList.remove('hidden');
  $$('div[data-i]', box).forEach(d => d.onclick = () => { const r = res[+d.dataset.i]; box.classList.add('hidden'); navigate(r.view, r.row); });
});

/* ---------------- top bar ---------------- */
$('#tbSave').onclick = () => saveNow(false);
$('#tbBackup').onclick = doBackup;
$('#tbRestore').onclick = () => $('#restoreFile').click();
$('#tbAlerts').onclick = () => navigate('alerts');
$('#tbAnomalies').onclick = () => navigate('anomalies');
$('#tbSettings').onclick = () => navigate('settings');
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveNow(false); } });

/* ---------------- init ---------------- */
(function init() {
  try {
    const loaded = Storage.load();
    if (loaded) { S = normalizeState(loaded); setSaveState('ok', '✓ נטען מהשמירה המקומית'); }
    else { S = defaultState(); setSaveState('ok', 'מערכת חדשה – ריקה'); }
  } catch (e) {
    S = defaultState();
    $('#msgArea').innerHTML = '<div class="msg err">טעינת הנתונים השמורים נכשלה (' + esc(e.message) + '). המערכת נפתחה ריקה והנתונים הקודמים לא נמחקו מהדפדפן – אל תשמור לפני טעינת גיבוי.</div>';
    S.settings.autosave = false;
  }
  if (ensureBankFees() + ensureCreditRecurring()) markDirty();
  try { const v = localStorage.getItem('atlas_ui_view'); if (v) UI.view = v; } catch (e) { }
  render();
  DocFS.init().then(found => { if (found) render(); });
  syncInit();
  setInterval(() => { if (ensureBankFees() + ensureCreditRecurring()) { markDirty(); render(); } }, 60 * 60 * 1000);
})();
</script>
