
    1  <!DOCTYPE html>
   2  <html lang="he" dir="rtl">
   3  <head>
   4  <meta charset="utf-8">
   5  <meta name="viewport" content="width=device-width, initial-scale=1">
   6  <title>ATLAS – תזרים ופרויקטים</title>
   7  <link rel="preconnect" href="https://fonts.googleapis.com">
   8  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
   9  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  13  <style>
  14  :root{
  15    --navy:#14213d; --navy2:#1f3160; --gold:#c9a227; --gold-soft:#f6ecc8;
  16    --lav:#eceafd; --lav2:#d9d5f7; --bg:#f3f4f8; --card:#fff; --line:#dfe2ea;
  17    --text:#1b2233; --muted:#6b7385; --red:#c62828; --red-bg:#fde8e8;
  18    --green:#1e7d3a; --green-bg:#e3f5e8; --blue:#1d5fbf; --edit:#fffbea; --auto:#f4f6fb;
  19    --warn:#b26a00; --warn-bg:#fff3dc;
  20    /* צבע זיהוי לסוג הפרויקט: יזם מול משהב״ט */
  21    --pt-yazam:#0f766e; --pt-yazam-bg:#e2f2f0;
  22    --pt-mod:#6d28d9;   --pt-mod-bg:#efe8fd;
  23  }
  24  /* ---- הבחנה חזותית בין סוגי פרויקטים ---- */
  25  .sb-group[data-ptype]>.sb-group-h{border-inline-start:4px solid transparent;padding-inline-start:8px}
  26  .sb-group[data-ptype=yazam]>.sb-group-h{border-inline-start-color:var(--pt-yazam);color:var(--pt-yazam)}
  27  .sb-group[data-ptype=mod]>.sb-group-h{border-inline-start-color:var(--pt-mod);color:var(--pt-mod)}
  28  .sb-group[data-ptype=yazam] .sb-children{border-inline-start:2px solid var(--pt-yazam-bg);margin-inline-start:5px}
  29  .sb-group[data-ptype=mod] .sb-children{border-inline-start:2px solid var(--pt-mod-bg);margin-inline-start:5px}
  30  .sb-group[data-ptype=yazam] .sb-client-h{color:#0b5b55}
  31  .sb-group[data-ptype=mod] .sb-client-h{color:#5b21b6}
  32  .sb-group[data-ptype=yazam] .sb-item:not(.active){background:var(--pt-yazam-bg)}
  33  .sb-group[data-ptype=mod] .sb-item:not(.active){background:var(--pt-mod-bg)}
  34  .sb-group[data-ptype] .sb-item{margin-bottom:2px}
  35  .ptag{display:inline-block;font-size:11px;font-weight:700;border-radius:9px;padding:1px 8px;white-space:nowrap}
  36  .pt-yazam{background:var(--pt-yazam-bg);color:var(--pt-yazam)}
  37  .pt-mod{background:var(--pt-mod-bg);color:var(--pt-mod)}
  38  .crumb[data-ptype]{border-inline-start:6px solid transparent;padding-inline-start:10px;border-radius:4px}
  39  .crumb[data-ptype=yazam]{border-inline-start-color:var(--pt-yazam)}
  40  .crumb[data-ptype=mod]{border-inline-start-color:var(--pt-mod)}
  41  .crumb[data-ptype=yazam] h2{color:var(--pt-yazam)}
  42  .crumb[data-ptype=mod] h2{color:var(--pt-mod)}
  43  .grid tr[data-ptype=yazam]:not(.pairrow) td:first-child{box-shadow:inset -4px 0 0 var(--pt-yazam)}
  44  .grid tr[data-ptype=mod]:not(.pairrow) td:first-child{box-shadow:inset -4px 0 0 var(--pt-mod)}
  45  *{box-sizing:border-box}
  46  html,body{margin:0;height:100%}
  47  body{font-family:Heebo,"Segoe UI",Arial,sans-serif;font-size:14px;color:var(--text);background:var(--bg)}
  48  button{font-family:inherit;font-size:13px;cursor:pointer}
  49  input,select,textarea{font-family:inherit;font-size:13px}
  50  .hidden{display:none!important}
  51  
  52  /* ---------- top bar ---------- */
  53  #topbar{position:fixed;top:0;right:0;left:0;height:56px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;z-index:50;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  54  #topbar .brand{font-weight:800;font-size:20px;letter-spacing:1px;display:flex;align-items:center;gap:8px;white-space:nowrap}
  55  #topbar .brand small{font-weight:400;font-size:12px;opacity:.75;letter-spacing:0}
  56  .pill-gold{background:var(--gold);color:var(--navy);border-radius:999px;padding:4px 12px;font-weight:700;white-space:nowrap}
  57  .tb-stat{font-size:12px;opacity:.9;white-space:nowrap}
  58  .tb-stat b{font-size:14px}
  59  #searchBox{flex:1;max-width:340px;position:relative}
  60  #searchBox input{width:100%;border-radius:999px;border:0;padding:7px 14px;background:#2b3d6b;color:#fff}
  61  #searchBox input::placeholder{color:#b9c2dc}
  62  #searchResults{position:absolute;top:38px;right:0;left:0;background:#fff;color:var(--text);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-height:360px;overflow:auto;z-index:60}
  63  #searchResults div{padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer}
  64  #searchResults div:hover{background:var(--lav)}
  65  .tb-spacer{flex:1}
  66  .tb-btn{background:#2b3d6b;color:#fff;border:0;border-radius:8px;padding:7px 11px;white-space:nowrap}
  67  .tb-btn:hover{background:#3a4f86}
  68  .tb-btn.gold{background:var(--gold);color:var(--navy);font-weight:700}
  69  #saveState{font-size:12px;white-space:nowrap}
  70  #syncState{font-size:12px;white-space:nowrap}
  71  #syncState.sync-ok{color:#8fe3a6}#syncState.sync-wait{color:#ffd37a}#syncState.sync-err{color:#ff9a9a}
  72  .sync-rules{direction:ltr;text-align:left;background:#f6f7fb;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:11.5px;overflow:auto;max-height:190px;margin:6px 0 0}
  73  #saveState.dirty{color:#ffd37a}#saveState.ok{color:#8fe3a6}#saveState.err{color:#ff9a9a}
  74  .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;text-align:center;margin-inline-start:4px}
  75  
  76  /* ---------- sidebar ---------- */
  77  #sidebar{position:fixed;top:56px;right:0;bottom:0;width:236px;background:#fff;border-left:1px solid var(--line);overflow:auto;padding:10px 8px 80px;z-index:40}
  78  .sb-item,.sb-group-h{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;cursor:pointer;user-select:none}
  79  .sb-item:hover,.sb-group-h:hover{background:var(--lav)}
  80  .sb-item.active{background:var(--navy);color:#fff}
  81  .sb-group-h{font-weight:700;margin-top:6px}
  82  .sb-group-h .chev{display:inline-block;transition:transform .15s;font-size:11px;width:12px}
  83  .sb-group.closed .chev{transform:rotate(90deg)}
  84  .sb-group.closed .sb-children{display:none}
  85  .sb-children{padding-right:14px}
  86  .sb-children .sb-item{font-size:13px;padding:6px 10px}
  87  .sb-count{margin-inline-start:auto;font-size:11px;color:var(--muted);background:var(--bg);border-radius:9px;padding:0 6px}
  88  .sb-item.active .sb-count{background:#2b3d6b;color:#fff}
  89  .sb-empty{font-size:12px;color:var(--muted);padding:4px 12px}
  90  #btnNew{display:block;width:100%;margin:6px 0 10px;background:var(--gold);color:var(--navy);border:0;border-radius:10px;padding:10px;font-weight:800;font-size:14px}
  91  .sb-client{margin:0}
  92  .sb-group-h.sb-client-h{font-weight:600;font-size:13.5px;margin-top:2px;padding:6px 10px;color:#2a3450}
  93  .sb-client-h .sb-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  94  .sb-client .sb-children{padding-right:16px;border-right:1px dashed #d9dde8;margin-right:14px}
  95  .sb-group.closed > .sb-group-h .chev{transform:rotate(90deg)}
  96  .sb-group:not(.closed) > .sb-group-h .chev{transform:none}
  97  .sb-sep{border-top:1px solid var(--line);margin:10px 4px}
  98  
  99  /* ---------- main ---------- */
 100  #main{margin:56px 236px 0 0;padding:16px 18px 40px;min-height:calc(100vh - 56px)}
 101  .crumb{background:var(--lav);border:1px solid var(--lav2);border-radius:10px;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
 102  .crumb h2{margin:0;font-size:18px}
 103  .crumb .meta{font-size:12px;color:var(--muted)}
 104  .crumb .grow{flex:1}
 105  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;color:var(--text);white-space:nowrap}
 106  .btn:hover{border-color:var(--navy2)}
 107  .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
 108  .btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700}
 109  .btn.danger{color:var(--red);border-color:#f0b9b9}
 110  .btn.danger:hover{background:var(--red-bg)}
 111  .btn.sm{padding:3px 8px;font-size:12px}
 112  .toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
 113  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
 114  .stat{background:#fff;border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:10px;padding:8px 14px;min-width:130px}
 115  .stat .l{font-size:11px;color:var(--muted)}
 116  .stat .v{font-size:17px;font-weight:700;direction:ltr;text-align:right}
 117  .stat.green{border-top-color:var(--green)}.stat.red{border-top-color:var(--red)}.stat.gold{border-top-color:var(--gold)}
 118  .filter-note{font-size:12px;color:var(--blue);margin-bottom:6px}
 119  .layout-side{display:flex;gap:12px;align-items:flex-start}
 120  .layout-side .main-col{flex:1;min-width:0}
 121  .side-panel{width:220px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;flex-shrink:0;position:sticky;top:70px}
 122  .side-panel h4{margin:0 0 8px;font-size:14px}
 123  .side-panel table{width:100%;border-collapse:collapse;font-size:13px}
 124  .side-panel td{padding:4px;border-bottom:1px solid var(--line)}
 125  .side-panel td:last-child{text-align:left;direction:ltr}
 126  .side-panel tr.hl-row td{background:#fdf3c8!important}
 127  .side-panel .tot-row td{position:static}
 128  .side-panel a.emp-link{text-decoration:none}
 129  /* כפתור "חזרה למסך הקודם" בראש כל חוצץ / כרטיס אדם */
 130  .crumb .back-btn{background:#fff;border:1px solid var(--navy);color:var(--navy);font-weight:500;white-space:nowrap}
 131  .crumb .back-btn:hover{background:var(--navy);color:#fff}

 133  /* ---------- messages ---------- */
 134  #msgArea{margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
 135  .msg{border-radius:8px;padding:7px 12px;font-size:13px;display:flex;gap:8px;align-items:center}
 136  .msg.warn{background:var(--warn-bg);color:var(--warn);border:1px solid #f3d49b}
 137  .msg.err{background:var(--red-bg);color:var(--red);border:1px solid #f0b9b9}
 138  .msg.info{background:#e7f0fd;color:var(--blue);border:1px solid #c3d8f7}
 139  #toasts{position:fixed;bottom:16px;left:16px;display:flex;flex-direction:column;gap:6px;z-index:200}
 140  .toast{background:var(--navy);color:#fff;padding:9px 14px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.3);max-width:420px;font-size:13px}
 141  .toast.ok{background:var(--green)}.toast.err{background:var(--red)}.toast.warn{background:var(--warn)}
 142  
 143  /* ---------- grid ---------- */
 144  .grid-wrap{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 290px)}
 145  table.grid{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
 146  .grid th{position:sticky;top:0;background:var(--navy);color:#fff;font-weight:500;font-size:11.5px;padding:4px 5px;border-left:1px solid #2b3d6b;white-space:normal;line-height:1.2;z-index:2;text-align:right}
 147  .grid th .fbtn{background:transparent;border:0;color:#aeb8d6;padding:0 3px;font-size:11px}
 148  .grid th .fbtn.on{color:var(--gold)}
 149  .grid th.num{text-align:left}
 150  .grid td{border-bottom:1px solid var(--line);border-left:1px solid #eef0f5;padding:1px 4px;vertical-align:middle;white-space:nowrap;font-size:13px;line-height:1.2}
 151  .grid tr:hover td{background:#fafbff}
 152  .grid tr.flash td{animation:flash 2s}
 153  @keyframes flash{0%,40%{background:var(--gold-soft)}100%{background:transparent}}
 154  .grid td.auto{background:var(--auto)}
 155  .grid td.num{text-align:left;direction:ltr}
 156  .grid input.cell,.grid select.cell{border:1px solid #d7dbe6;border-radius:5px;background:var(--edit);padding:1px 4px;height:22px;line-height:18px;width:100%;min-width:46px}
 157  .grid input.cell:focus,.grid select.cell:focus{outline:2px solid var(--gold);background:#fff}
 158  .grid input.cell.num{text-align:left;direction:ltr}
 159  .grid input.cell.w-s{min-width:40px;width:44px}
 160  .grid input.cell.w-n{min-width:56px;width:60px}
 161  .grid input.cell.w-y{min-width:52px;width:56px}
 162  .grid select.cell.w-t{min-width:58px;width:62px}
 163  .grid select.cell.w-s{min-width:46px;width:50px}
 164  .grid input.cell.w-m{min-width:74px;width:80px}
 165  .grid input.cell.w-ord{min-width:92px;width:96px}
 166  .grid input.cell.w-l{min-width:110px;width:130px}
 167  .computed{min-width:56px}
 168  .grid td.sticky-r{position:sticky;right:0;background:#fff;z-index:1}
 169  .grid th.sticky-r{right:0;z-index:3}
 170  .computed{direction:ltr;display:inline-block;min-width:70px;text-align:left}
 171  .ovr{background:#fff0c2;border-radius:4px;padding:0 3px}
 172  .ovr-mark{color:var(--warn);font-size:11px;cursor:pointer;margin-inline-start:3px}
 173  .muted{color:var(--muted)}
 174  .fc{font-style:italic;color:var(--muted)}
 175  .red{color:var(--red)!important;font-weight:700}
 176  .chip{display:inline-flex;align-items:center;gap:3px;border:1px solid #b9c6e6;background:#eef3ff;color:var(--blue);border-radius:6px;padding:1px 6px;cursor:pointer;direction:ltr}
 177  .chip.linked{background:#e3f5e8;border-color:#9fd3ae;color:var(--green)}
 178  .chip.zero{background:var(--red-bg);border-color:#f0b9b9;color:var(--red);font-weight:700}
 179  .chip .ed{color:var(--muted);font-size:11px;padding-left:2px}
 180  .status{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;cursor:pointer;user-select:none}
 181  .status.no{background:var(--red-bg);color:var(--red)}
 182  .status.yes{background:var(--green-bg);color:var(--green)}
 183  .status.fc{background:#eef0f5;color:var(--muted);font-style:normal}
 184  .row-del{border:0;background:transparent;color:#b8bdc9;font-size:15px;padding:0 4px}
 185  .row-del:hover{color:var(--red)}
 186  .term-wrap{display:flex;flex-direction:column;gap:1px}
 187  .term-wrap small{font-size:10.5px;color:var(--muted);direction:ltr;text-align:right;white-space:nowrap}
 188  .tot-row td{background:var(--gold-soft)!important;font-weight:700;position:sticky;bottom:0}

 190  /* ---------- date picker ---------- */
 191  .dp{display:inline-flex;align-items:center;gap:2px}
 192  .dp input{width:76px!important;min-width:76px!important;direction:ltr;text-align:center;font-size:12.5px}
 193  .dp button{border:0;background:transparent;padding:0 1px;font-size:12px}
 194  .period-bar .dp input{width:100px!important;min-width:100px!important;font-size:13px}
 195  #dpPop{position:fixed;background:#fff;border:1px solid #e3e6ec;border-radius:12px;box-shadow:0 10px 30px rgba(20,33,61,.18);padding:12px 12px 10px;z-index:300;width:300px;font-family:inherit}
 196  #dpPop .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
 197  #dpPop .hd select{flex:1;height:34px;border:1px solid #d9dde4;border-radius:7px;padding:0 8px;background:#fff;font-size:14px;color:#1b2233}
 198  #dpPop .hd .nav{flex:0 0 34px;width:34px;height:34px;border:1px solid #d9dde4;background:#fff;border-radius:7px;font-size:18px;line-height:1;color:#6b7385;padding:0}
 199  #dpPop .hd .nav.prev{color:var(--red)}
 200  #dpPop .hd .nav:hover:not(:disabled){background:#f4f5f9}
 201  #dpPop .hd .nav:disabled{opacity:.35;cursor:default}
 202  #dpPop table{width:100%;border-collapse:collapse;text-align:center;table-layout:fixed}
 203  #dpPop th{font-size:12px;color:#8a92a3;font-weight:400;padding:4px 0 8px}
 204  #dpPop td{padding:2px 0}
 205  #dpPop td button{width:36px;height:34px;border:2px solid transparent;border-radius:7px;background:transparent;font-size:14px;color:#1b2233}
 206  #dpPop td button:hover{background:#eef0f6}
 207  #dpPop td button.inmonth{background:#eef1f8}
 208  #dpPop td button.sel{background:var(--navy2);color:#fff;font-weight:700}
 209  #dpPop td button.today{background:var(--navy2);color:#fff;font-weight:700;border-color:var(--red)}
 210  #dpPop .ft{display:flex;justify-content:space-between;margin-top:10px}
 211  #dpPop .fbt{height:32px;padding:0 14px;border:1px solid #d9dde4;border-radius:7px;background:#fff;color:#1b2233;font-size:13.5px}
 212  #dpPop .fbt:hover{background:#f4f5f9}

 214  /* ---------- filter popup ---------- */
 215  #fPop{position:fixed;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:8px;z-index:300;width:220px}
 216  #fPop input[type=text]{width:100%;margin-bottom:6px;padding:4px 6px;border:1px solid var(--line);border-radius:6px}
 217  #fPop .list{max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px}

 219  #fPop .ft{display:flex;gap:4px;justify-content:space-between;margin-top:6px}

 221  /* ---------- drop zone ---------- */
 222  .docbar{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin-top:12px}

 224  .dropzone.over{background:var(--lav);border-color:var(--navy2);color:var(--navy)}

 226  .docpath label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
 227  .docpath .r{display:flex;gap:6px}
 228  .docpath input{flex:1;direction:ltr;padding:6px;border:1px solid var(--line);border-radius:6px}
 229  .doclist{font-size:12px;margin-top:6px;max-height:110px;overflow:auto;text-align:right}

 232  /* ---------- modal ---------- */
 233  #modalBg{position:fixed;inset:0;background:rgba(15,22,40,.5);z-index:250;display:flex;align-items:center;justify-content:center;padding:20px}

 235  .modal.wide{max-width:1100px}

 237  .modal .mh .x{margin-inline-start:auto;background:transparent;border:0;color:#fff;font-size:20px}
 238  .modal .mb{padding:16px}

 240  .form-row{margin-bottom:12px}
 241  .form-row label{display:block;font-weight:500;margin-bottom:4px}

 243  .form-row .hint{font-size:12px;color:var(--muted);margin-top:3px}

1052    s.ops = Object.assign(defaultState().ops, s.ops || {});
1053    for (const k of Object.keys(defaultState().ops)) {
1054      s.ops[k] = Object.assign({ docPath: '', rows: [] }, s.ops[k] || {});
1055      if (!Array.isArray(s.ops[k].rows)) s.ops[k].rows = [];
1056    }
1057    if (!Array.isArray(s.ops.credit.imports)) s.ops.credit.imports = [];
1058    if (!Array.isArray(s.ops.credit.cards)) s.ops.credit.cards = [];
1059    if (!Array.isArray(s.ops.credit.recurring)) s.ops.credit.recurring = [];
1060    if (!s.ops.credit.recon || typeof s.ops.credit.recon !== 'object') s.ops.credit.recon = {};
1061    // אשראי: מבנה ישן (כרטיס כטקסט, סכום שלילי = זיכוי) → כרטיסים מנוהלים + סוג פעולה
1062    s.ops.credit.rows.forEach(r => {
1063      if (!r.kind) { r.kind = nz(r.amount) < 0 ? 'credit' : 'charge'; r.amount = Math.abs(nz(r.amount)); }
1064      if (!r.cardId && r.card) {
1065        const nm = String(r.card).trim();
1066        let card = s.ops.credit.cards.find(c => c.name === nm || c.last4 === nm);
1067        if (!card) { card = { id: uid('cc'), name: /^\d{4}$/.test(nm) ? 'כרטיס ' + nm : nm, last4: /^\d{4}$/.test(nm) ? nm : '', company: '', bankAccount: '', active: true }; s.ops.credit.cards.push(card); }
1068        r.cardId = card.id;
1069      }
1070    });
1071    if (!Array.isArray(s.settings.bankTxTypes) || !s.settings.bankTxTypes.length) s.settings.bankTxTypes = BANK_TX_TYPES.slice();
1072    if (!Array.isArray(s.settings.personAliases)) s.settings.personAliases = defaultState().settings.personAliases;
1073    s.settings.personAliases = s.settings.personAliases.filter(g => Array.isArray(g) && g.filter(Boolean).length > 1);
1074    s.ops.bank.deposit = Object.assign({ opening: 0, openingDate: '', rows: [] }, s.ops.bank.deposit || {});
1075    if (!Array.isArray(s.ops.bank.deposit.rows)) s.ops.bank.deposit.rows = [];
1076    // בנק: מבנה ישן (סכום + כיוון + קוד סוג) → הכנסה/הוצאה + סוג תנועה בעברית
1077    s.ops.bank.rows.forEach(r => {
1078      if (r.income === undefined && r.expense === undefined && r.amount !== undefined) {
1079        const dir = r.txType === 'deposit' ? 'in' : (r.txType === 'other' ? (r.direction || 'out') : 'out');
1080        const amt = Math.abs(nz(r.amount));
1081        if (dir === 'in') r.income = amt; else r.expense = amt;
1082      }
1083      if (BANK_TYPE_MIGRATE[r.txType]) r.txType = BANK_TYPE_MIGRATE[r.txType];

1091    s.entities = s.entities || {};
1092    s.entityOrder = (s.entityOrder || []).filter(id => s.entities[id]);
1093    for (const id of Object.keys(s.entities)) {
1094      if (!s.entityOrder.includes(id)) s.entityOrder.push(id);

1100      if (e.type === 'freelancer') e.rows.forEach(r => {
1101        if (r.amount !== undefined) {
1102          const gross = Math.abs(nz(r.amount));
1103          if (r.net === undefined || !nz(r.net)) {
1104            const d = r.payDate || ((r.year && r.month) ? r.year + '-' + pad2(r.month) + '-01' : '');
1105            r.vatPct = vatRateFor(d, nz(r.vatPct) || s.settings.vatDefault);

1107          }
1108          delete r.amount;
1109        }
1110        if (r.vatPct === undefined || r.vatPct === null || r.vatPct === '') r.vatPct = s.settings.vatDefault;
1111        delete r.offAdd; delete r.offDed; if (r.ov) delete r.ov.total;
1112      });

1115    s.ops.pensions.rows.forEach(r => {
1116      if (r.amount !== undefined && r.empDeposit === undefined && r.erDeposit === undefined && r.severance === undefined) {

1124    // ניקוי: גרסה קודמת פתחה רשומת אדם בכ״א מכל שם שהוקלד בעמודת ״גוף״ בבנק, כולל שמות

1146  /* תיקון: חשבונית שקושרה בחוצץ האדם לפני שהקישור הדו-כיווני הופעל (או להפך) לא קיבלה

1149  function repairFreeDocs(s) {
1150    const bank = (s.ops.bank && s.ops.bank.rows) || [];
1151    if (!bank.length) return;
1152    const byId = {}; bank.forEach(b => byId[b.id] = b);
1153    const docs = Object.values(s.docs);
1154    const at = (tabId, rowId, field) => docs.find(d => d.tabId === tabId && d.rowId === rowId && d.field === field);
1155    const add = (src, tgt) => {
1156      const id = uid('doc');
1157      const d = Object.assign({}, src, tgt, { id, mirrorOf: src.id });
1158      s.docs[id] = d; docs.push(d);
1159      return d;
1160    };
1161    for (const eid of Object.keys(s.entities)) {
1162      const e = s.entities[eid];
1163      if (e.type !== 'freelancer') continue;
1164      for (const r of e.rows || []) {
1165        const b = r.bankRowId ? byId[r.bankRowId] : null;
1166        if (!b) continue;
1167        const a = at(eid, r.id, 'taxReceiptNo'), c = at('ops:bank', b.id, 'docNo');
1168        if (a && !c) {
1169          add(a, { tabId: 'ops:bank', rowId: b.id, field: 'docNo' });
1170          if (!String(b.docNo || '').trim()) b.docNo = String(r.taxReceiptNo || a.number || '').trim();
1171        } else if (c && !a) {
1172          add(c, { tabId: eid, rowId: r.id, field: 'taxReceiptNo' });
1173          if (!String(r.taxReceiptNo || '').trim()) r.taxReceiptNo = String(b.docNo || c.number || '').trim();
1174        }
1175      }
1176    }
1177  }

2991      if (!(yy >= 2015 && yy <= 2100 && mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31)) continue;

3003    return cands[0].iso;

3410  function setField(t, rowId, key, raw, type, isOv) {
3411    const row = t.rows.find(r => r.id === rowId); if (!row) return;
3412    row.ov = row.ov || {};
3413    let val = raw;
3414    if (type === 'num') {
3415      if (String(raw).trim() === '') val = null;
3416      else { val = num(raw); if (val === null) { toast('ערך מספרי לא תקין: ' + raw, 'err'); render(); return; } }
3417    } else if (type === 'date') {
3418      const p = parseDateInput(raw);
3419      if (p === null) { toast('תאריך לא תקין: ' + raw + ' (פורמט dd/mm/yyyy)', 'err'); render(); return; }
3420      val = p;
3421    } else if (type === 'year') {
3422      val = String(raw).trim();
3423      if (val && !/^\d{4}$/.test(val)) { toast('שנה לא תקינה', 'err'); render(); return; }
3424    } else if (type === 'employee') {
3425      if (raw === '__new') { addEmployeeModal(emp => { row.employeeId = emp.id; markDirty(); }); return; }
3426    } else if (typeof val === 'string') val = val.trim();
3427  
3428    if (t.kind === 'authorities' && key === 'authType') {
3429      const a = AUTHORITIES.find(x => x.name === String(raw).trim());
3430      if (a) { row.code = a.code; if (!row.action || row.action === 'pay' || row.action === 'credit') row.action = a.dir; }
3431    }
3432    if (t.kind === 'credit' && ['authType', 'amount', 'chargeDate', 'txDate', 'kind', 'merchant', 'cardId'].includes(key)) setTimeout(() => { ccAuthSync(row); render(); }, 0);
3433    if (t.kind === 'credit' && key === 'authType' && String(raw).trim() && (!row.category || row.category === 'כללי')) row.category = 'רשויות';
3434    if (t.kind === 'credit' && key === 'cardId' && raw === '__new') { ccCardsModal(); render(); return; }
3435    if (t.kind === 'bank' && key === 'txType' && raw === '__new') { newBankTypeModal(tp => { row.txType = tp; markDirty(); render(); }); return; }
3436    if (key === 'offAdd' || key === 'offDed') { if (val !== null) val = Math.abs(val); migrateOffset(row); }
3437    if ((key === 'supAdd' || key === 'supDed') && val !== null) val = Math.abs(val);
3438    const prevBankDate = (t.kind === 'bank' && key === 'date') ? String(row.date || '') : '';
3439    if (isOv) {
3440      const c = calcRow(t.kind, row);
3441      if (val === null || val === '') delete row.ov[key];
3442      else if (type === 'num' && Math.abs(nz(val) - nz(c.auto[key])) < 0.005) delete row.ov[key];
3443      else if (type === 'date' && val === c.auto[key]) delete row.ov[key];
3444      else row.ov[key] = val;
3445    } else {
3446      row[key] = val;
3447    }
3448    if (row.auto && t.kind === 'bank' && (key === 'expense' || key === 'income')) row.autoEdited = true;
3449    if (t.kind === 'bank' && (key === 'income' || key === 'expense') && val !== null) {
3450      // ממלאים רק צד אחד – מילוי צד אחד מנקה את הצד השני
3451      const other = key === 'income' ? 'expense' : 'income';
3452      if (Math.abs(nz(val))) { row[key] = Math.abs(val); row[other] = null; }
3453    }
3454    // "עבור איזה חודש" מתעדכן עם התאריך, אלא אם הוזן ידנית חודש שונה מחודש התאריך הקודם
3455    if (t.kind === 'bank' && key === 'date' && val && (!row.forMonth || !prevBankDate || row.forMonth === prevBankDate.slice(0, 7))) row.forMonth = val.slice(0, 7);
3456    if ((t.kind === 'salaries' || t.kind === 'pensions' || t.kind === 'authorities') && key === 'payDate') delete row.payDateAuto;
3457    if (t.kind === 'authorities' && key === 'payDate' && val) row.status = true;
3458    if (t.kind === 'authorities' && ['status', 'payDate', 'dueDate', 'amount', 'method', 'authType', 'authName', 'action', 'year', 'month'].includes(key)) setTimeout(() => { authBankSync(row); render(); }, 0);
3459    // תשלום לעצמאי: עריכה בחוצץ האדם מעדכנת את שורת הבנק, ועריכה בבנק מעדכנת את שורת האדם.
3460    // הסנכרון רץ מיד (ולא ב-setTimeout) כדי שהמצב יהיה עקבי כבר ברינדור שבסוף הפונקציה.
3461    if (t.kind === 'freelancer' && ['net', 'vatPct', 'amount', 'payDate', 'year', 'month', 'projectName', 'taxReceiptNo'].includes(key)) freeBankSync(row, t.entity);
3462    if (t.kind === 'bank' && ['txType', 'party', 'income', 'expense', 'date', 'forMonth', 'docNo'].includes(key) && ((row.txType || '') === FREE_TX_TYPE || row.freeRowId)) bankFreeSync(row);
3463    if (t.kind === 'bank' && row.authRowId) {
3464      const a = S.ops.authorities.rows.find(x => x.id === row.authRowId);
3465      if (a) {
3466        if (key === 'income' || key === 'expense') { a.amount = Math.abs(nz(val)); if (key === 'income') a.action = 'credit'; if (key === 'expense') a.action = 'pay'; }
3467        if (key === 'date' && val) { a.payDate = val; a.status = true; }
3468        setTimeout(() => { authBankSync(a); render(); }, 0);
3469      }
3470    }
3471    if (key === 'term' && val !== 'manual') delete row.expectedManual;
3472    if (UI.editing === rowId + ':' + key) UI.editing = null;
3473    markDirty();
3474    render();
3475  }

4276  /* =====================================================================
4277     חוצץ „פנסיות” – הפקדות לקופות (פנסיה / קרן השתלמות / ביטוח מנהלים)
4278     שורה = עובד × חודש × קופה · יבוא "רשימת תשלומים לתקופת גביה" (שיקלולית)
4279     ===================================================================== */
4280  
4281  /* ---------------- פענוח דוח הפקדות ---------------- */
4282  // בדוח זה הספרות והפיסוק מוזזים בתו אחד אחורה (/ = 0, + = פסיק, - = נקודה) והאות נ מופיעה כ-U+F8FF
4283  const penText = s => String(s).replace(/\uF8FF/g, 'נ');
4284  function penNum(s) {
4285    s = String(s).trim();
4286    if (!/^[\/0-8+\-.$]+$/.test(s)) return null;
4287    const d = [...s].map(ch => String.fromCharCode(ch.charCodeAt(0) + 1)).join('');
4288    const n = parseFloat(d.replace(/,/g, '').replace(/%$/, ''));
4289    return isFinite(n) ? n : null;
4290  }
4291  function parsePensionPage(items) {
4292    const its = items.filter(i => i.str && i.str.trim()).map(i => ({ raw: i.str.trim(), s: penText(i.str.trim()).replace(/!/g, '"'), x: i.transform[4], y: i.transform[5] }));
4293    its.sort((a, b) => b.y - a.y || b.x - a.x);
4294    const lines = []; let cur = null;
4295    for (const it of its) { if (!cur || Math.abs(it.y - cur.y) > 4) { cur = { y: it.y, it: [] }; lines.push(cur); } cur.it.push(it); }
4296    const title = its.find(i => /רשימת תשלומים לתקופת גביה/.test(i.s));
4297    if (!title) return null;
4298    const r = { rows: [] };
4299    const m = title.s.match(/(\d{1,2})\/(\d{4})/); if (m) r.month = m[2] + '-' + pad2(m[1]);
4300    if (its.some(i => /סה"כ לכל הקופות/.test(i.s))) { r.summary = true; return r; }
4301    const fl = lines.find(l => l.it.some(i => /^קופה\s*\d+/.test(i.s)));
4302    if (fl) {
4303      const code = fl.it.find(i => /^קופה\s*\d+/.test(i.s));
4304      r.fundCode = (code.s.match(/\d+/) || [''])[0];
4305      r.fundName = fl.it.filter(i => i !== code).sort((a, b) => b.x - a.x).map(i => i.s).join(' ').replace(/^-\s*/, '').trim();
4306    }
4307    const hName = its.find(i => i.s === 'שם העובד');
4308    if (!hName) return r;
4309    const hdr = lines.find(l => l.y > hName.y + 3 && l.y < hName.y + 16);
4310    const labels = hdr ? hdr.it.filter(i => i.x < 440) : [];
4311    const keren = labels.some(i => /קה"ל/.test(i.s));
4312    const fn = r.fundName || '';
4313    r.fundKind = keren || /השתלמות/.test(fn) ? 'קרן השתלמות' : /מנהלים/.test(fn) ? 'ביטוח מנהלים' : (/גמל/.test(fn) && !/פנסי/.test(fn)) ? 'קופת גמל' : 'פנסיה';
4314    const cols = [{ k: 'salaryBase', x: 486 }, { k: 'days', x: 446 }, { k: 'total', x: 45 }];
4315    for (const lb of labels) {
4316      const side = lb.x > 290 ? 'emp' : 'er';
4317      const k = /גמל/.test(lb.s) ? 'Gemel' : /כושר/.test(lb.s) ? 'Dis' : /פיצויים/.test(lb.s) ? 'Sev' : /קה"ל/.test(lb.s) ? 'Keren' : 'Other';
4318      cols.push({ k: side + k, x: lb.x });
4319    }
4320    const totL = lines.find(l => l.it.some(i => /סה"כ עובדים/.test(i.s)));
4321    for (const l of lines) {
4322      if (l.y >= hName.y - 4 || (totL && l.y <= totL.y + 2)) continue;
4323      const nameIt = l.it.find(i => /[\u0590-\u05FF]/.test(i.s) && i.x > 650 && i.x < 760);
4324      if (!nameIt) continue;
4325      const noIt = l.it.find(i => i.x > 760 && penNum(i.raw) !== null);
4326      const nm = nameIt.s.replace(/,/g, '-');
4327      const w = nm.split(/\s+/);
4328      const row = { empNo: noIt ? String(penNum(noIt.raw)) : '', nameRaw: nm, name: w.length > 1 ? w.slice(1).join(' ') + ' ' + w[0] : nm };
4329      cols.forEach(c => row[c.k] = 0);
4330      for (const it of l.it) {
4331        if (it.x >= 500) continue;
4332        const v = penNum(it.raw); if (v === null) continue;
4333        const c = cols.reduce((best, cc) => Math.abs(cc.x - it.x) < Math.abs(best.x - it.x) ? cc : best, cols[0]);
4334        row[c.k] = r2((row[c.k] || 0) + v);
4335      }
4336      row.empDeposit = r2(nz(row.empGemel) + nz(row.empKeren) + nz(row.empDis) + nz(row.empOther));
4337      row.erDeposit = r2(nz(row.erGemel) + nz(row.erKeren) + nz(row.erDis) + nz(row.erOther));
4338      row.severance = r2(nz(row.erSev));
4339      r.rows.push(row);
4340    }
4341    return r;
4342  }
4343  async function readPensionPdf(file) {
4344    if (!window.pdfjsLib) throw new Error('ספריית קריאת PDF לא נטענה (נדרש חיבור לאינטרנט בפתיחת האתר)');
4345    if (window.pdfjsLib.GlobalWorkerOptions && !window.pdfjsLib.GlobalWorkerOptions.workerSrc) window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
4346    const doc = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
4347    const pages = [];
4348    for (let i = 1; i <= doc.numPages; i++) {
4349      const r = parsePensionPage((await (await doc.getPage(i)).getTextContent()).items);
4350      if (r) { r.page = i; pages.push(r); }
4351    }
4352    return pages;
4353  }

4912  function addMonths(iso, n) {
4913    const [y, m, d] = iso.split('-').map(Number);
4914    const dt = new Date(y, m - 1 + n, 1);
4915    const last = new Date(dt.getFullYear(), dt.getMonth() + 1, 0).getDate();
4916    return dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(Math.min(d, last));
4917  }

4920  function ccRecurring() { return S.ops.credit.recurring || (S.ops.credit.recurring = []); }
4921  function ensureCreditRecurring() {
4922    let created = 0;
4923    const end = curMonth();
4924    for (const rc of ccRecurring()) {
4925      if (!rc.startMonth) continue;
4926      rc.generated = rc.generated || {};
4927      let m = rc.startMonth, guard = 0;
4928      while (m <= end && (!rc.endMonth || m <= rc.endMonth) && guard++ < 600) {
4929        if (!rc.generated[m]) {
4930          const rows = S.ops.credit.rows;
4931          const day = Math.min(Math.max(1, nz(rc.day) || 1), 28);
4932          const r = newRow('credit');
4933          Object.assign(r, {
4934            serial: nextSerial(rows), txDate: m + '-' + pad2(day), chargeDate: m + '-' + pad2(day), cardId: rc.cardId,
4935            merchant: rc.merchant, description: rc.notes || 'חיוב קבוע', amount: nz(rc.amount), kind: 'charge',
4936            category: rc.category || 'תוכנה ומנויים', recurringId: rc.id, auto: true, source: 'חיוב קבוע'
4937          });
4938          rows.push(r); rc.generated[m] = r.id; created++;
4939        }
4940        m = monthAdd(m, 1);
4941      }
4942    }
4943    return created;
4944  }

5013  /* ---------- התאמה אוטומטית של חיובי האשראי מול דף בנק (קובץ Excel/CSV מהבנק) ---------- */
5014  function ccBankParse(rows) {
5015    // מאתרים שורת כותרת עם תאריך + תיאור + חובה
5016    let hi = -1, map = {};
5017    for (let i = 0; i < Math.min(rows.length, 40); i++) {
5018      const cells = rows[i].map(x => String(x || '').trim());
5019      const f = re => cells.findIndex(c => re.test(c));
5020      const m = { date: f(/^תאריך$/), date2: f(/תאריך ערך/), desc: f(/^תא?ור|^תיאור|^פרטים/), debit: f(/^חובה/), credit: f(/^זכות/) };
5021      if (m.date < 0) m.date = f(/^תאריך/);
5022      if (m.date >= 0 && m.desc >= 0 && m.debit >= 0) { hi = i; map = m; break; }
5023    }
5024    if (hi < 0) return null;
5025    const toISO = v => {
5026      if (typeof v === 'number' && v > 30000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 86400000)); return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth() + 1) + '-' + pad2(d.getUTCDate()); }
5027      const s = String(v || '').trim(); let m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/);
5028      if (m) return (m[3].length === 2 ? '20' + m[3] : m[3]) + '-' + pad2(m[2]) + '-' + pad2(m[1]);
5029      m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[0] : '';
5030    };
5031    const out = [];
5032    for (let i = hi + 1; i < rows.length; i++) {
5033      const r = rows[i], date = toISO(r[map.date]);
5034      if (!date) continue;
5035      const desc = String(r[map.desc] || '').trim();
5036      const m = desc.match(/^(\d{4})\s*-/);
5037      if (!m) continue; // רק שורות חיוב כרטיס ("1091 - מקס …")
5038      const deb = num(r[map.debit]) || 0, cr = map.credit >= 0 ? (num(r[map.credit]) || 0) : 0;
5039      const amt = r2(Math.abs(deb) - Math.abs(cr));
5040      if (!amt) continue;
5041      out.push({ date, last4: m[1], desc, amount: amt });
5042    }
5043    return out;
5044  }
5045  function ccSiteGroups() {
5046    const by = {};
5047    for (const row of S.ops.credit.rows) {
5048      const c = calcRow('credit', row);
5049      if (!c.chargeDate || !row.cardId) continue;
5050      const g = ccGroupKey(row);
5051      const o = by[g] = by[g] || { g, date: c.chargeDate, cardId: row.cardId, last4: (ccCardById(row.cardId) || {}).last4 || '', amount: 0, n: 0 };
5052      o.amount = r2(o.amount + c.signed); o.n++;
5053    }
5054    return Object.values(by);
5055  }
5056  function ccAutoReconcile(bankLines) {
5057    // מאחדים חיובי בנק של אותו כרטיס באותו יום
5058    const bk = {};
5059    bankLines.forEach(l => { const k = l.date + '|' + l.last4; const o = bk[k] = bk[k] || { date: l.date, last4: l.last4, amount: 0, desc: l.desc }; o.amount = r2(o.amount + l.amount); });
5060    const banks = Object.values(bk).sort((a, b) => a.date.localeCompare(b.date));
5061    const from = banks.length ? banks[0].date : '', to = banks.length ? banks[banks.length - 1].date : '';
5062    const groups = ccSiteGroups().filter(x => x.date >= addDays(from, -4) && x.date <= addDays(to, 4));
5063    const usedB = new Set(), usedG = new Set(), exact = [], gap = [];
5064    const dd = (a, b) => Math.abs(daysBetween(a, b));
5065    for (const pass of [0, 1]) {
5066      for (const x of groups) {
5067        if (usedG.has(x.g)) continue;
5068        const cand = banks.filter(b => !usedB.has(b) && b.last4 === x.last4 && dd(b.date, x.date) <= 4 && (pass === 1 || Math.abs(b.amount - x.amount) < 0.01))
5069          .sort((a, b) => dd(a.date, x.date) - dd(b.date, x.date) || Math.abs(a.amount - x.amount) - Math.abs(b.amount - x.amount));
5070        if (!cand.length) continue;
5071        const b = cand[0]; usedB.add(b); usedG.add(x.g);
5072        (pass === 0 ? exact : gap).push({ x, b });
5073      }
5074    }
5075    return { exact, gap, siteOnly: groups.filter(x => !usedG.has(x.g) && Math.abs(x.amount) >= 0.01), bankOnly: banks.filter(b => !usedB.has(b)), from, to };
5076  }

5190      if (mCard) {

5192        hdr = null; sectionCharge = card.charge; continue;

5199      }
5200      if (r.includes('תאריך עסקה')) {

5225      const cur = hdr.cur != null ? clean(raw[hdr.cur]) : '';
5226      out.push({

5229        payments: mPay ? +mPay[2] : 0, paymentNo: mPay ? +mPay[1] : 0,
5230        last4: card.last4, company: card.company,
5231        description: [detail, cur && cur !== 'ש"ח' ? 'מקור: ' + fmtNum(origAmt) + ' ' + cur : ''].filter(Boolean).join(' · '),

5667  /* ---------- סנכרון רשויות ⇄ בנק ----------
5668     תשלום לרשות באמצעי בנקאי נרשם כשורה בחוצץ הבנק, ומשם הוא נכנס לתזרים.
5669     שורת הרשות עצמה מפסיקה לייצר תנועה, כדי שלא תהיה כפילות. */
5670  function authBankRowOf(row) { return row.bankRowId ? S.ops.bank.rows.find(b => b.id === row.bankRowId) : null; }
5671  function authBankSync(row) {
5672    const c = calcRow('authorities', row);
5673    const shouldLink = !row.creditRowId && c.bankMethod && !!row.status && !!(row.payDate || row.dueDate);
5674    let b = authBankRowOf(row);
5675    if (!shouldLink) {
5676      if (b) { S.ops.bank.rows = S.ops.bank.rows.filter(x => x.id !== b.id); }
5677      delete row.bankRowId;
5678      markDirty();
5679      return;
5680    }
5681    const date = row.payDate || row.dueDate;
5682    const amt = Math.abs(nz(row.amount));
5683    if (!b) {
5684      // אם כבר קיימת תנועה מתאימה בבנק (אותו תאריך ואותו סכום) – מתחברים אליה במקום ליצור כפילות
5685      b = S.ops.bank.rows.find(x => !x.authRowId && x.date === date && Math.abs(Math.abs(nz(x.income)) + Math.abs(nz(x.expense)) - amt) < 0.5);
5686      if (!b) {
5687        b = newRow('bank');
5688        b.serial = nextSerial(S.ops.bank.rows);
5689        S.ops.bank.rows.push(b);
5690      }
5691      b.authRowId = row.id;
5692      row.bankRowId = b.id;
5693    }
5694    Object.assign(b, {
5695      date, forMonth: (row.year && row.month) ? row.year + '-' + row.month : date.slice(0, 7),
5696      txType: c.isCredit ? 'זיכוי מרשות' : 'תשלום לרשויות',
5697      party: c.authName,
5698      description: [c.isCredit ? 'זיכוי' : 'תשלום', c.authName, (row.month && row.year) ? 'תקופה ' + row.month + '/' + row.year : '', row.method || ''].filter(Boolean).join(' · '),
5699      docNo: b.docNo || row.docNo || ''
5700    });
5701    if (c.isCredit) { b.income = amt; b.expense = null; } else { b.expense = amt; b.income = null; }
5702    markDirty();
5703  }
5704  function authBankSyncAll() { S.ops.authorities.rows.forEach(r => { if (r.bankRowId || (calcRow('authorities', r).bankMethod && r.status)) authBankSync(r); }); }
5705  /* =====================================================================
5706     כ״א · רישום אנשים אחיד (עובדים + עצמאיים) · כרטיס אדם מרכז
5707     ===================================================================== */
5708  
5709  /* מפתח אדם: emp:<id> לעובד במערכת, ent:<id> לחוצץ אדם עצמאי.
5710     אדם שהוא גם עובד וגם בעל חוצץ מזוהה לפי שם ומוצג פעם אחת. */
5711  function normPerson(n) { return String(n || '').replace(/["'׳״\-]/g, '').replace(/\s+/g, ' ').trim(); }
5712  /* קבוצות שמות: "ברי" ו-"ברוך בארי כהן" הם אותו אדם. השם הראשון בקבוצה הוא השם הראשי. */
5713  function aliasGroups() { return (S.settings.personAliases || []).map(g => g.filter(Boolean)); }
5714  function aliasGroupOf(name) {
5715    const n = normPerson(name); if (!n) return null;
5716    return aliasGroups().find(g => g.some(x => normPerson(x) === n)) || null;
5717  }
5718  function personCanon(name) { const g = aliasGroupOf(name); return normPerson(g ? g[0] : name); }
5719  function personAliasesOf(name) { const g = aliasGroupOf(name); return g ? g.filter(x => normPerson(x) !== normPerson(name)) : []; }
5720  function samePerson(a, b) { return personCanon(a) === personCanon(b) && !!personCanon(a); }
5721  function personEntities() { return S.entityOrder.filter(id => S.entities[id].type === 'freelancer').map(id => S.entities[id]); }
5722  function allPeople(includeArchived) {
5723    const out = [];
5724    const byName = new Map();
5725    for (const e of S.employees) {
5726      const p = { key: 'emp:' + e.id, name: e.name, empId: e.id, entId: '', empNo: e.empNo || '', startDate: e.startDate || '', archived: !!e.archived, roles: ['שכיר'], aliases: personAliasesOf(e.name) };
5727      out.push(p); byName.set(personCanon(e.name), p);
5728    }
5729    for (const ent of personEntities()) {
5730      const hit = byName.get(personCanon(ent.name));

6755  async function syncPushNow(all) {
6756    if (!Sync.on || !Sync.db || !Sync.user) return;
6757    const col = syncCol();
6758    const units = syncUnits();
6759    const put = [];
6760    for (const id of Object.keys(units)) {
6761      const parts = syncPack(units[id]);
6762      const h = hashStr(parts.join(''));
6763      if (!all && Sync.sent[id] === h) continue;
6764      put.push({ id, parts, h });
6765    }
6766    const gone = Object.keys(Sync.sent).filter(id => !(id in units));
6767    if (!put.length && !gone.length) return;
6768    syncSetState('push');

7741  /* ---------- ריכוז כל השנים: כמה כל שותף לקח בכל שנה, מי מקדים וכמה השני זכאי למשוך ---------- */
7742  function partnersYearsList() {
7743    const P = partnersState(), ys = new Set();
7744    const add = d => { const s = String(d || ''); if (/^\d{4}-/.test(s)) ys.add(s.slice(0, 4)); };
7745    P.list.forEach(p => {
7746      S.ops.salaries.rows.forEach(r => { if (r.employeeId === p.empId) add(r.payDate); });
7747      const e = S.entities[p.freeId];
7748      if (e) e.rows.forEach(r => add(r.payDate));
7749    });
7750    P.allocs.forEach(a => {
7751      if (a.kind === 'emp') S.ops.salaries.rows.forEach(r => { if (r.employeeId === a.ref) add(r.payDate); });
7752      else { const e = S.entities[a.ref]; if (e) e.rows.forEach(r => add(r.payDate)); }
7753    });
7754    P.manual.forEach(m => add(m.date));
7755    S.ops.bank.rows.forEach(b => { if (P.list.some(p => partnerNames(p).some(nm => String(b.party || '').includes(nm)))) add(b.date); });
7756    Object.keys(P.carry).forEach(y => ys.add(y));
7757    ys.add(curMonth().slice(0, 4));
7758    return [...ys].sort();

7760  /* לכל שנה: מה נלקח באותה שנה בלבד (בלי יתרת פתיחה), הפער והמצטבר */
7761  function partnersAllYears() {
7762    const years = partnersYearsList();
7763    const rows = years.map(y => {
7764      const res = partnersCalc(y);
7765      const own = res.partners.map(x => r2(x.taken - x.carry));
7766      const tot = r2(own.reduce((a, b) => a + b, 0));
7767      return { year: y, res, own, tot, gaps: res.partners.map((x, i) => r2(own[i] - tot * x.share)) };
7768    }).filter(r => r.tot || r.res.partners.some(x => x.carry));
7769    const n = rows.length ? rows[0].res.partners.length : 0;
7770    const cum = new Array(n).fill(0);
7771    rows.forEach(r => { r.cum = r.gaps.map((g, i) => (cum[i] = r2(cum[i] + g))); });
7772    const totals = new Array(n).fill(0);
7773    rows.forEach(r => r.own.forEach((v, i) => { totals[i] = r2(totals[i] + v); }));
7774    const grand = r2(totals.reduce((a, b) => a + b, 0));
7775    const shares = rows.length ? rows[rows.length - 1].res.partners.map(x => x.share) : [];
7776    const gapAll = totals.map((v, i) => r2(v - grand * shares[i]));
7777    const lead = Math.max(...totals.map((v, i) => shares[i] ? v / shares[i] : 0), 0);
7778    const need = totals.map((v, i) => r2(Math.max(0, lead * shares[i] - v)));
7779    return { rows, totals, grand, shares, gapAll, need, names: rows.length ? rows[rows.length - 1].res.partners.map(x => x.p.name) : [] };
7780  }

8041  function collectUI() { return UI.collect || (UI.collect = { type: '', client: '', owner: '', status: '', q: '', open: {} }); }
8042  function daysBetween(a, b) { if (!a || !b) return null; return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000); }
8043  function collectRows() {
8044    const today = todayISO(), m0 = curMonth(), out = [];
8045    for (const id of S.entityOrder) {
8046      const e = S.entities[id];
8047      if (!e || !['yazam', 'mod'].includes(e.type)) continue;
8048      for (const row of e.rows) {
8049        const c = calcRow(e.type, row);
8050        if (c.paid || !nz(c.total)) continue;
8051        const submitted = row.submitted || '';
8052        const issued = !!(submitted || String(row.dealNo || '').trim() || String(row.taxInvNo || '').trim());
8053        const exp = c.expectedDate || '';
8054        const age = submitted ? daysBetween(submitted, today) : null;
8055        let status, sk;
8056        if (!issued) { status = 'טרם הוגש'; sk = 'draft'; }
8057        else if (exp && exp < today) { status = 'באיחור'; sk = 'late'; }
8058        else if (exp && exp.slice(0, 7) === m0) { status = 'צפוי החודש'; sk = 'month'; }
8059        else if (!exp) { status = 'ללא צפי'; sk = 'noexp'; }
8060        else { status = 'צפוי בהמשך'; sk = 'later'; }
8061        out.push({
8062          tabId: id, rowId: row.id, type: e.type, typeLabel: e.type === 'mod' ? 'משהב״ט' : 'יזם', client: e.client || '—', project: e.name, owner: e.owner || '',
8063          month: pad2(row.month) + '/' + row.year, deal: row.dealNo || '', taxInv: row.taxInvNo || '', submitted, exp, age,
8064          lateDays: exp && exp < today ? daysBetween(exp, today) : 0, total: r2(c.total), sup: c.supplierOn ? r2(nz(c.supplierPay)) : 0,
8065          net: r2(c.total - (c.supplierOn ? nz(c.supplierPay) : 0)), status, sk, old: age !== null && age > 90
8066        });
8067      }
8068    }

8967  function billingState() {
8968    const s = S.settings.billing || (S.settings.billing = {});
8969    if (s.dueDay === undefined) s.dueDay = 10;
8970    if (s.popup === undefined) s.popup = true;
8971    for (const k of ['skip', 'force', 'asked', 'note']) if (!s[k] || typeof s[k] !== 'object') s[k] = {};
8972    return s;
8973  }
8974  function billingUI() { return UI.billing || (UI.billing = { ym: billingDefaultMonth(), showDone: false, client: '' }); }
8975  /* החודש שצריך להגיש עכשיו: בתחילת חודש מגישים את החשבון של החודש שעבר */
8976  function billingDefaultMonth() { return monthAdd(curMonth(), -1); }
8977  function billKey(entId, ym) { return entId + '|' + ym; }
8978  function billDueDate(ym) { const d = Math.min(28, Math.max(1, nz(billingState().dueDay) || 10)); return monthAdd(ym, 1) + '-' + pad2(d); }
8979  function billRow(e, ym) {
8980    const y = ym.slice(0, 4), m = ym.slice(5, 7);
8981    return (e.rows || []).find(r => String(r.year) === y && pad2(r.month) === m) || null;
8982  }
8983  function billPrevRow(e, ym, back) { for (let i = 1; i <= (back || 6); i++) { const r = billRow(e, monthAdd(ym, -i)); if (r) return r; } return null; }
8984  function billMonthsWithRows(e, ym, back) { let n = 0; for (let i = 1; i <= back; i++) if (billRow(e, monthAdd(ym, -i))) n++; return n; }
8985  function billOrderFor(e, ym) {
8986    const a = ym + '-01', b = monthEnd(ym);
8987    return entityOrders(e).find(o => (!o.from || o.from <= b) && (!o.until || o.until >= a)) || null;
8988  }
8989  /* האם מהפרויקט הזה מצפים לחשבון בחודש הזה (לפני התחשבות בדילוג ידני) */
8990  function billBaseExpected(e, ym) {
8991    if (billingState().force[billKey(e.id, ym)]) return true;
8992    if (billRow(e, ym)) return true;
8993    if (e.type === 'mod') return !!billOrderFor(e, ym) || billMonthsWithRows(e, ym, 3) > 0;
8994    return billMonthsWithRows(e, ym, 3) >= 2;
8995  }
8996  /* שלושת השלבים – נגזרים משורת החודש */
8997  function billStages(e, row) {
8998    const defs = BILL_STAGES[e.type] || BILL_STAGES.yazam;
8999    const c = row ? calcRow(e.type, row) : null;
9000    const done = [false, false, false], val = ['', '', ''];
9001    const ovTotal = !!(row && row.ov && num(row.ov.total) !== null);
9002    if (e.type === 'mod') {
9003      const hrs = row ? nz(row.hours) : 0;
9004      done[0] = !!row && (hrs > 0 || ovTotal);
9005      val[0] = hrs ? hoursToHHMM(row.hours) : (ovTotal ? 'סכום ידני' : '');
9006    } else {
9007      done[0] = !!row && (nz(row.net) > 0 || ovTotal);
9008      val[0] = c && c.total ? fmtMoney(c.total) : '';
9009    }
9010    const deal = row ? String(row.dealNo || '').trim() : '';
9011    done[1] = !!deal && deal !== '0';
9012    val[1] = deal;
9013    done[2] = !!(row && row.submitted && c && c.expectedDate);
9014    val[2] = row && row.submitted ? fmtDate(row.submitted) : '';
9015    return { defs, done, val, c, exp: c ? c.expectedDate : '', amount: c ? nz(c.total) : 0, noTerm: !!(row && row.submitted && c && !c.expectedDate) };
9016  }
9017  function billingRows(ym) {
9018    const B = billingState(), out = [];
9019    for (const id of S.entityOrder) {
9020      const e = S.entities[id];
9021      if (!e || !PROJECT_TYPES.includes(e.type)) continue;
9022      if (!billBaseExpected(e, ym)) continue;
9023      const k = billKey(id, ym), row = billRow(e, ym), st = billStages(e, row);
9024      const i = st.done.findIndex(x => !x);
9025      const ord = row && row.orderNo ? String(row.orderNo) : (e.type === 'mod' ? ((billOrderFor(e, ym) || {}).no || '') : '');
9026      out.push({
9027        id, e, ym, row, st, skipped: !!B.skip[k], forced: !!B.force[k],
9028        done: i === -1, step: i === -1 ? 3 : i,
9029        asked: B.asked[k] || '', note: B.note[k] || '',
9030        type: e.type, client: e.client || '—', name: e.name, owner: e.owner || '',
9031        orderNo: ord, amount: st.amount, exp: st.exp, prev: billPrevRow(e, ym)
9032      });
9033    }
9034    return out.sort((a, b) => (a.skipped ? 1 : 0) - (b.skipped ? 1 : 0) || (a.done ? 1 : 0) - (b.done ? 1 : 0) ||
9035      a.step - b.step || a.client.localeCompare(b.client, 'he') || a.name.localeCompare(b.name, 'he'));
9036  }
9037  /* סכום מוערך לחשבון שטרם נערך – לפי החודש הקודם שיש בו שורה */
9038  function billEstimate(r) {
9039    if (r.amount) return r.amount;
9040    if (!r.prev) return 0;
9041    return nz(calcRow(r.e.type, r.prev).total);
9042  }
9043  function billingSummary(ym) {
9044    const rows = billingRows(ym), act = rows.filter(r => !r.skipped);
9045    const open = act.filter(r => !r.done), done = act.filter(r => r.done);
9046    return {
9047      ym, rows, act, open, done, skipped: rows.filter(r => r.skipped),
9048      byStep: [0, 1, 2].map(i => open.filter(r => r.step === i).length),
9049      openSum: r2(open.reduce((s, r) => s + billEstimate(r), 0)),
9050      doneSum: r2(done.reduce((s, r) => s + r.amount, 0)),
9051      due: billDueDate(ym)
9052    };
9053  }
9054  /* החודשים שנבדקים לתזכורת: החודש שצריך להגיש עכשיו וזה שלפניו (פיגור) */
9055  function billingWatchMonths() { const m = billingDefaultMonth(); return [monthAdd(m, -1), m]; }
9056  function billingOpenAll() { return billingWatchMonths().map(billingSummary).filter(s => s.open.length); }
9057  function billingBadge() { return billingOpenAll().reduce((a, s) => a + s.open.length, 0); }

9745      const el = e.target, k = el.dataset ? el.dataset.rp : '';
9746      if (!k) return;
9747      if (k === 'kind') U.kind = el.value;
9748      else if (k === 'cfLive') U.cfLive = el.checked;
9749      else if (k === 'ym' || k === 'mFrom' || k === 'mTo') { if (/^\d{4}-\d{2}$/.test(el.value)) U[k] = el.value; }
9750      else if (k === 'year') { if (/^\d{4}$/.test(el.value)) U.year = el.value; }
9751      else if (k === 'sec') { if (el.checked) delete U.off[el.dataset.k]; else U.off[el.dataset.k] = 1; }
9752      else if (k === 'ent') { const id = el.dataset.k; if (el.checked) { if (!U.ents.includes(id)) U.ents.push(id); } else U.ents = U.ents.filter(x => x !== id); }
9753      repRefresh(bg);
9754    });
9755    bg.addEventListener('click', e => {
9756      const el = e.target.closest('[data-rp]'); if (!el || el.tagName === 'INPUT') return;
9757      const k = el.dataset.rp;
9758      if (k === 'mode') U.mode = el.dataset.k;
9759      else if (k === 'entall') U.ents = repProjects().slice();
9760      else if (k === 'entnone') U.ents = [];

9762      else if (k === 'entyaz') U.ents = repProjects().filter(id => S.entities[id].type === 'yazam');
9763      else return;
9764      repRefresh(bg);

9777  function gateRender() {
9778    const need = gateNeeded();
9779    let el = $('#gate');
9780    if (!need) {
9781      if (el) { el.remove(); try { billingPopupCheck(); } catch (e) { } }
9782      return;
9783    }
9784    if (!el) {
9785      el = document.createElement('div'); el.id = 'gate';
9786      document.body.appendChild(el);
9787      el.addEventListener('click', gateClick);
9788      el.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); gateSignIn(); } });
9789      // אחרי 8 שניות בלי חיבור – מציעים עבודה מקומית, כדי שלא להיתקע בלי גישה לנתונים
9790      setTimeout(() => { if ($('#gate') && !Sync.user) { UI.gateSlow = true; gateRender(); } }, 8000);

9793    const head = '<div class="lg">ATLAS</div><div class="co">ב.ד. אטלס הנדסה וניהול פרויקטים</div>' +
9794      '<div class="ids">ח.פ. 516797214 · מספר ספק (מ.ס.) 11027652</div>';
9795    let h = '<div class="box">' + head;
9796    if (busy) {
9797      h += '<div class="wait"><div class="spin"></div>מתחבר…</div></div>';
9798      el.innerHTML = h; return;
9799    }
9800    h += '<div class="sub">הזדהות נדרשת לכניסה למערכת</div>';
9801    if (UI.gateErr) h += '<div class="err">' + esc(UI.gateErr) + '</div>';
9802    h += '<div class="f"><label for="gEmail">אימייל</label><input id="gEmail" type="email" dir="ltr" autocomplete="username" value="' + esc(UI.gateEmail || syncAllow()[0] || '') + '"></div>' +
9803      '<div class="f"><label for="gPw">סיסמה</label><input id="gPw" type="password" dir="ltr" autocomplete="current-password"></div>' +
9804      '<button class="go" data-g="in">כניסה</button>' +
9805      '<button class="alt" data-g="google"><span style="font-weight:800;color:#4285F4">G</span> כניסה עם חשבון Google</button>' +
9806      '<button class="lnk" data-g="reset">שכחתי סיסמה</button>';
9807    if (UI.gateSlow || Sync.state === 'err') {
9808      h += '<div class="local"><button class="lnk" data-g="local">אין חיבור לענן – המשך לעבודה מקומית בלבד</button></div>';
9809    }

9811    const f = $('#gPw', el) && !$('#gEmail', el).value ? $('#gEmail', el) : $('#gPw', el);
9812    if (f) setTimeout(() => f.focus(), 30);

9814  function gateBusy(on) { UI.gateBusy = on; gateRender(); }
9815  async function gateSignIn() {
9816    const em = ($('#gEmail') || {}).value || '', pw = ($('#gPw') || {}).value || '';
9817    UI.gateEmail = em.trim();
9818    if (!UI.gateEmail || !pw) { UI.gateErr = 'יש להזין אימייל וסיסמה'; gateRender(); return; }
9819    UI.gateErr = ''; gateBusy(true);
9820    const ok = await syncSignIn(UI.gateEmail, pw, false);
9821    UI.gateBusy = false;
9822    if (!ok) { UI.gateErr = Sync.err || 'ההתחברות נכשלה'; Sync.err = ''; }
9823    gateRender();
9824  }
9825  function gateClick(e) {
9826    const b = e.target.closest('[data-g]'); if (!b) return;
9827    e.preventDefault();
9828    const k = b.dataset.g;
9829    if (k === 'in') { gateSignIn(); return; }
9830    if (k === 'google') { UI.gateErr = ''; gateBusy(true); syncGoogleIn().then(() => { UI.gateBusy = false; UI.gateErr = Sync.err || ''; Sync.err = ''; gateRender(); }); return; }
9831    if (k === 'local') { UI.gateSkip = true; gateRender(); toast('עבודה מקומית – השינויים נשמרים במכשיר בלבד ולא מסונכרנים', 'warn', 8000); return; }
9832    if (k === 'reset') {
9833      const em = (($('#gEmail') || {}).value || '').trim();
9834      if (!em) { UI.gateErr = 'יש להזין קודם את כתובת האימייל'; gateRender(); return; }
9835      gateBusy(true);
9836      (async () => {
9837        try {
9838          if (!Sync.auth) await syncConnect();
9839          await Sync.auth.sendPasswordResetEmail(em);
9840          UI.gateErr = ''; UI.gateBusy = false; gateRender();
9841          toast('נשלח מייל לאיפוס סיסמה אל ' + em, 'ok', 8000);
9842        } catch (err) { UI.gateBusy = false; UI.gateErr = syncErrText(err); gateRender(); }
9843      })();
9844    }
9845  }
