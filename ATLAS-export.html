<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATLAS – הוצאת גיבוי מהמכשיר</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#f4f5fa;margin:0;padding:18px;color:#14213d}
  .card{max-width:560px;margin:0 auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(20,33,61,.12)}
  h1{font-size:20px;margin:0 0 6px}
  p{line-height:1.6;margin:8px 0}
  .ok{background:#e8f7ec;border:1px solid #9bd5aa;border-radius:10px;padding:10px 12px}
  .bad{background:#fdecec;border:1px solid #f0a5a5;border-radius:10px;padding:10px 12px}
  table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}
  td,th{padding:6px 8px;border-bottom:1px solid #e6e8f0;text-align:right}
  button{display:block;width:100%;margin:10px 0 0;padding:14px;border:0;border-radius:12px;background:#c9a227;color:#14213d;font-weight:800;font-size:17px}
  button.sec{background:#14213d;color:#fff;font-size:15px;font-weight:700}
  small{color:#5b6580}
</style>
</head>
<body>
<div class="card">
  <h1>הוצאת גיבוי מהמכשיר הזה</h1>
  <p><small>הדף הזה לא מתחבר לענן ולא מסנכרן – הוא רק קורא את מה ששמור במכשיר ומוריד אותו לקובץ.</small></p>
  <div id="out"></div>
</div>
<script>
(function () {
  var out = document.getElementById('out');
  var KEY = 'atlas_cashflow_v1';
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  function stamp() { var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '_' + p(d.getHours()) + '-' + p(d.getMinutes()); }
  function download(name, text) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }
  var raw = null, keys = [], dump = {};
  try {
    for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (/^atlas/i.test(k)) { keys.push(k); dump[k] = localStorage.getItem(k); } }
    raw = localStorage.getItem(KEY);
  } catch (e) { out.innerHTML = '<div class="bad">לא ניתן לקרוא את האחסון של הדפדפן: ' + esc(e.message) + '</div>'; return; }

  if (!raw) {
    out.innerHTML = '<div class="bad"><b>לא נמצאו נתוני אתר במכשיר הזה.</b><br>ייתכן שהדף נפתח בכתובת אחרת מזו של האתר (חייב להיות אותו דומיין – dfred999.github.io), או שבדפדפן הזה אין נתונים.</div>' +
      (keys.length ? '<p>מפתחות שנמצאו: ' + esc(keys.join(', ')) + '</p><button class="sec" id="dumpBtn">הורד בכל זאת את כל מה שנמצא</button>' : '');
    var d0 = document.getElementById('dumpBtn'); if (d0) d0.onclick = function () { download('ATLAS_localstorage_dump_' + stamp() + '.json', JSON.stringify(dump, null, 1)); };
    return;
  }
  var S = null; try { S = JSON.parse(raw); } catch (e) { }
  var ents = S && S.entities ? Object.keys(S.entities).length : 0;
  var rows = 0; if (S && S.entities) Object.keys(S.entities).forEach(function (k) { rows += (S.entities[k].rows || []).length; });
  var opsRows = 0; if (S && S.ops) Object.keys(S.ops).forEach(function (k) { opsRows += (S.ops[k].rows || []).length; });
  var emps = S && S.employees ? S.employees.length : 0;
  var saved = S && S.savedAt ? new Date(S.savedAt).toLocaleString('he-IL') : '—';
  var hasData = ents || rows || opsRows || emps;

  out.innerHTML = (hasData ? '<div class="ok"><b>נמצאו נתונים במכשיר הזה.</b></div>' : '<div class="bad"><b>המכשיר הזה מכיל מצב ריק.</b> כנראה שהנתונים כבר נמחקו גם כאן.</div>') +
    '<table><tr><th>פריט</th><th>כמות</th></tr>' +
    '<tr><td>חוצצי פרויקטים</td><td>' + ents + '</td></tr>' +
    '<tr><td>שורות בפרויקטים</td><td>' + rows + '</td></tr>' +
    '<tr><td>שורות בתפעול (משכורות, בנק, אשראי…)</td><td>' + opsRows + '</td></tr>' +
    '<tr><td>עובדים</td><td>' + emps + '</td></tr>' +
    '<tr><td>נשמר לאחרונה</td><td>' + esc(saved) + '</td></tr></table>' +
    '<button id="b1">⬇ הורדת קובץ הגיבוי</button>' +
    '<button class="sec" id="b2">⬇ הורדת עותק מלא של כל מה ששמור (לגיבוי נוסף)</button>' +
    '<p><small>אחרי ההורדה שמור את הקבצים (בקבצים / Downloads) ושלח אותם אליי. אל תפתח את האתר הרגיל בינתיים.</small></p>';
  document.getElementById('b1').onclick = function () { download('ATLAS_backup_ipad_' + stamp() + '.json', raw); };
  document.getElementById('b2').onclick = function () { download('ATLAS_localstorage_dump_' + stamp() + '.json', JSON.stringify(dump, null, 1)); };
})();
</script>
</body>
</html>
